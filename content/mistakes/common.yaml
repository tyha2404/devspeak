# Common English mistakes of Vietnamese developers: grammar, word choice, register,
# pronunciation of IT terms and reading symbols aloud. Referenced by unit "mistakes" lessons.

# ----- grammar & word choice -----
- slug: discuss-about
  kind: grammar
  wrong: "Let's discuss about the API design."
  right: "Let's discuss the API design."
  explanation_vi: '"Discuss" là ngoại động từ, không cần "about". (Nhưng nói "talk about" thì đúng.)'
  tags: [meetings]
- slug: explain-me
  kind: grammar
  wrong: "Can you explain me this function?"
  right: "Can you explain this function to me?"
  explanation_vi: '"Explain" không đi trực tiếp với người nghe: explain something to someone.'
  tags: [chat]
- slug: code-not-work
  kind: grammar
  wrong: "The code not work."
  right: "The code doesn't work."
  explanation_vi: "Câu phủ định ở hiện tại đơn cần trợ động từ: doesn't/don't + động từ nguyên mẫu."
  tags: [bug]
- slug: question-need-to-ask
  kind: grammar
  wrong: "I have a question need to ask."
  right: "I have a question. / Can I ask you something?"
  explanation_vi: 'Dịch từng chữ từ "mình có câu hỏi cần hỏi" tạo ra hai động từ chính trong một câu. Tách câu hoặc hỏi thẳng.'
  tags: [chat]
- slug: fix-bug-article
  kind: grammar
  wrong: "I fixed bug in login page."
  right: "I fixed a bug on the login page."
  explanation_vi: "Danh từ đếm được số ít cần mạo từ (a/the). Tiếng Việt không có mạo từ nên rất dễ quên."
  tags: [standup, bug]
- slug: im-developer
  kind: grammar
  wrong: "I'm developer at FPT."
  right: "I'm a developer at FPT."
  explanation_vi: 'Nghề nghiệp cần "a/an": I''m a developer, I''m an engineer.'
  tags: [onboarding]
- slug: yesterday-past
  kind: grammar
  wrong: "Yesterday I finish the login API."
  right: "Yesterday I finished the login API."
  explanation_vi: 'Có "yesterday" thì động từ chia quá khứ đơn (finished, fixed, wrote).'
  tags: [standup]
- slug: negative-question-answer
  kind: grammar
  wrong: "— Don't you have access to the repo? — Yes. (ý là: không có)"
  right: "— Don't you have access to the repo? — No, I don't."
  explanation_vi: 'Tiếng Anh trả lời theo sự thật, không theo câu hỏi: không có quyền thì nói "No, I don''t".'
  tags: [chat]
- slug: inform-structure
  kind: word-choice
  wrong: "I will inform you the result."
  right: "I'll let you know the result. / I'll inform you of the result."
  explanation_vi: '"Inform" cần "of/about" và khá trang trọng; trên Slack nói "let you know" tự nhiên hơn.'
  tags: [chat, email]
- slug: same-same
  kind: word-choice
  wrong: "My code is same same with yours."
  right: "My code is the same as yours. / My code is similar to yours."
  explanation_vi: '"Same same" là tiếng lóng Đông Nam Á; dùng "the same as" hoặc "similar to".'
  tags: [chat]
- slug: i-will-try
  kind: register
  wrong: "I will try to finish it."
  right: "I'll finish it by Thursday. / I should be able to finish it by Thursday."
  explanation_vi: '"I''ll try" nghe như bạn không chắc làm được. Nêu cam kết cụ thể, hoặc nói rõ rủi ro.'
  tags: [standup, planning]
- slug: please-kindly
  kind: register
  wrong: "Please kindly review my PR."
  right: "Could you review my PR when you have a moment?"
  explanation_vi: '"Please kindly" nghe cứng và hơi cũ. Câu hỏi với "Could you…" lịch sự và tự nhiên hơn.'
  tags: [chat, code-review]
- slug: dear-sir-slack
  kind: register
  wrong: "Dear Sir, I want to ask about the deployment."
  right: "Hi Raj, quick question about the deployment:"
  explanation_vi: 'Slack/Teams rất thân mật: "Hi + tên". "Dear Sir" chỉ hợp email rất trang trọng khi không biết tên.'
  tags: [chat]
- slug: sorry-for-late-reply
  kind: register
  wrong: "Sorry for my late reply, sorry for the inconvenience, sorry…"
  right: "Thanks for your patience! Here's the update:"
  explanation_vi: "Xin lỗi quá nhiều làm tin nhắn nặng nề. Cảm ơn sự kiên nhẫn rồi vào việc ngay."
  tags: [chat, email]

# ----- pronunciation of IT terms -----
- {
    slug: say-cache,
    kind: pronunciation,
    right: cache,
    say: '/kæʃ/ — giống "cash"',
    explanation_vi: 'Không đọc "ca-chê" hay "kết".',
    tags: [tech],
  }
- {
    slug: say-queue,
    kind: pronunciation,
    right: queue,
    say: '/kjuː/ — giống chữ "Q"',
    explanation_vi: "Bốn nguyên âm cuối đều câm.",
    tags: [tech],
  }
- {
    slug: say-suite,
    kind: pronunciation,
    right: "test suite",
    say: '/swiːt/ — giống "sweet"',
    explanation_vi: 'Không đọc giống "suit" (bộ vest).',
    tags: [testing],
  }
- {
    slug: say-sql,
    kind: pronunciation,
    right: SQL,
    say: '"S-Q-L" hoặc "sequel"',
    explanation_vi: "Cả hai cách đều phổ biến; giữ một cách cho nhất quán trong team.",
    tags: [database],
  }
- {
    slug: say-nginx,
    kind: pronunciation,
    right: nginx,
    say: '"engine-x"',
    explanation_vi: "Tên chính thức đọc là engine-x.",
    tags: [devops],
  }
- {
    slug: say-linux,
    kind: pronunciation,
    right: Linux,
    say: '/ˈlɪnəks/ — "LIN-ux"',
    explanation_vi: 'Không đọc "lai-nớt".',
    tags: [tech],
  }
- {
    slug: say-sudo,
    kind: pronunciation,
    right: sudo,
    say: '/ˈsuːduː/ — "SOO-doo"',
    explanation_vi: 'Viết tắt của "superuser do".',
    tags: [tech],
  }
- {
    slug: say-deploy,
    kind: pronunciation,
    right: deploy,
    say: "/dɪˈplɔɪ/ — nhấn âm 2: di-PLOY",
    explanation_vi: "Nhấn trọng âm vào âm tiết thứ hai.",
    tags: [devops],
  }
- {
    slug: say-height-width,
    kind: pronunciation,
    right: "height / width",
    say: "/haɪt/ — /wɪdθ/",
    explanation_vi: 'Height đọc "hai-t" (không phải "hây"); width có âm /θ/ cuối.',
    tags: [frontend],
  }
- {
    slug: say-api,
    kind: pronunciation,
    right: API,
    say: '"A-P-I" /ˌeɪ.piːˈaɪ/',
    explanation_vi: "Đọc từng chữ cái, nhấn chữ cuối.",
    tags: [api],
  }
- {
    slug: say-data,
    kind: pronunciation,
    right: data,
    say: "/ˈdeɪtə/ hoặc /ˈdætə/",
    explanation_vi: 'Cả hai đều đúng (Mỹ/Anh); không đọc "đa-ta" kiểu tiếng Việt.',
    tags: [database],
  }

# ----- reading symbols & numbers aloud -----
- {
    slug: sym-brackets,
    kind: symbol,
    right: "( ) [ ] { } < >",
    say: "parentheses · square brackets · curly braces · angle brackets",
    explanation_vi: 'Dev bản xứ hay nói tắt: "parens", "brackets", "curlies".',
    tags: [code],
  }
- {
    slug: sym-operators,
    kind: symbol,
    right: "== != && || =>",
    say: "equals equals · not equal · and · or · arrow",
    explanation_vi: '"!" đọc là "bang" hoặc "not"; "=>" là "arrow" (fat arrow).',
    tags: [code],
  }
- {
    slug: sym-misc,
    kind: symbol,
    right: "# ~ _ / \\ | ` ^ *",
    say: "hash · tilde · underscore · slash · backslash · pipe · backtick · caret · asterisk (star)",
    explanation_vi: '# ở Mỹ còn gọi là "pound"; * thường gọi là "star".',
    tags: [code],
  }
- {
    slug: num-version,
    kind: symbol,
    right: "v2.10.3",
    say: '"version two point ten point three"',
    explanation_vi: 'Mỗi số đọc riêng, dấu chấm đọc là "point" (hoặc "dot").',
    tags: [code],
  }
- {
    slug: num-units,
    kind: symbol,
    right: "200ms · 16GB · 1.5k · 99.9%",
    say: "two hundred milliseconds · sixteen gigs · one point five K · ninety-nine point nine percent",
    explanation_vi: 'Dev thường nói "gigs", "megs", "K" thay vì đọc đầy đủ.',
    tags: [devops],
  }
- {
    slug: sym-path-url,
    kind: symbol,
    right: "src/app/page.tsx · api.example.com/v1",
    say: "src slash app slash page dot T-S-X · api dot example dot com slash v-one",
    explanation_vi: 'Đường dẫn: "slash"; tên miền: "dot".',
    tags: [code],
  }
