# Developer vocabulary: Focus, Movement & Sustainable Routines. Original definitions and curated examples.
- slug: t14-warm-up-pv
  lemma: warm up
  pos: phrasal_verb
  kind: phrasal
  cefr: B1
  topic: active-life
  ipa: /ˌwɔːm ˈʌp/
  def: To do gentle exercise to prepare your body before harder exercise.
  vi: khởi động (trước khi tập)
  forms:
    - warms up
    - warmed up
    - warming up
    - warm-up
  examples:
    - en: Always warm up for five minutes before you run.
      vi: Luôn khởi động năm phút trước khi chạy.
- slug: t14-stretch-v
  lemma: stretch
  pos: verb
  cefr: B1
  topic: active-life
  ipa: /stretʃ/
  def: To make your arms, legs or body as long as possible to loosen your muscles.
  vi: giãn cơ, vươn người
  forms:
    - stretches
    - stretched
    - stretching
  examples:
    - en: I stand up and stretch every time my build is running.
      vi: Mỗi lần chờ build chạy là mình đứng dậy giãn cơ.
- slug: t14-jog-v
  lemma: jog
  pos: verb
  cefr: A2
  topic: active-life
  ipa: /dʒɒɡ/
  def: To run slowly and steadily for exercise.
  vi: chạy bộ chậm
  forms:
    - jogs
    - jogged
    - jogging
  examples:
    - en: We go jogging around the lake before work.
      vi: Tụi mình chạy bộ quanh hồ trước giờ làm.
- slug: t14-take-the-stairs-phr
  lemma: take the stairs
  pos: phrase
  kind: phrase
  cefr: A2
  topic: active-life
  ipa: /ˌteɪk ðə ˈsteəz/
  def: To walk up or down the stairs instead of using the lift.
  vi: đi thang bộ
  forms:
    - takes the stairs
    - took the stairs
    - taking the stairs
  examples:
    - en: I take the stairs to the eighth floor every morning.
      vi: Sáng nào mình cũng đi thang bộ lên tầng tám.
- slug: t14-sedentary-adj
  lemma: sedentary
  pos: adjective
  cefr: C1
  topic: active-life
  ipa: /ˈsedntri/
  def: Involving a lot of sitting and very little physical activity.
  vi: ít vận động
  examples:
    - en: Developers often have a sedentary lifestyle, so short walks matter.
      vi: Lập trình viên thường có lối sống ít vận động nên những lần đi bộ ngắn rất
        quan trọng.
- slug: t14-posture-n
  lemma: posture
  pos: noun
  cefr: B1
  topic: active-life
  ipa: /ˈpɒstʃə/
  def: The way you hold your body when you sit or stand.
  vi: tư thế (ngồi, đứng)
  examples:
    - en: Raise your monitor to improve your posture.
      vi: Kê màn hình cao lên để cải thiện tư thế ngồi.
- slug: t14-muscle-n
  lemma: muscle
  pos: noun
  cefr: B1
  topic: active-life
  ipa: /ˈmʌsl/
  def: One of the parts inside your body that tighten and relax to make you move.
  vi: cơ bắp
  forms:
    - muscles
  examples:
    - en: Sitting all day makes the muscles in your back weak.
      vi: Ngồi cả ngày làm cơ lưng yếu đi.
- slug: t14-in-shape-phr
  lemma: in shape
  pos: phrase
  kind: phrase
  cefr: B1
  topic: active-life
  ipa: /ɪn ˈʃeɪp/
  def: Physically fit and healthy. The opposite is 'out of shape'.
  vi: có thể lực tốt, cân đối
  forms:
    - in good shape
    - get in shape
    - stay in shape
  examples:
    - en: I want to get in shape before the company trip to Sa Pa.
      vi: Mình muốn lấy lại thể lực trước chuyến đi Sa Pa của công ty.
- slug: t14-work-out-pv
  lemma: work out
  pos: phrasal_verb
  kind: phrasal
  cefr: A2
  topic: active-life
  ipa: /wɜːk ˈaʊt/
  def: To do physical exercise to stay fit and strong.
  vi: tập thể dục, tập gym
  forms:
    - works out
    - worked out
    - working out
    - workout
  examples:
    - en: I work out at the gym three times a week after work.
      vi: Mình tập gym ba buổi một tuần sau giờ làm.
- slug: t14-fitness-tracker-n
  lemma: fitness tracker
  pos: noun
  kind: collocation
  cefr: B1
  topic: active-life
  ipa: /ˈfɪtnəs ˌtrækə/
  def: A small device, often worn on the wrist, that counts your steps, heart rate
    and sleep.
  vi: vòng đeo theo dõi sức khoẻ
  forms:
    - fitness trackers
  examples:
    - en: My fitness tracker says I only walked 900 steps today.
      vi: Vòng theo dõi sức khoẻ báo hôm nay mình chỉ đi được 900 bước.
- slug: t14-take-a-break-phr
  lemma: take a break
  pos: phrase
  kind: phrase
  cefr: A2
  topic: active-life
  ipa: /teɪk ə ˈbreɪk/
  def: To stop working or doing something for a short time to rest.
  vi: nghỉ giải lao
  forms:
    - takes a break
    - took a break
    - taking a break
  examples:
    - en: Let's take a break and come back to this bug in ten minutes.
      vi: Nghỉ giải lao chút rồi mười phút nữa quay lại con bug này nhé.
- slug: t14-lunch-break-n
  lemma: lunch break
  pos: noun
  kind: collocation
  cefr: A2
  topic: active-life
  ipa: /ˈlʌntʃ ˌbreɪk/
  def: The time in the middle of the day when you stop work to eat.
  vi: giờ nghỉ trưa
  forms:
    - lunch breaks
    - lunchtime
  examples:
    - en: Many people take a short nap during the lunch break.
      vi: Nhiều người chợp mắt một chút trong giờ nghỉ trưa.
- slug: t14-screen-time-n
  lemma: screen time
  pos: noun
  kind: collocation
  cefr: B1
  topic: active-life
  ipa: /ˈskriːn taɪm/
  def: The amount of time you spend looking at a phone, computer or TV.
  vi: thời gian dùng màn hình
  examples:
    - en: My screen time was nine hours yesterday, not counting work.
      vi: Hôm qua thời gian dùng màn hình của mình là chín tiếng, chưa tính giờ làm.
- slug: t14-eye-strain-n
  lemma: eye strain
  pos: noun
  kind: collocation
  cefr: B1
  topic: active-life
  ipa: /ˈaɪ streɪn/
  def: Tired, sore eyes, for example after looking at a screen for too long.
  vi: mỏi mắt
  forms:
    - eyestrain
  examples:
    - en: Dark mode helps a little with eye strain at night.
      vi: Chế độ tối giúp đỡ mỏi mắt một chút vào ban đêm.
- slug: t14-headache-n
  lemma: headache
  pos: noun
  cefr: A2
  topic: active-life
  ipa: /ˈhedeɪk/
  def: A pain in your head.
  vi: cơn đau đầu
  forms:
    - headaches
  note: Nói "I have a headache", không nói "I am headache".
  examples:
    - en: I have a headache after staring at logs all morning.
      vi: Mình bị đau đầu sau cả buổi sáng nhìn log.
- slug: t14-stay-hydrated-phr
  lemma: stay hydrated
  pos: phrase
  kind: phrase
  cefr: B1
  topic: active-life
  ipa: /steɪ haɪˈdreɪtɪd/
  def: To drink enough water during the day.
  vi: uống đủ nước
  forms:
    - stays hydrated
    - stayed hydrated
    - staying hydrated
  examples:
    - en: Keep a bottle on your desk to stay hydrated.
      vi: Để một chai nước trên bàn để uống đủ nước nhé.
- slug: t14-notification-n
  lemma: notification
  pos: noun
  cefr: B1
  topic: active-life
  ipa: /ˌnəʊtɪfɪˈkeɪʃn/
  def: A short message from an app that tells you something new has happened.
  vi: thông báo
  forms:
    - notifications
    - notify
  examples:
    - en: I turn off notifications when I need to focus.
      vi: Mình tắt thông báo khi cần tập trung.
- slug: t14-mute-v
  lemma: mute
  pos: verb
  cefr: B1
  topic: active-life
  ipa: /mjuːt/
  def: To stop sounds or alerts from a chat, app or microphone.
  vi: tắt tiếng
  examples:
    - en: I mute the team channel at weekends.
      vi: Cuối tuần mình tắt tiếng channel của nhóm.
- slug: t14-wind-down-pv
  lemma: wind down
  pos: phrasal_verb
  kind: phrasal
  cefr: B2
  topic: active-life
  ipa: /waɪnd ˈdaʊn/
  def: To relax slowly after a busy or stressful time.
  vi: thư giãn dần, xả hơi
  forms:
    - winds down
    - wound down
    - winding down
  note: Ở đây "wind" đọc là /waɪnd/, không phải /wɪnd/ (gió).
  examples:
    - en: I read a book to wind down before bed.
      vi: Mình đọc sách để thư giãn trước khi ngủ.
- slug: t14-disconnect-v
  lemma: disconnect
  pos: verb
  cefr: B2
  topic: active-life
  ipa: /ˌdɪskəˈnekt/
  def: To stop being connected to the internet, or to take a break from work and
    screens.
  vi: ngắt kết nối
  forms:
    - disconnects
    - disconnected
    - disconnecting
  examples:
    - en: On holiday, I try to disconnect completely from work chats.
      vi: Khi đi nghỉ, mình cố ngắt kết nối hoàn toàn khỏi các nhóm chat công việc.
- lemma: short break
  pos: noun
  vi: khoảng nghỉ ngắn
  def: A brief pause in work or another activity.
  examples:
    - en: Let's take a short break before the next review.
  slug: t14-short-break-n
  topic: active-life
  cefr: B1
  kind: collocation
- lemma: rest
  pos: noun
  vi: sự nghỉ ngơi
  def: Time spent recovering without demanding work.
  examples:
    - en: Plan enough rest after an overnight incident.
  slug: t14-rest-n
  topic: active-life
  cefr: B1
- lemma: focus time
  pos: noun
  vi: khoảng thời gian tập trung
  def: Time reserved for working without interruptions.
  examples:
    - en: I have focus time until ten, but you can call for an incident.
  slug: t14-focus-time-n
  topic: active-life
  cefr: B1
  kind: collocation
- slug: t14-do-not-disturb-n
  lemma: do not disturb
  pos: noun
  kind: collocation
  cefr: B1
  topic: active-life
  ipa: /ˌduː nɒt dɪˈstɜːb/
  def: A setting that stops calls and alerts for a time.
  vi: chế độ không làm phiền
  examples:
    - en: My chat is on do not disturb after 8 pm.
      vi: Sau 8 giờ tối chat của mình bật chế độ không làm phiền.
- slug: t14-attention-span-n
  lemma: attention span
  pos: noun
  kind: collocation
  cefr: C1
  topic: active-life
  ipa: /əˈtenʃn spæn/
  def: How long you can focus on one thing before you lose interest.
  vi: khả năng tập trung (trong một khoảng thời gian)
  forms:
    - attention spans
  examples:
    - en: My attention span is so short that I can't finish a long article.
      vi: Khả năng tập trung của mình kém đến mức không đọc hết nổi một bài báo dài.
- slug: t14-distraction-n
  lemma: distraction
  pos: noun
  cefr: B1
  topic: active-life
  ipa: /dɪˈstrækʃn/
  def: Something that takes your attention away from what you are doing.
  vi: điều gây xao nhãng
  examples:
    - en: Phone notifications are my biggest distraction.
      vi: Thông báo điện thoại là thứ làm mình xao nhãng nhất.
- slug: t14-interrupt-v
  lemma: interrupt
  pos: verb
  cefr: B1
  topic: active-life
  ipa: /ˌɪntəˈrʌpt/
  def: To stop someone while they are speaking or working.
  vi: ngắt lời, làm gián đoạn
  forms:
    - interrupts
    - interrupted
    - interrupting
    - interruption
  examples:
    - en: Sorry to interrupt, but the client is on the line.
      vi: Xin lỗi vì ngắt lời, nhưng khách hàng đang chờ máy.
- slug: t14-urgent-adj
  lemma: urgent
  pos: adjective
  cefr: B1
  topic: active-life
  ipa: /ˈɜːdʒənt/
  def: Needing attention or action immediately.
  vi: khẩn cấp
  examples:
    - en: If it's urgent, call me; otherwise it can wait until Monday.
      vi: Nếu gấp thì gọi mình, còn không thì để đến thứ Hai.
- slug: t14-core-hours-n
  lemma: core hours
  pos: noun
  kind: collocation
  cefr: B2
  topic: active-life
  ipa: /ˈkɔː(r) ˌaʊəz/
  def: The part of the day when everyone on a team must be available.
  vi: giờ làm việc bắt buộc chung
  examples:
    - en: Our core hours are 10 to 3; the rest is up to you.
      vi: Giờ chung bắt buộc là 10 đến 3 giờ; thời gian còn lại tùy bạn.
- slug: t14-availability-n
  lemma: availability
  pos: noun
  cefr: B1
  topic: active-life
  ipa: /əˌveɪləˈbɪləti/
  def: The times when you are free to work, meet or answer.
  vi: thời gian rảnh/có thể làm việc
  examples:
    - en: Please add your availability to the shared calendar.
      vi: Bạn thêm thời gian có thể làm việc vào lịch chung nhé.
- slug: t14-reachable-adj
  lemma: reachable
  pos: adjective
  cefr: B1
  topic: active-life
  ipa: /ˈriːtʃəbl/
  def: Possible to contact, for example by phone or message.
  vi: có thể liên lạc được
  examples:
    - en: I'm reachable by phone if production goes down.
      vi: Nếu production sập thì có thể gọi điện cho mình.
- slug: t14-ping-v
  lemma: ping
  pos: verb
  cefr: B1
  topic: active-life
  ipa: /pɪŋ/
  def: To send someone a short message on chat.
  vi: nhắn (ai đó)
  examples:
    - en: Ping me before six if you need a review today.
      vi: Nếu cần review trong hôm nay thì nhắn mình trước sáu giờ.
- slug: t14-time-management-n
  lemma: time management
  pos: noun
  kind: collocation
  cefr: B2
  topic: active-life
  ipa: /ˈtaɪm ˌmænɪdʒmənt/
  def: The ability to plan and use your time well.
  vi: quản lý thời gian
  forms:
    - manage your time
  examples:
    - en: Time management is hard when you have meetings all day.
      vi: Quản lý thời gian rất khó khi bạn phải họp cả ngày.
- slug: t14-prioritize-v
  lemma: prioritize
  pos: verb
  cefr: B1
  topic: active-life
  ipa: /praɪˈɒrətaɪz/
  def: To decide which things are most important and do them first.
  vi: ưu tiên, sắp xếp thứ tự ưu tiên
  forms:
    - prioritizes
    - prioritized
    - prioritizing
    - prioritise
  examples:
    - en: We need to prioritize the payment bug over the new design.
      vi: Mình cần ưu tiên lỗi thanh toán trước thiết kế mới.
- slug: t14-to-do-list-n
  lemma: to-do list
  pos: noun
  kind: collocation
  cefr: A2
  topic: active-life
  ipa: /təˈduː ˌlɪst/
  def: A list of the things you need to do.
  vi: danh sách việc cần làm
  forms:
    - to-do lists
  examples:
    - en: I write a to-do list every morning before I open Slack.
      vi: Sáng nào mình cũng viết danh sách việc cần làm trước khi mở Slack.
- slug: t14-productive-adj
  lemma: productive
  pos: adjective
  cefr: B1
  topic: active-life
  ipa: /prəˈdʌktɪv/
  def: Getting a lot of useful work done.
  vi: làm việc hiệu quả, năng suất
  forms:
    - productivity
    - more productive
  examples:
    - en: I am more productive in the morning than after lunch.
      vi: Buổi sáng mình làm việc năng suất hơn sau bữa trưa.
- slug: t14-exhausted-adj
  lemma: exhausted
  pos: adjective
  cefr: B1
  topic: active-life
  ipa: /ɪɡˈzɔːstɪd/
  def: Extremely tired.
  vi: kiệt sức, mệt rã rời
  forms:
    - exhausting
    - exhaustion
  examples:
    - en: I was exhausted after the all-night incident call.
      vi: Mình mệt rã rời sau cuộc gọi xử lý sự cố suốt đêm.
- slug: t14-recover-v
  lemma: recover
  pos: verb
  cefr: B1
  topic: active-life
  ipa: /rɪˈkʌvə/
  def: To become healthy again after being ill or tired.
  vi: hồi phục
  forms:
    - recovers
    - recovered
    - recovering
    - recovery
  examples:
    - en: Take a few days off to recover properly.
      vi: Nghỉ vài ngày để hồi phục hẳn nhé.
- slug: t14-recovery-n
  lemma: recovery
  pos: noun
  cefr: B2
  topic: active-life
  ipa: /rɪˈkʌvəri/
  def: The process of becoming healthy again after an illness or injury.
  vi: quá trình hồi phục
  forms:
    - recoveries
  examples:
    - en: We all wish you a quick recovery, and don't worry about the sprint.
      vi: Cả nhóm chúc bạn mau hồi phục, đừng lo chuyện sprint nhé.
- slug: t14-sleep-deprived-adj
  lemma: sleep-deprived
  pos: adjective
  cefr: C1
  topic: active-life
  ipa: /ˈsliːp dɪˌpraɪvd/
  def: Very tired because you have not had enough sleep for some time.
  vi: thiếu ngủ trầm trọng
  forms:
    - sleep deprived
  examples:
    - en: Sleep-deprived engineers ship more bugs.
      vi: Kỹ sư thiếu ngủ thì đẩy lên nhiều bug hơn.
- slug: t14-burnout-n
  lemma: burnout
  pos: noun
  cefr: B2
  topic: active-life
  ipa: /ˈbɜːnaʊt/
  def: Feeling completely tired and unable to work because of too much stress for
    a long time.
  vi: tình trạng kiệt sức (vì công việc)
  keep_en: true
  forms:
    - burned out
    - burnt out
  examples:
    - en: After three months of overtime, half the team had burnout.
      vi: Sau ba tháng tăng ca, nửa team bị burnout.
- slug: t14-overwork-v
  lemma: overwork
  pos: verb
  cefr: B2
  topic: active-life
  ipa: /ˌəʊvəˈwɜːk/
  def: To work too much, or make someone work too much.
  vi: làm việc quá sức
  examples:
    - en: Please don't overwork to hit this deadline.
      vi: Đừng làm quá sức để kịp deadline này nhé.
- slug: t14-downtime-n
  lemma: downtime
  pos: noun
  cefr: C1
  topic: active-life
  ipa: /ˈdaʊntaɪm/
  def: Time when you rest and do not work.
  vi: thời gian nghỉ ngơi
  examples:
    - en: Everyone needs some downtime after a big launch.
      vi: Ai cũng cần thời gian nghỉ ngơi sau một đợt ra mắt lớn.
- slug: t14-well-being-n
  lemma: well-being
  pos: noun
  cefr: B2
  topic: active-life
  ipa: /ˈwel biːɪŋ/
  def: The state of being healthy, comfortable and happy.
  vi: sự khoẻ mạnh, an vui (thể chất và tinh thần)
  forms:
    - wellbeing
  examples:
    - en: The new policy puts employee well-being before overtime.
      vi: Chính sách mới đặt sức khoẻ và hạnh phúc của nhân viên lên trên việc làm
        thêm giờ.
- slug: t14-work-life-balance-n
  lemma: work-life balance
  pos: noun
  kind: collocation
  cefr: B1
  topic: active-life
  ipa: /ˌwɜːk ˈlaɪf ˌbæləns/
  def: A healthy mix of time for your job and time for your family, rest and
    hobbies.
  vi: cân bằng giữa công việc và cuộc sống
  examples:
    - en: Good work-life balance means not reading Slack at midnight.
      vi: Cân bằng công việc và cuộc sống là không đọc Slack lúc nửa đêm.
- slug: t14-pressure-n
  lemma: pressure
  pos: noun
  cefr: B1
  topic: active-life
  ipa: /ˈpreʃə(r)/
  def: A feeling that you must do something, which can make you worried.
  vi: áp lực
  examples:
    - en: There's no pressure to talk about it.
      vi: Không có áp lực phải kể đâu.
- slug: t14-cope-with-pv
  lemma: cope with
  pos: phrasal_verb
  kind: phrasal
  cefr: B2
  topic: active-life
  ipa: /ˈkəʊp wɪð/
  def: To deal successfully with a difficult situation or feeling.
  vi: đương đầu với, đối phó với
  forms:
    - copes with
    - coped with
    - coping with
  examples:
    - en: Everyone copes with stress differently; I go for a long walk.
      vi: Mỗi người đối phó với căng thẳng một kiểu; mình thì đi bộ thật lâu.
- slug: t14-self-care-n
  lemma: self-care
  pos: noun
  cefr: B2
