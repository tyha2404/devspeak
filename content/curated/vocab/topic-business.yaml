  vi: định nghĩa hoàn thành
  examples:
    - en: Our definition of done includes testing with missing data.
      vi: Định nghĩa hoàn thành của bọn mình gồm cả việc test với dữ liệu thiếu.
- slug: t21-review-date-n
  lemma: review date
  pos: noun
  kind: collocation
  cefr: B1
  topic: economy
  ipa: /rɪˈvjuː deɪt/
  def: A planned date to check a decision again.
  vi: ngày xem xét lại
  examples:
    - en: Set a review date three months from now.
      vi: Hãy đặt ngày xem xét lại sau ba tháng nữa.
