  cefr: B2
  topic: economy
  ipa: /teɪk ˈəʊnəʃɪp/
  def: To accept that a task or problem is yours to solve.
  vi: nhận trách nhiệm
  examples:
    - en: I'll take ownership of the flaky tests this sprint.
      vi: Sprint này mình sẽ nhận trách nhiệm xử lý các test chập chờn.
