  pos: phrase
  vi: thực hiện đến cùng điều đã hứa
  def: To complete an action that was promised or started.
  examples:
    - en: We need to follow through on the agreed improvements.
  slug: t21-follow-through-phr
  topic: economy
  cefr: B2
  kind: phrase
- slug: t21-action-item-n
  lemma: action item
  pos: noun
  kind: collocation
  cefr: B2
  topic: economy
  ipa: /ˈækʃn ˈaɪtəm/
  def: A task someone agrees to do after a meeting.
  vi: việc cần làm
  examples:
