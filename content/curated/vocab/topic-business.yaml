# Developer vocabulary: Product Thinking & Business Context. Original definitions and curated examples.
- lemma: user
  pos: noun
  vi: người sử dụng
  def: A person who interacts with a product or system.
  examples:
    - en: The user can download previous invoices from the account page.
  slug: t21-user-n
  topic: economy
  cefr: B2
- lemma: customer
  pos: noun
  vi: khách hàng
  def: A person or organisation that buys a product or service.
  examples:
    - en: The customer needs an invoice for this subscription.
  slug: t21-customer-n
  topic: economy
  cefr: B2
- slug: t21-target-user-n
  lemma: target user
  pos: noun
  kind: collocation
  cefr: B2
  topic: economy
  ipa: /ˌtɑːɡɪt ˈjuːzə/
  def: The kind of person a product is mainly made for.
  vi: người dùng mục tiêu
  examples:
    - en: My target users are freelancers who work in cafés.
      vi: Người dùng mục tiêu của mình là freelancer làm việc ở quán cà phê.
- slug: t21-pain-point-n
  lemma: pain point
  pos: noun
  kind: collocation
  cefr: B2
  topic: economy
  ipa: /ˈpeɪn pɔɪnt/
  def: A problem that annoys users and that a product can fix.
  vi: điểm khó chịu (của người dùng)
  examples:
    - en: The biggest pain point was finding a quiet place to work.
      vi: Điểm khó chịu lớn nhất là tìm một chỗ yên tĩnh để làm việc.
- slug: t21-use-case-n
  lemma: use case
  pos: noun
  kind: collocation
  cefr: B2
  topic: economy
  ipa: /ˈjuːs keɪs/
  def: A particular situation in which a product is used.
  vi: trường hợp sử dụng
  examples:
    - en: The main use case is splitting bills after team lunches.
      vi: Trường hợp sử dụng chính là chia tiền sau các bữa trưa của team.
- slug: t21-problem-statement-n
  lemma: problem statement
  pos: noun
  kind: collocation
  cefr: B2
  topic: economy
  ipa: /ˈprɒbləm steɪtmənt/
  def: A short, clear description of the problem you want to solve.
  vi: mô tả vấn đề
  examples:
    - en: The problem statement fits in two sentences.
      vi: Phần mô tả vấn đề gói gọn trong hai câu.
- lemma: need
  pos: noun
  vi: nhu cầu cần được đáp ứng
  def: Something necessary to achieve a goal or solve a problem.
  examples:
    - en: The user need is faster access to previous invoices.
  slug: t21-need-n
  topic: economy
  cefr: B2
- lemma: goal
  pos: noun
  vi: mục tiêu mong muốn
  def: An outcome that someone wants to achieve.
  examples:
    - en: The goal is to reduce failed bookings.
  slug: t21-goal-n
  topic: economy
  cefr: B2
- slug: t21-context-n
  lemma: context
  pos: noun
  cefr: B1
  topic: economy
  ipa: /ˈkɒntekst/
  def: The background facts that help someone understand a situation.
  vi: ngữ cảnh, bối cảnh
  examples:
    - en: "Add some context: which service, which branch, which command."
      vi: "Thêm chút ngữ cảnh: service nào, nhánh nào, lệnh nào."
- lemma: value
  pos: noun
  vi: giá trị mang lại
  def: The usefulness or benefit provided to someone.
  examples:
    - en: Explain the value of this feature to the customer.
  slug: t21-value-n
  topic: economy
  cefr: B2
- lemma: customer interview
  pos: noun
  vi: buổi phỏng vấn khách hàng
  def: A conversation to understand a customer's needs and experiences.
  examples:
    - en: Start the customer interview with a question about their current workflow.
  slug: t21-customer-interview-n
  topic: economy
  cefr: B2
  kind: collocation
- slug: t21-open-question-n
  lemma: open question
  pos: noun
  kind: collocation
  cefr: B2
  topic: economy
  ipa: /ˌəʊpən ˈkwestʃən/
  def: A question that has not been answered or decided yet.
  vi: câu hỏi còn bỏ ngỏ
  examples:
    - en: "Open question: do we need to support IE?"
      vi: "Câu hỏi còn bỏ ngỏ: có cần hỗ trợ IE không?"
- lemma: leading question
  pos: noun
  vi: câu hỏi dẫn dắt câu trả lời
  def: A question that suggests the answer the speaker expects.
  examples:
    - en: Avoid a leading question when interviewing a customer.
  slug: t21-leading-question-n
  topic: economy
  cefr: B2
  kind: collocation
- slug: t21-observation-n
  lemma: observation
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ˌɒbzəˈveɪʃn/
  def: A fact you noticed by watching carefully.
  vi: điều quan sát được
  examples:
    - en: My observation is that the stand-ups often run over time.
      vi: Mình quan sát thấy các buổi stand-up thường bị quá giờ.
- slug: t21-evidence-n
  lemma: evidence
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ˈevɪdəns/
  def: Facts or results that show something is true.
  vi: bằng chứng
  note: 'Không đếm được: "a piece of evidence".'
  examples:
    - en: Is there any evidence that this library is faster?
      vi: Có bằng chứng nào cho thấy thư viện này nhanh hơn không?
- slug: t21-assumption-n
  lemma: assumption
  pos: noun
  cefr: B2
  topic: economy
  ipa: /əˈsʌmpʃn/
  def: Something you believe is true but have not proved.
  vi: giả định
  examples:
    - en: List your assumptions so others can check them.
      vi: Liệt kê các giả định để người khác kiểm tra.
- slug: t21-validate-v
  lemma: validate
  pos: verb
  cefr: B2
  topic: economy
  ipa: /ˈvælɪdeɪt/
  def: To test an idea or result to prove it is correct.
  vi: xác thực, kiểm chứng
  examples:
    - en: Validate the fix on staging before you write it up.
      vi: Kiểm chứng bản sửa trên staging trước khi viết lại.
- slug: t21-listen-v
  lemma: listen
  pos: verb
  cefr: A2
  topic: economy
  ipa: /ˈlɪsn/
  def: To pay attention to what someone is saying.
  vi: lắng nghe
  examples:
    - en: Sometimes the best help is to listen and not give advice.
      vi: Đôi khi cách giúp tốt nhất là lắng nghe và không khuyên gì.
- slug: t21-follow-up-n
  lemma: follow-up
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ˈfɒləʊ ʌp/
  def: A message or action that continues something that happened earlier.
  vi: sự liên hệ tiếp theo
  examples:
    - en: I sent a quick follow-up the morning after the meetup.
      vi: Mình gửi một tin liên hệ ngắn vào sáng hôm sau buổi meetup.
- slug: t21-behaviour-n
  lemma: behaviour
  pos: noun
  cefr: B1
  topic: economy
  ipa: /bɪˈheɪvjə/
  def: The way a program or system acts.
  vi: hành vi, cách hoạt động
  note: Anh-Mỹ viết "behavior".
  examples:
    - en: This behaviour started after yesterday's deploy.
      vi: Hành vi này bắt đầu sau lần deploy hôm qua.
- slug: t21-quote-v
  lemma: quote
  pos: verb
  cefr: B1
  topic: economy
  ipa: /kwəʊt/
  def: To repeat someone's exact words.
  vi: trích dẫn
  examples:
    - en: Quote the user's message in the ticket.
      vi: Trích dẫn tin nhắn của người dùng trong ticket.
- slug: t21-insight-n
  lemma: insight
  pos: noun
  cefr: C1
  topic: economy
  ipa: /ˈɪnsaɪt/
  def: A clear, deep understanding of something.
  vi: hiểu biết sâu sắc
  examples:
    - en: The post gives real insight into how the queue works.
      vi: Bài viết mang lại hiểu biết sâu về cách hàng đợi vận hành.
- slug: t21-requirement-n
  lemma: requirement
  pos: noun
  cefr: B1
  topic: economy
  ipa: /rɪˈkwaɪəmənt/
  def: Something that must be done or must be true.
  vi: yêu cầu, điều kiện bắt buộc
  examples:
    - en: A passing build is a requirement for every merge.
      vi: Build xanh là điều kiện bắt buộc cho mọi lần merge.
- slug: t21-scope-n
  lemma: scope
  pos: noun
  cefr: B2
  topic: economy
  ipa: /skəʊp/
  def: The range of things that something covers.
  vi: phạm vi
  examples:
    - en: The scope of the exception is the billing service only.
      vi: Phạm vi ngoại lệ chỉ là dịch vụ tính tiền.
- slug: t21-non-goal-n
  lemma: non-goal
  pos: noun
  cefr: C1
  topic: economy
  ipa: /ˌnɒn ˈɡəʊl/
  def: Something a project clearly says it will not try to do.
  vi: điều không nằm trong mục tiêu
  examples:
    - en: Predicting floods is a non-goal for version one.
      vi: Dự đoán lũ không nằm trong mục tiêu của phiên bản một.
- slug: t21-acceptance-criteria-n
  lemma: acceptance criteria
  pos: noun
  kind: collocation
  cefr: B2
  topic: economy
  ipa: /əkˈseptəns kraɪˌtɪəriə/
  def: The conditions a feature must meet to be accepted as done.
  vi: tiêu chí chấp nhận
  examples:
    - en: Can you share the acceptance criteria for the export feature?
      vi: Bạn gửi giúp tiêu chí chấp nhận cho tính năng xuất file được không?
- slug: t21-deliverable-n
  lemma: deliverable
  pos: noun
  cefr: C1
  topic: economy
  ipa: /dɪˈlɪvərəbl/
  def: A finished piece of work that you must give to a client or manager.
  vi: sản phẩm bàn giao (theo cam kết)
  forms:
    - deliverables
  examples:
    - en: The main deliverable for this month is the admin dashboard.
      vi: Sản phẩm bàn giao chính tháng này là trang quản trị.
- slug: t21-constraint-n
  lemma: constraint
  pos: noun
  cefr: B2
  topic: economy
  ipa: /kənˈstreɪnt/
  def: Something that limits what you can do.
  vi: ràng buộc
  examples:
    - en: A key constraint is that the data must stay in Vietnam.
      vi: Một ràng buộc quan trọng là dữ liệu phải lưu ở Việt Nam.
- slug: t21-dependency-n
  lemma: dependency
  pos: noun
  cefr: C1
  topic: economy
  ipa: /dɪˈpendənsi/
  def: Something that a system needs in order to work.
  vi: phụ thuộc
  examples:
    - en: Write down every external dependency of the service.
      vi: Hãy ghi lại mọi phụ thuộc bên ngoài của service.
- slug: t21-stakeholder-n
  lemma: stakeholder
  pos: noun
  cefr: C1
  topic: economy
  ipa: /ˈsteɪkhəʊldə/
  def: A person or group who cares about a project and is affected by its result.
  vi: bên liên quan
  forms:
    - stakeholders
  examples:
    - en: We should show the prototype to the main stakeholders first.
      vi: Mình nên cho các bên liên quan chính xem bản prototype trước.
- slug: t21-clarify-v
  lemma: clarify
  pos: verb
  cefr: B1
  topic: economy
  ipa: /ˈklærəfaɪ/
  def: To make something easier to understand by explaining it more.
  vi: làm rõ
  examples:
    - en: Could you clarify what "sync" means in this ticket?
      vi: Bạn làm rõ giúp "sync" trong ticket này nghĩa là gì?
- slug: t21-confirm-v
  lemma: confirm
  pos: verb
  cefr: B1
  topic: economy
  ipa: /kənˈfɜːm/
  def: To say that something is true or that a plan will definitely happen.
  vi: xác nhận
  forms:
    - confirms
    - confirmed
    - confirming
    - confirmation
  examples:
    - en: Could you confirm the meeting time by email?
      vi: Anh/chị xác nhận giờ họp qua email giúp tôi được không?
- lemma: ambiguity
  pos: noun
  vi: sự mơ hồ
  def: A lack of clarity that allows different interpretations.
  examples:
    - en: A concrete example removes ambiguity from the requirement.
  slug: t21-ambiguity-n
  topic: economy
  cefr: B2
- slug: t21-out-of-scope-phr
  lemma: out of scope
  pos: phrase
  kind: phrase
  cefr: B2
  topic: economy
  ipa: /aʊt əv skəʊp/
  def: Not included in the work that was agreed.
  vi: ngoài phạm vi
  examples:
    - en: Dark mode is out of scope for the first version.
      vi: Chế độ tối nằm ngoài phạm vi của phiên bản đầu.
- slug: t21-in-scope-phr
  lemma: in scope
  pos: phrase
  kind: phrase
  cefr: B2
  topic: economy
  ipa: /ɪn ˈskəʊp/
  def: Included in what a review or project covers.
  vi: nằm trong phạm vi
  examples:
    - en: Only the payment system is in scope for this audit.
      vi: Chỉ hệ thống thanh toán nằm trong phạm vi đợt kiểm toán này.
- slug: t21-edge-case-n
  lemma: edge case
  pos: noun
  kind: collocation
  cefr: C1
  topic: economy
  ipa: /ˈedʒ keɪs/
  def: An unusual situation at the limit of what a system expects.
  vi: trường hợp biên
  examples:
    - en: Explain the edge cases, not only the happy path.
      vi: Hãy giải thích các trường hợp biên, không chỉ luồng bình thường.
- slug: t21-priority-n
  lemma: priority
  pos: noun
  cefr: B1
  topic: economy
  ipa: /praɪˈɒrəti/
  def: Something that is more important than other things and should be done first.
  vi: ưu tiên
  examples:
    - en: Your first priority is to learn the release process.
      vi: Ưu tiên đầu tiên của bạn là nắm quy trình release.
- slug: t21-prioritize-v
  lemma: prioritize
  pos: verb
  cefr: B1
  topic: economy
  ipa: /praɪˈɒrətaɪz/
  def: To decide which things are most important and do them first.
  vi: ưu tiên, sắp xếp thứ tự ưu tiên
  forms:
    - prioritizes
    - prioritized
    - prioritizing
    - prioritise
  examples:
    - en: We need to prioritize the payment bug over the new design.
      vi: Mình cần ưu tiên lỗi thanh toán trước thiết kế mới.
- lemma: must-have
  pos: noun
  vi: yêu cầu bắt buộc phải có
  def: Something essential for the intended result.
  examples:
    - en: Accessible checkout is a must-have for this release.
  slug: t21-must-have-n
  topic: economy
  cefr: B2
- lemma: nice-to-have
  pos: noun
  vi: tính năng có thì tốt nhưng chưa bắt buộc
  def: Something useful but not essential.
  examples:
    - en: Custom themes are a nice-to-have for the first release.
  slug: t21-nice-to-have-n
  topic: economy
  cefr: B2
- slug: t21-urgency-n
  lemma: urgency
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ˈɜːdʒənsi/
  def: How quickly something needs to be done.
  vi: mức độ khẩn
  examples:
    - en: Mark the urgency in the first line of your message.
      vi: Ghi mức độ khẩn ở dòng đầu tin nhắn.
- slug: t21-impact-n
  lemma: impact
  pos: noun
  cefr: B1
  topic: economy
  ipa: /ˈɪmpækt/
  def: The effect that something has.
  vi: ảnh hưởng, tác động
  examples:
    - en: What is the impact if we skip the load test?
      vi: Nếu bỏ qua bài kiểm tra tải thì ảnh hưởng là gì?
- lemma: effort
  pos: noun
  vi: công sức cần bỏ ra
  def: The work or energy needed to complete a task.
  examples:
    - en: Estimate the effort before promising a release date.
  slug: t21-effort-n
  topic: economy
  cefr: B2
- slug: t21-estimate-v
  lemma: estimate
  pos: verb
  cefr: B1
  topic: economy
  ipa: /ˈestɪmeɪt/
  def: To guess an amount carefully using the facts you have.
  vi: ước tính
  examples:
    - en: I estimate the API costs at three hundred dollars.
      vi: Mình ước tính chi phí API khoảng ba trăm đô.
- slug: t21-deadline-n
  lemma: deadline
  pos: noun
  cefr: B1
  topic: economy
  ipa: /ˈdedlaɪn/
  def: The time by which something must be finished.
  vi: hạn chót
  examples:
    - en: The deadline for the audit fixes is next Friday.
      vi: Hạn chót sửa các lỗi kiểm toán là thứ Sáu tuần sau.
- slug: t21-milestone-n
  lemma: milestone
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ˈmaɪlstəʊn/
  def: An important point or stage in a project.
  vi: cột mốc (của dự án)
  forms:
    - milestones
  examples:
    - en: The first milestone is a working login page by the end of May.
      vi: Cột mốc đầu tiên là trang đăng nhập chạy được vào cuối tháng Năm.
- slug: t21-timeline-n
  lemma: timeline
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ˈtaɪmlaɪn/
  def: A plan that shows when each part of a project will happen.
  vi: mốc thời gian, lịch trình dự án
  forms:
    - timelines
  examples:
    - en: The timeline looks tight, but we can do it if nobody is sick.
      vi: Lịch trình khá gấp, nhưng nếu không ai ốm thì bọn mình làm kịp.
- slug: t21-roadmap-n
  lemma: roadmap
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ˈrəʊdmæp/
  def: A plan that shows future changes and when they will come.
  vi: lộ trình
  examples:
    - en: The roadmap shows v2 being removed next spring.
      vi: Lộ trình cho thấy v2 sẽ bị gỡ vào mùa xuân tới.
- lemma: backlog
  pos: noun
  vi: danh sách công việc chưa xử lý
  def: A list of work waiting to be prioritised or completed.
  examples:
    - en: Put the optional export feature in the backlog.
  slug: t21-backlog-n
  topic: economy
  cefr: B2
- lemma: defer
  pos: verb
  vi: hoãn sang thời điểm sau
  def: To postpone a task or decision.
  examples:
    - en: We can defer the dashboard redesign until next month.
  slug: t21-defer-v
  topic: economy
  cefr: B2
- slug: t21-trade-off-n
  lemma: trade-off
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ˈtreɪd ɒf/
  def: A balance between two things you cannot have at the same time.
  vi: sự đánh đổi
  examples:
    - en: The trade-off was speed for safety, and it was the right one.
      vi: Sự đánh đổi là tốc độ lấy an toàn, và đó là lựa chọn đúng.
- slug: t21-opportunity-cost-n
  lemma: opportunity cost
  pos: noun
  kind: collocation
  cefr: C1
  topic: economy
  ipa: /ˌɒpəˈtjuːnəti kɒst/
  def: What you lose by choosing one option instead of another.
  vi: chi phí cơ hội
  examples:
    - en: Building it ourselves has an opportunity cost in delayed features.
      vi: Tự làm có chi phí cơ hội là các tính năng bị chậm.
- slug: t21-metric-n
  lemma: metric
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ˈmetrɪk/
  def: A number used to measure something.
  vi: chỉ số
  examples:
    - en: Our main metric is completed sign-ups.
      vi: Chỉ số chính của chúng ta là số lượt đăng ký hoàn tất.
- slug: t21-conversion-rate-n
  lemma: conversion rate
  pos: noun
  kind: collocation
  cefr: C1
  topic: economy
  ipa: /kənˈvɜːʃn reɪt/
  def: The percent of users who complete a goal, like buying.
  vi: tỉ lệ chuyển đổi
  examples:
    - en: The conversion rate rose from 3% to 3.4%.
      vi: Tỉ lệ chuyển đổi tăng từ 3% lên 3,4%.
- slug: t21-retention-n
  lemma: retention
  pos: noun
  cefr: C1
  topic: economy
  ipa: /rɪˈtenʃn/
  def: How many users keep using a product over time.
  vi: tỉ lệ giữ chân
  examples:
    - en: Day-7 retention did not change.
      vi: Tỉ lệ giữ chân ngày thứ 7 không thay đổi.
- slug: t21-engagement-n
  lemma: engagement
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ɪnˈɡeɪdʒmənt/
  def: How much users interact with a product.
  vi: mức độ tương tác
  examples:
    - en: Engagement went up, but so did support tickets.
      vi: Mức tương tác tăng, nhưng ticket hỗ trợ cũng tăng.
- slug: t21-cohort-n
  lemma: cohort
  pos: noun
  cefr: C1
  topic: economy
  ipa: /ˈkəʊhɔːt/
  def: A group of users who share something, like their join month.
  vi: nhóm người dùng (cohort)
  examples:
    - en: The March cohort stayed longer than February's.
      vi: Nhóm tháng Ba ở lại lâu hơn nhóm tháng Hai.
- slug: t21-baseline-n
  lemma: baseline
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ˈbeɪslaɪn/
  def: A first measurement that you compare later results with.
