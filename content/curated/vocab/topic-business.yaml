      vi: Bước test thêm thật đáng giá; nó bắt được hai lỗi.
- lemma: customer value
  pos: noun
  vi: giá trị mang lại cho khách hàng
  def: The benefit a customer gets from a product or service.
  examples:
    - en: Connect this feature to measurable customer value.
  slug: t21-customer-value-n
  topic: economy
  cefr: B2
  kind: collocation
