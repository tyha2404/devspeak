      vi: Đừng ngại thương lượng lương trước khi ký.
- slug: t21-consensus-n
  lemma: consensus
  pos: noun
  cefr: C1
  topic: economy
  ipa: /kənˈsensəs/
  def: General agreement among everyone in a group.
  vi: sự đồng thuận
  examples:
    - en: We reached consensus on using one monorepo.
