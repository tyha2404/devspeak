      vi: Một hệ quả của lựa chọn này là thời gian build lâu hơn.
- slug: t21-premise-n
  lemma: premise
  pos: noun
  cefr: C1
  topic: economy
  ipa: /ˈpremɪs/
  def: An idea that a decision or argument is based on.
  vi: tiền đề
  examples:
    - en: The premise of this design is that reads are far more common than writes.
      vi: Tiền đề của thiết kế này là việc đọc nhiều hơn ghi rất nhiều.
- slug: t21-working-theory-n
  lemma: working theory
  pos: noun
  kind: collocation
  cefr: C1
  topic: economy
  ipa: /ˈwɜːkɪŋ ˈθɪəri/
  def: The idea you are using for now to explain a problem, until you test it.
  vi: giả thuyết tạm thời
  examples:
    - en: My working theory is that the cache returns old data.
      vi: Giả thuyết tạm thời của mình là cache trả về dữ liệu cũ.
- slug: t21-unknown-n
  lemma: unknown
  pos: noun
  cefr: B2
  topic: economy
  ipa: /ˌʌnˈnəʊn/
  def: Something you do not know yet.
  vi: điều chưa biết, ẩn số
  examples:
    - en: The biggest unknown is how the vendor API handles retries.
      vi: Điều chưa biết lớn nhất là API của bên cung cấp xử lý retry thế nào.
- slug: t21-falsifiable-adj
  lemma: falsifiable
  pos: adjective
  cefr: C1
  topic: economy
  ipa: /ˈfɔːlsɪfaɪəbl/
  def: Possible to prove wrong with a test.
  vi: có thể bác bỏ bằng kiểm chứng
  examples:
    - en: "Make the hypothesis falsifiable: say what result would prove it wrong."
      vi: "Hãy làm cho giả thuyết có thể bác bỏ: nói rõ kết quả nào sẽ chứng minh nó
        sai."
- slug: t21-sanity-check-n
  lemma: sanity check
  pos: noun
  kind: collocation
  cefr: B2
  topic: economy
  ipa: /ˈsænəti tʃek/
  def: A quick, simple check that something is basically correct.
  vi: kiểm tra nhanh cơ bản
  examples:
    - en: As a sanity check, print the config value before changing code.
      vi: Để kiểm tra nhanh, hãy in giá trị config trước khi sửa code.
- slug: t21-substantiate-v
  lemma: substantiate
  pos: verb
  cefr: C1
  topic: economy
  ipa: /səbˈstænʃieɪt/
  def: To show with facts that something is true.
  vi: chứng minh, minh chứng
  examples:
    - en: Substantiate the claim with test results.
      vi: Hãy chứng minh nhận định bằng kết quả kiểm thử.
- slug: t21-disprove-v
  lemma: disprove
  pos: verb
  cefr: C1
  topic: economy
  ipa: /dɪsˈpruːv/
  def: To show that an idea is false.
  vi: bác bỏ, chứng minh là sai
  examples:
    - en: One clean run on the old version would disprove my idea.
      vi: Chỉ một lần chạy sạch trên bản cũ là đủ bác bỏ ý mình.
- slug: t21-counterargument-n
  lemma: counterargument
