- slug: t21-data-driven-adj
  lemma: data-driven
  pos: adjective
  cefr: C1
  topic: economy
  ipa: /ˌdeɪtə ˈdrɪvn/
  def: Based on facts and numbers rather than opinions.
  vi: dựa trên dữ liệu
  examples:
    - en: Let's keep this review data-driven, not based on feelings.
      vi: Hãy để buổi xem lại này dựa trên dữ liệu, không theo cảm tính.
- slug: t21-executive-summary-n
  lemma: executive summary
  pos: noun
  kind: collocation
  cefr: C1
  topic: economy
  ipa: /ɪɡˈzekjətɪv ˈsʌməri/
