      vi: Lập luận phản bác mạnh nhất là chi phí đào tạo lại.
- slug: t21-common-ground-n
  lemma: common ground
  pos: noun
  kind: collocation
  cefr: C1
  topic: economy
  ipa: /ˌkɒmən ˈɡraʊnd/
  def: Interests or opinions that two people share.
  vi: điểm chung
  examples:
