  vi: khuyến nghị, lời đề xuất
  forms:
    - recommendations
    - recommend
    - recommended
  examples:
    - en: Our main recommendation is to move the images to a CDN.
      vi: Khuyến nghị chính của bọn mình là chuyển ảnh sang CDN.
- slug: t21-way-forward-n
