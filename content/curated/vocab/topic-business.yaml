- slug: t21-buy-in-n
  lemma: buy-in
  pos: noun
  cefr: C1
  topic: economy
  ipa: /ˈbaɪ ɪn/
  def: Agreement and support from the people affected.
  vi: sự ủng hộ
  examples:
    - en: We need buy-in from the mobile team before we change the API.
      vi: Cần sự ủng hộ của nhóm mobile trước khi đổi API.
- slug: t21-align-v
  lemma: align
  pos: verb
  cefr: B2
  topic: economy
  ipa: /əˈlaɪn/
  def: To agree and work towards the same goal.
  vi: thống nhất, đồng bộ
  examples:
    - en: Let's align with the design team before the demo.
      vi: Hãy thống nhất với nhóm thiết kế trước buổi demo.
- slug: t21-accountable-adj
  lemma: accountable
