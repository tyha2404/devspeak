# Developer vocabulary: Interface Design & Cross-Cultural UX. Original definitions and curated examples.
- lemma: layout
  pos: noun
  vi: bố cục giao diện
  def: The arrangement of elements on a screen.
  examples:
    - en: This layout keeps the primary action above the details.
  slug: t15-layout-n
  topic: culture
  cefr: B2
- lemma: visual hierarchy
  pos: noun
  vi: thứ bậc thị giác
  def: The ordering of visual elements to communicate importance.
  examples:
    - en: A strong visual hierarchy draws attention to the primary action.
  slug: t15-visual-hierarchy-n
  topic: culture
  cefr: B2
  kind: collocation
- slug: t15-wireframe-n
  lemma: wireframe
  pos: noun
  cefr: C1
  topic: culture
  ipa: /ˈwaɪəfreɪm/
  def: A simple drawing of a screen's layout without final design.
  vi: wireframe (khung bố cục)
  examples:
    - en: Attach a wireframe of the station page to the brief.
      vi: Đính kèm wireframe của trang trạm vào bản mô tả.
- slug: t15-panel-n
  lemma: panel
  pos: noun
  cefr: B1
  topic: culture
  ipa: /ˈpænl/
  def: A section of a screen with its own border and content.
  vi: khung, bảng
  examples:
    - en: The side panel shows details for the selected station.
      vi: Khung bên hiển thị chi tiết trạm đang chọn.
- slug: t15-heading-n
  lemma: heading
  pos: noun
  cefr: B1
  topic: culture
  ipa: /ˈhedɪŋ/
  def: A title at the top of a part of a text.
  vi: đề mục
  examples:
    - en: Use headings so readers can jump to the code.
      vi: Dùng đề mục để người đọc nhảy tới phần code.
- slug: t15-label-n
  lemma: label
  pos: noun
  cefr: B1
  topic: culture
  ipa: /ˈleɪbl/
  def: A short tag that puts an issue into a group.
  vi: nhãn
  examples:
    - en: Add the "bug" label so the team can find it.
      vi: Gắn nhãn "bug" để cả nhóm tìm được.
- slug: t15-button-n
  lemma: button
  pos: noun
  cefr: A2
  topic: culture
  ipa: /ˈbʌtn/
  def: A small area on a screen that you press to do something.
  vi: nút
  examples:
    - en: The blue button sends the form.
      vi: Nút màu xanh dùng để gửi form.
- slug: t15-screen-n
  lemma: screen
  pos: noun
  cefr: A2
  topic: culture
  ipa: /skriːn/
  def: One page or view that an app shows you.
  vi: màn hình
  examples:
    - en: On the next screen, choose a password.
      vi: Ở màn hình tiếp theo, hãy chọn mật khẩu.
- lemma: navigation
  pos: noun
  vi: hệ thống điều hướng
  def: The controls and structure used to move through a product.
  examples:
    - en: Keep the navigation consistent across the settings pages.
  slug: t15-navigation-n
  topic: culture
  cefr: B2
- slug: t15-emphasis-n
  lemma: emphasis
  pos: noun
  cefr: B2
  topic: culture
  ipa: /ˈemfəsɪs/
  def: Special importance given to something.
  vi: sự nhấn mạnh
  examples:
    - en: Put the emphasis on what the user must do.
      vi: Nhấn mạnh vào việc người dùng phải làm.
- lemma: colour
  pos: noun
  vi: màu sắc
  def: The visual quality of an object such as red or blue.
  examples:
    - en: Do not use colour alone to show an error.
  slug: t15-colour-n
  topic: culture
  cefr: B2
- lemma: typography
  pos: noun
  vi: cách thiết kế và bố trí chữ
  def: The selection and arrangement of type for readable text.
  examples:
    - en: Good typography makes the technical guide easier to scan.
  slug: t15-typography-n
  topic: culture
  cefr: B2
- lemma: spacing
  pos: noun
  vi: khoảng cách giữa các phần tử
  def: The amount of space between items.
  examples:
    - en: Consistent spacing helps users scan the form.
  slug: t15-spacing-n
  topic: culture
  cefr: B2
- lemma: padding
  pos: noun
  vi: khoảng đệm bên trong phần tử
  def: Space between content and its surrounding border.
  examples:
    - en: Add padding so the label does not touch the border.
  slug: t15-padding-n
  topic: culture
  cefr: B2
- lemma: margin
  pos: noun
  vi: khoảng trống ngoài phần tử
  def: Space outside an interface element's border.
  examples:
    - en: Increase the margin between the card and the page edge.
  slug: t15-margin-n
  topic: culture
  cefr: B2
- lemma: font size
  pos: noun
  vi: cỡ chữ
  def: The displayed size of text characters.
  examples:
    - en: Let users increase the font size without losing content.
  slug: t15-font-size-n
  topic: culture
  cefr: B2
  kind: collocation
- lemma: line height
  pos: noun
  vi: chiều cao dòng chữ
  def: The vertical space occupied by a line of text.
  examples:
    - en: Increase the line height to make long paragraphs easier to read.
  slug: t15-line-height-n
  topic: culture
  cefr: B2
  kind: collocation
- lemma: contrast
  pos: noun
  vi: độ tương phản
  def: The visible difference between colours or tones.
  examples:
    - en: Increase the contrast between the text and its background.
  slug: t15-contrast-n
  topic: culture
  cefr: B2
- lemma: alignment
  pos: noun
  vi: sự căn chỉnh
  def: The positioning of items along a common line.
  examples:
    - en: Check the alignment of labels in the form.
  slug: t15-alignment-n
  topic: culture
  cefr: B2
- slug: t15-grid-n
  lemma: grid
  pos: noun
  cefr: B1
  topic: culture
  ipa: /ɡrɪd/
  def: A pattern of equal squares that divides an area.
  vi: lưới ô
  examples:
    - en: The forecast is given for each 5 km grid cell.
      vi: Dự báo được đưa ra cho mỗi ô lưới 5 km.
- slug: t15-legibility-n
  lemma: legibility
  pos: noun
  cefr: C1
  topic: culture
  ipa: /ˌledʒəˈbɪləti/
  def: How easy text or numbers are to read.
  vi: độ dễ đọc
  examples:
    - en: Check legibility on a phone screen in bright sunlight.
      vi: Kiểm tra độ dễ đọc trên màn hình điện thoại dưới nắng gắt.
- slug: t15-consistent-adj
  lemma: consistent
  pos: adjective
  cefr: B2
  topic: culture
  ipa: /kənˈsɪstənt/
  def: Always the same in style or meaning.
  vi: nhất quán
  examples:
    - en: 'Be consistent: say "sign in" everywhere, not "log on".'
      vi: 'Hãy nhất quán: dùng "sign in" ở mọi chỗ, không dùng "log on".'
- lemma: component
  pos: noun
  vi: thành phần giao diện tái sử dụng
  def: A reusable piece of a user interface.
  examples:
    - en: This component displays the same error format on every page.
  slug: t15-component-n
  topic: culture
  cefr: B2
- lemma: design system
  pos: noun
  vi: hệ thống quy chuẩn thiết kế
  def: Shared components and rules for designing consistent interfaces.
  examples:
    - en: Our design system defines button sizes and spacing.
  slug: t15-design-system-n
  topic: culture
  cefr: B2
  kind: collocation
- slug: t15-variant-n
  lemma: variant
  pos: noun
  cefr: C1
  topic: culture
  ipa: /ˈveəriənt/
  def: One of the different versions tested in an experiment.
  vi: phiên bản thử, biến thể
  examples:
    - en: Variant B has a shorter form.
      vi: Biến thể B có form ngắn hơn.
- lemma: reusable
  pos: adjective
  vi: có thể tái sử dụng
  def: Able to be used again in other places or situations.
  examples:
    - en: Make the error banner reusable across forms.
  slug: t15-reusable-adj
  topic: culture
  cefr: B2
- slug: t15-naming-convention-n
  lemma: naming convention
  pos: noun
  kind: collocation
  cefr: B1
  topic: culture
  ipa: /ˈneɪmɪŋ kənˈvenʃn/
  def: An agreed way of choosing names for files, variables or functions.
  vi: quy ước đặt tên
  examples:
    - en: The naming convention is camelCase for variables and PascalCase for types.
      vi: Quy ước đặt tên là camelCase cho biến và PascalCase cho kiểu.
- slug: t15-style-guide-n
  lemma: style guide
  pos: noun
  kind: collocation
  cefr: B2
  topic: culture
  ipa: /ˈstaɪl ɡaɪd/
  def: A set of rules for how a team writes.
  vi: hướng dẫn văn phong
  examples:
    - en: Our style guide says to use "you", not "the user".
      vi: Hướng dẫn văn phong của chúng tôi bảo dùng "bạn", không dùng "người dùng".
- lemma: default
  pos: noun
  vi: giá trị mặc định
  def: A value used when no other choice is specified.
  examples:
    - en: The default for this setting is weekly email.
  slug: t15-default-n
  topic: culture
  cefr: B2
- lemma: override
  pos: verb
  vi: ghi đè thiết lập có sẵn
  def: To replace a default or inherited value.
  examples:
    - en: Override the default spacing only when the layout requires it.
  slug: t15-override-v
  topic: culture
  cefr: B2
- lemma: property
  pos: noun
  vi: thuộc tính cấu hình
  def: A named value controlling an object's behaviour or appearance.
  examples:
    - en: The size property selects the compact button variant.
  slug: t15-property-n
  topic: culture
  cefr: B2
- lemma: token
  pos: noun
  vi: giá trị thiết kế dùng chung
  def: A named design value shared across components.
  examples:
    - en: Use a spacing token instead of a hard-coded number.
  slug: t15-token-n
  topic: culture
  cefr: B2
- slug: t15-pattern-n
  lemma: pattern
  pos: noun
  cefr: B1
  topic: culture
  ipa: /ˈpætn/
  def: Something that repeats in a regular way.
  vi: quy luật, mẫu lặp lại
  examples:
    - en: "The errors follow a pattern: every hour on the hour."
      vi: "Lỗi có quy luật: đúng mỗi đầu giờ."
- slug: t15-documentation-n
  lemma: documentation
  pos: noun
  cefr: B1
  topic: culture
  ipa: /ˌdɒkjumenˈteɪʃn/
  def: Written text that explains how a piece of software works and how to use it.
  vi: tài liệu (kỹ thuật)
  note: Thường nói tắt là "docs".
  examples:
    - en: The documentation says this function is safe to call twice.
      vi: Tài liệu nói hàm này gọi hai lần cũng an toàn.
- slug: t15-prototype-n
  lemma: prototype
  pos: noun
  cefr: B2
  topic: culture
  ipa: /ˈprəʊtətaɪp/
  def: An early, simple version of a product, made to test an idea.
  vi: bản mẫu
  examples:
    - en: I built a prototype in one weekend to test the idea.
      vi: Mình làm một bản mẫu trong một cuối tuần để thử ý tưởng.
- lemma: maintainable
  pos: adjective
  vi: dễ bảo trì
  def: Easy to understand, repair and update.
  examples:
    - en: Use shared components to keep the interface maintainable.
  slug: t15-maintainable-adj
  topic: culture
  cefr: B2
- lemma: hover
  pos: noun
  vi: trạng thái con trỏ nằm trên phần tử
  def: The state of a pointer resting over an interface element.
  examples:
    - en: Show a tooltip on hover and on keyboard focus.
  slug: t15-hover-n
  topic: culture
  cefr: B2
- lemma: focus
  pos: noun
  vi: trạng thái được chọn để nhận thao tác
  def: The state of receiving keyboard or other input.
  examples:
    - en: Move focus to the error message after submission.
  slug: t15-focus-n
  topic: culture
  cefr: B2
- lemma: disabled
  pos: adjective
  vi: bị vô hiệu hoá
  def: Unavailable for interaction in the current state.
  examples:
    - en: The submit button stays disabled until the form is valid.
  slug: t15-disabled-adj
  topic: culture
  cefr: B2
- lemma: selected
  pos: adjective
  vi: được chọn
  def: Chosen from available options.
  examples:
    - en: The selected plan is highlighted before checkout.
  slug: t15-selected-adj
  topic: culture
  cefr: B2
- lemma: pressed
  pos: adjective
  vi: ở trạng thái đã nhấn
  def: Showing that a toggle control is currently activated.
  examples:
    - en: The bold button stays pressed while bold formatting is active.
  slug: t15-pressed-adj
  topic: culture
  cefr: B2
- lemma: active
  pos: adjective
  vi: đang hoạt động
  def: Currently working or being used.
  examples:
    - en: An active session keeps the user signed in.
  slug: t15-active-adj
  topic: culture
  cefr: B2
- lemma: interaction
  pos: noun
  vi: sự tương tác với hệ thống
  def: An action and response between a person and a system.
  examples:
    - en: Every interaction should give clear feedback.
  slug: t15-interaction-n
  topic: culture
  cefr: B2
- slug: t15-feedback-n
  lemma: feedback
  pos: noun
  cefr: B1
  topic: culture
  ipa: /ˈfiːdbæk/
  def: Comments about how well someone did something, given so they can improve.
  vi: phản hồi, góp ý
  examples:
    - en: Could you give me feedback on my design doc?
      vi: Anh cho em góp ý về tài liệu thiết kế được không?
- slug: t15-toggle-v
  lemma: toggle
  pos: verb
  cefr: B2
  topic: culture
  ipa: /ˈtɒɡl/
  def: To switch between two states, such as on and off.
  vi: bật/tắt
  examples:
    - en: Users can toggle between satellite and street view.
      vi: Người dùng có thể chuyển qua lại giữa ảnh vệ tinh và bản đồ đường.
- slug: t15-dropdown-n
  lemma: dropdown
  pos: noun
  cefr: B1
  topic: culture
  ipa: /ˈdrɒpdaʊn/
  def: A list that opens when you click it so you can choose one item.
  vi: danh sách thả xuống
  examples:
    - en: Choose your time zone from the dropdown.
      vi: Chọn múi giờ trong danh sách thả xuống.
- lemma: checkbox
  pos: noun
  vi: ô đánh dấu
  def: A control that turns an independent option on or off.
  examples:
    - en: The checkbox lets users request email updates.
  slug: t15-checkbox-n
  topic: culture
  cefr: B2
- lemma: radio button
  pos: noun
  vi: nút chọn một trong nhiều lựa chọn
  def: A control selecting one option from a group.
  examples:
    - en: Use a radio button when users must choose one plan.
  slug: t15-radio-button-n
  topic: culture
  cefr: B2
  kind: collocation
- lemma: cursor
  pos: noun
  vi: con trỏ
  def: A visual indicator of a pointer or text position.
  examples:
    - en: The cursor changes when it moves over a link.
  slug: t15-cursor-n
  topic: culture
  cefr: B2
- slug: t15-transition-n
  lemma: transition
  pos: noun
  cefr: B2
  topic: culture
  ipa: /trænˈzɪʃn/
  def: The process of changing from one state to another.
  vi: sự chuyển tiếp
  examples:
    - en: The transition to the new team will take a month.
      vi: Quá trình chuyển sang nhóm mới sẽ mất một tháng.
- lemma: animation
  pos: noun
  vi: hiệu ứng chuyển động
  def: A sequence of images or changes that creates movement.
  examples:
    - en: Keep the animation short when opening the menu.
  slug: t15-animation-n
  topic: culture
  cefr: B2
- lemma: responsive
  pos: adjective
  vi: thích ứng với kích thước màn hình
  def: Adjusting layout to suit different screen sizes.
  examples:
    - en: The responsive table becomes a list on narrow screens.
  slug: t15-responsive-adj
  topic: culture
  cefr: B2
- slug: t15-loading-state-n
  lemma: loading state
  pos: noun
  kind: collocation
  cefr: B2
  topic: culture
  ipa: /ˈləʊdɪŋ steɪt/
  def: What a screen shows while it is waiting for data.
  vi: trạng thái đang tải
  examples:
    - en: The loading state should keep the layout from jumping.
      vi: Trạng thái đang tải nên giữ bố cục không bị nhảy.
- slug: t15-empty-state-n
  lemma: empty state
  pos: noun
  kind: collocation
  cefr: B2
  topic: culture
  ipa: /ˈempti steɪt/
  def: What a screen shows when there is no data to display.
  vi: trạng thái trống
  examples:
    - en: Write a helpful empty state for new stations with no history.
      vi: Viết trạng thái trống hữu ích cho trạm mới chưa có lịch sử.
- lemma: error state
  pos: noun
  vi: trạng thái lỗi
  def: An interface state shown when an operation fails.
  examples:
    - en: The error state should explain how to retry.
  slug: t15-error-state-n
  topic: culture
  cefr: B2
  kind: collocation
- slug: t15-placeholder-n
  lemma: placeholder
  pos: noun
  cefr: B2
  topic: culture
  ipa: /ˈpleɪshəʊldə/
  def: A fake value that stands in for the real one.
  vi: giá trị giữ chỗ
  examples:
    - en: Use a placeholder like XXXX in the docs instead of the real token.
      vi: Hãy dùng giá trị giữ chỗ như XXXX trong tài liệu thay vì token thật.
- lemma: spinner
  pos: noun
  vi: biểu tượng xoay báo đang tải
  def: An animated indicator that work is still in progress.
  examples:
    - en: Show a spinner while the server prepares the export.
  slug: t15-spinner-n
  topic: culture
  cefr: B2
- lemma: progress bar
  pos: noun
  vi: thanh hiển thị tiến trình
  def: A visual indicator of how much work is complete.
  examples:
    - en: The progress bar updates while the export runs.
  slug: t15-progress-bar-n
  topic: culture
  cefr: B2
  kind: collocation
- lemma: retry
  pos: verb
  vi: thử thực hiện lại
  def: To attempt an operation again after failure.
  examples:
    - en: Retry the upload when the connection returns.
  slug: t15-retry-v
  topic: culture
  cefr: B2
- lemma: timeout
  pos: noun
  vi: sự hết thời gian chờ
  def: The end of a waiting period without the expected result.
  examples:
    - en: A timeout should display a useful recovery action.
  slug: t15-timeout-n
  topic: culture
  cefr: B2
- lemma: validation
  pos: noun
  vi: việc kiểm tra tính hợp lệ
  def: Checking that data meets required rules.
  examples:
    - en: Run validation on the server as well as in the form.
  slug: t15-validation-n
  topic: culture
  cefr: B2
- slug: t15-warning-n
  lemma: warning
  pos: noun
  cefr: B1
  topic: culture
  ipa: /ˈwɔːnɪŋ/
  def: A message telling someone that they will be punished if they do something
    again.
  vi: lời cảnh cáo
  examples:
    - en: First, we give a private warning.
      vi: Đầu tiên, tụi mình gửi một lời cảnh cáo riêng.
- lemma: success
  pos: noun
  vi: kết quả thành công
  def: The achievement of an intended result.
  examples:
    - en: Show success only after the server confirms the save.
  slug: t15-success-n
  topic: culture
  cefr: B2
- lemma: failure
  pos: noun
  vi: sự thất bại hoặc không hoạt động
  def: An event in which something does not work as intended.
  examples:
    - en: A payment failure should not erase the shopping cart.
  slug: t15-failure-n
  topic: culture
  cefr: B2
- slug: t15-pending-adj
  lemma: pending
  pos: adjective
  cefr: B2
  topic: culture
  ipa: /ˈpendɪŋ/
  def: Waiting for a decision or an action.
  vi: đang chờ xử lý
  examples:
    - en: My GitHub invite is still pending.
      vi: Lời mời GitHub của mình vẫn đang chờ.
- slug: t15-no-data-phr
  lemma: no data
  pos: phrase
  kind: phrase
  cefr: A2
  topic: culture
  ipa: /ˌnəʊ ˈdeɪtə/
  def: A label that tells users nothing was measured or received.
  vi: không có dữ liệu
  examples:
    - en: Use a grey "no data" label, not a red error.
      vi: Dùng nhãn "không có dữ liệu" màu xám, không phải lỗi màu đỏ.
- slug: t15-offline-adj
  lemma: offline
  pos: adjective
  cefr: B1
  topic: culture
  it: true
  ipa: /ˌɒfˈlaɪn/
  def: Not connected to the internet.
  vi: ngoại tuyến, không có mạng
  forms:
    - go offline
    - went offline
  examples:
    - en: You can read the maps offline, even on the plane.
      vi: Bạn có thể xem bản đồ khi không có mạng, kể cả trên máy bay.
- slug: t15-reconnect-v
  lemma: reconnect
  pos: verb
  cefr: B1
  topic: culture
  ipa: /ˌriːkəˈnekt/
  def: To join a network again after being cut off.
  vi: kết nối lại
  examples:
    - en: When the station reconnects, it uploads the stored values.
      vi: Khi trạm kết nối lại, nó tải lên các giá trị đã lưu.
- slug: t15-recover-v
  lemma: recover
  pos: verb
  cefr: B1
  topic: culture
  ipa: /rɪˈkʌvə/
  def: To become healthy again after being ill or tired.
  vi: hồi phục
  forms:
    - recovers
    - recovered
    - recovering
    - recovery
  examples:
    - en: Take a few days off to recover properly.
      vi: Nghỉ vài ngày để hồi phục hẳn nhé.
- slug: t15-user-friendly-adj
  lemma: user-friendly
  pos: adjective
  cefr: B1
  topic: culture
  ipa: /ˌjuːzə ˈfrendli/
