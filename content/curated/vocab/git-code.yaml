# Tuấn (senior dev buddy): git and code review basics.
- slug: commit-v
  lemma: commit
  pos: verb
  cefr: B1
  topic: git
  it: true
  ipa: /kəˈmɪt/
  def: To save a set of changes to a code repository with a short message.
  vi: commit (lưu thay đổi vào kho code)
  keep_en: true
  note: Dev Việt thường nói "commit code", ít khi dịch.
  forms: [commits, committed, committing]
  examples:
    - {
        en: "Commit your changes before you switch branches.",
        vi: "Hãy commit thay đổi trước khi chuyển nhánh.",
      }
- slug: push-v
  lemma: push
  pos: verb
  cefr: A2
  topic: git
  it: true
  ipa: /pʊʃ/
  def: To send your local commits to the shared repository.
  vi: đẩy code lên (push)
  keep_en: true
  forms: [pushes, pushed, pushing]
  examples:
    - { en: "I pushed the fix to the main branch.", vi: "Mình đã push bản sửa lên nhánh main." }
- slug: pull-v
  lemma: pull
  pos: verb
  cefr: A2
  topic: git
  it: true
  ipa: /pʊl/
  def: To download the latest changes from the shared repository.
  vi: kéo code mới về (pull)
  keep_en: true
  forms: [pulls, pulled, pulling]
  examples:
    - {
        en: "Pull the latest changes before you start.",
        vi: "Hãy pull code mới nhất trước khi bắt đầu.",
      }
- slug: branch-n
  lemma: branch
  pos: noun
  cefr: B1
  topic: git
  it: true
  ipa: /brɑːntʃ/
  def: A separate line of work in a repository, so changes don't affect the main code yet.
  vi: nhánh (branch)
  keep_en: true
  forms: [branches]
  examples:
    - { en: "Create a new branch for this feature.", vi: "Tạo một nhánh mới cho tính năng này." }
- slug: merge-conflict-n
  lemma: merge conflict
  pos: noun
  kind: collocation
  cefr: B1
  topic: git
  it: true
  def: When two changes touch the same lines and Git cannot combine them automatically.
  vi: xung đột khi gộp code
  keep_en: true
  note: Thường nói "bị conflict".
  forms: [merge conflicts]
  examples:
    - {
        en: "I got a merge conflict in the config file.",
        vi: "Mình bị merge conflict ở file config.",
      }
- slug: pull-request-n
  lemma: pull request
  pos: noun
  kind: collocation
  cefr: B1
  topic: code-review
  it: true
