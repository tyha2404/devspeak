# Developer vocabulary: Developer Conversations & Technical Negotiation. Original definitions and curated examples.
- slug: t22-clarify-v
  lemma: clarify
  pos: verb
  cefr: B1
  topic: communication
  ipa: /ˈklærəfaɪ/
  def: To make something easier to understand by explaining it more.
  vi: làm rõ
  examples:
    - en: Could you clarify what "sync" means in this ticket?
      vi: Bạn làm rõ giúp "sync" trong ticket này nghĩa là gì?
- slug: t22-confirm-v
  lemma: confirm
  pos: verb
  cefr: B1
  topic: communication
  ipa: /kənˈfɜːm/
  def: To say that something is true or that a plan will definitely happen.
  vi: xác nhận
  forms:
    - confirms
    - confirmed
    - confirming
    - confirmation
  examples:
    - en: Could you confirm the meeting time by email?
      vi: Anh/chị xác nhận giờ họp qua email giúp tôi được không?
- slug: t22-acknowledge-v
  lemma: acknowledge
  pos: verb
  cefr: C1
  topic: communication
  ipa: /əkˈnɒlɪdʒ/
  def: To tell someone that you have received their message or understood a problem.
  vi: báo đã nhận, thừa nhận
  forms:
    - acknowledges
    - acknowledged
    - acknowledging
    - acknowledgement
  examples:
    - en: The vendor acknowledged our email but hasn't answered yet.
      vi: Bên cung cấp đã báo nhận email nhưng chưa trả lời.
- slug: t22-paraphrase-v
  lemma: paraphrase
  pos: verb
  cefr: C1
  topic: communication
  ipa: /ˈpærəfreɪz/
  def: To write someone's idea in your own words.
  vi: diễn đạt lại bằng lời mình
  examples:
    - en: Paraphrase the docs instead of copying them.
      vi: Hãy diễn đạt lại tài liệu bằng lời mình thay vì chép.
- slug: t22-rephrase-v
  lemma: rephrase
  pos: verb
  cefr: B2
  topic: communication
  ipa: /ˌriːˈfreɪz/
  def: To say something again using different words so it is clearer.
  vi: nói lại theo cách khác
  examples:
    - en: Let me rephrase my question.
      vi: Để mình hỏi lại theo cách khác nhé.
- slug: t22-specific-adj
  lemma: specific
  pos: adjective
  cefr: B1
  topic: communication
  ipa: /spəˈsɪfɪk/
  def: Exact and detailed, not general.
  vi: cụ thể
  examples:
    - en: A specific question gets a faster answer.
      vi: Câu hỏi cụ thể sẽ được trả lời nhanh hơn.
- slug: t22-vague-adj
  lemma: vague
  pos: adjective
  cefr: B2
  topic: communication
  ipa: /veɪɡ/
  def: Not clear or detailed enough.
  vi: mơ hồ
  examples:
    - en: The ticket is vague about who owns the cleanup.
      vi: Ticket còn mơ hồ về việc ai phụ trách dọn dẹp.
- slug: t22-ambiguous-adj
  lemma: ambiguous
  pos: adjective
  cefr: B2
  topic: communication
  ipa: /æmˈbɪɡjuəs/
  def: Able to be understood in more than one way.
  vi: mơ hồ, đa nghĩa
  examples:
    - en: "The word 'recent' in the ticket is ambiguous: one week or one month?"
      vi: "Chữ 'gần đây' trong ticket hơi mơ hồ: một tuần hay một tháng?"
- slug: t22-on-the-same-page-phr
  lemma: on the same page
  pos: phrase
  kind: phrase
  cefr: B2
  topic: communication
  ipa: /ɒn ðə ˌseɪm ˈpeɪdʒ/
  def: Having the same understanding of something.
  vi: hiểu giống nhau
  examples:
    - en: "Just to be on the same page: the deadline is Friday, right?"
      vi: "Để hiểu giống nhau: hạn chót là thứ Sáu đúng không?"
- lemma: understanding
  pos: noun
  vi: sự hiểu vấn đề
  def: Knowledge of the meaning or nature of something.
  examples:
    - en: Let me check my understanding before we estimate the task.
  slug: t22-understanding-n
  topic: communication
  cefr: B1
- slug: t22-ask-for-phr
  lemma: ask for
  pos: phrase
  kind: phrase
  cefr: A2
  topic: communication
  ipa: /ˈɑːsk fə/
  def: To say that you want someone to give you something.
  vi: xin, yêu cầu
  examples:
    - en: Don't wait for the review; ask for feedback early.
      vi: Đừng đợi đến buổi review; hãy xin góp ý sớm.
- slug: t22-help-wanted-phr
  lemma: help wanted
  pos: phrase
  kind: phrase
  cefr: B1
  topic: communication
  ipa: /ˌhelp ˈwɒntɪd/
  def: A label or notice saying that a project needs people to help.
  vi: cần người giúp
  examples:
    - en: I added a 'help wanted' tag to the mobile tasks.
      vi: Mình đã gắn nhãn 'cần người giúp' cho các việc phần mobile.
- slug: t22-lend-a-hand-phr
  lemma: lend a hand
  pos: phrase
  kind: phrase
  cefr: B2
  topic: communication
  ipa: /lend ə ˈhænd/
  def: To help someone (informal).
  vi: giúp một tay
  examples:
    - en: Could you lend a hand with the database migration?
      vi: Bạn giúp mình một tay phần migration database được không?
- slug: t22-blocker-n
  lemma: blocker
  pos: noun
  cefr: B1
  topic: communication
  ipa: /ˈblɒkə/
  def: A problem that stops you from continuing your work.
  vi: vấn đề chặn tiến độ
  examples:
    - en: My only blocker is access to the staging database.
      vi: Vấn đề duy nhất chặn mình là quyền truy cập database staging.
- lemma: stuck
  pos: adjective
  vi: bị vướng chưa tiến triển được
  def: Unable to make progress.
  examples:
    - en: I'm stuck on the failing migration and need another pair of eyes.
  slug: t22-stuck-adj
  topic: communication
  cefr: B1
- slug: t22-troubleshoot-v
  lemma: troubleshoot
  pos: verb
  cefr: B2
  topic: communication
  it: true
  ipa: /ˈtrʌblʃuːt/
  def: To find out why something is not working and fix it.
  vi: khắc phục sự cố, dò lỗi
  forms:
    - troubleshoots
    - troubleshot
    - troubleshooting
  examples:
    - en: I spent an hour troubleshooting the printer for my mum.
      vi: Mình mất một tiếng dò lỗi máy in cho mẹ.
- slug: t22-steps-to-reproduce-n
  lemma: steps to reproduce
  pos: noun
  kind: collocation
  cefr: B2
  topic: communication
  ipa: /ˌsteps tə ˌriːprəˈdjuːs/
  def: A list of actions that make a problem happen again.
  vi: các bước tái hiện
  examples:
    - en: Add clear steps to reproduce, using only test accounts.
      vi: Thêm các bước tái hiện rõ ràng, chỉ dùng tài khoản test.
- slug: t22-expected-result-n
  lemma: expected result
  pos: noun
  kind: collocation
  cefr: B1
  topic: communication
  ipa: /ɪkˈspektɪd rɪˈzʌlt/
  def: What should happen if the software works correctly.
  vi: kết quả mong đợi
  examples:
    - en: "Expected result: the order appears in the list."
      vi: "Kết quả mong đợi: đơn hàng hiện trong danh sách."
- slug: t22-actual-result-n
  lemma: actual result
  pos: noun
  kind: collocation
  cefr: B1
  topic: communication
  ipa: /ˈæktʃuəl rɪˈzʌlt/
  def: What really happens when you follow the steps.
  vi: kết quả thực tế
  examples:
    - en: "Actual result: the list stays empty."
      vi: "Kết quả thực tế: danh sách vẫn trống."
- slug: t22-context-n
  lemma: context
  pos: noun
  cefr: B1
  topic: communication
  ipa: /ˈkɒntekst/
  def: The background facts that help someone understand a situation.
  vi: ngữ cảnh, bối cảnh
  examples:
    - en: "Add some context: which service, which branch, which command."
      vi: "Thêm chút ngữ cảnh: service nào, nhánh nào, lệnh nào."
- lemma: what I tried
  pos: phrase
  vi: những cách tôi đã thử
  def: A phrase introducing attempted solutions when asking for help.
  examples:
    - en: Here is what I tried before asking about the failed build.
  slug: t22-what-i-tried-phr
  topic: communication
  cefr: B1
  kind: phrase
- slug: t22-reproducible-adj
  lemma: reproducible
  pos: adjective
  cefr: B1
  topic: communication
  ipa: /ˌriːprəˈdjuːsəbl/
  def: Able to happen again when you repeat the same steps.
  vi: có thể tái hiện
  examples:
    - en: The bug is reproducible on Android but not on iOS.
      vi: Lỗi có thể tái hiện trên Android nhưng không trên iOS.
- slug: t22-input-n
  lemma: input
  pos: noun
  cefr: A2
  topic: communication
  ipa: /ˈɪnpʊt/
  def: Data that you give to a program.
  vi: dữ liệu đầu vào
  examples:
    - en: "The form breaks with this input: a name with an emoji."
      vi: "Form bị lỗi với đầu vào này: một cái tên có emoji."
- lemma: output
  pos: noun
  vi: đầu ra của quá trình xử lý
  def: Data or a result produced by a process.
  examples:
    - en: The output contains the validated address and its coordinates.
  slug: t22-output-n
  topic: communication
  cefr: B1
- slug: t22-parameter-n
  lemma: parameter
  pos: noun
  cefr: B1
  topic: communication
  ipa: /pəˈræmɪtə/
  def: A value you pass to a function or request to control what it does.
  vi: tham số
  examples:
    - en: The limit parameter sets how many items come back.
      vi: Tham số limit quy định số phần tử trả về.
- slug: t22-return-value-n
  lemma: return value
  pos: noun
  kind: collocation
  cefr: B1
  topic: communication
  ipa: /rɪˈtɜːn ˌvæljuː/
  def: The result that a function gives back after it runs.
  vi: giá trị trả về
  examples:
    - en: The return value is null when no user is found.
      vi: Giá trị trả về là null khi không tìm thấy user.
- lemma: function
  pos: noun
  vi: hàm trong chương trình
  def: A reusable block of code that performs a task.
  examples:
    - en: This function checks the input and returns a user ID.
  slug: t22-function-n
  topic: communication
  cefr: B1
- slug: t22-condition-n
  lemma: condition
  pos: noun
  cefr: B1
  topic: communication
  ipa: /kənˈdɪʃn/
  def: Something that must happen before something else can happen.
  vi: điều kiện
  examples:
    - en: "We can merge on one condition: the feature flag stays off."
      vi: "Có thể merge với một điều kiện: feature flag vẫn tắt."
- lemma: loop
  pos: noun
  vi: vòng lặp
  def: A code structure that repeats instructions.
  examples:
    - en: The loop processes each item in the queue.
  slug: t22-loop-n
  topic: communication
  cefr: B1
- lemma: branch
  pos: noun
  vi: nhánh xử lý
  def: One of several possible paths through a program.
  examples:
    - en: This branch handles requests with missing credentials.
  slug: t22-branch-n
  topic: communication
  cefr: B1
- slug: t22-variable-n
  lemma: variable
  pos: noun
  cefr: B2
  topic: communication
  ipa: /ˈveəriəbl/
  def: In an experiment, a thing that can change and affect the result.
  vi: biến số
  examples:
    - en: The only variable I changed was the pool size.
      vi: Biến số duy nhất mình thay đổi là kích thước pool.
- slug: t22-sequence-n
  lemma: sequence
  pos: noun
  cefr: B1
  topic: communication
  ipa: /ˈsiːkwəns/
  def: A series of things in a particular order.
  vi: trình tự, chuỗi
  examples:
    - en: Data can arrive out of sequence, so sort it by measured time.
      vi: Dữ liệu có thể đến không theo trình tự, nên hãy sắp xếp theo thời gian đo.
- slug: t22-flowchart-n
  lemma: flowchart
  pos: noun
  cefr: B2
  topic: communication
  ipa: /ˈfləʊtʃɑːt/
  def: A drawing that shows the steps of a process with boxes and arrows.
  vi: lưu đồ
  examples:
    - en: This flowchart shows how an order moves between services.
      vi: Lưu đồ này cho thấy một đơn hàng đi qua các service thế nào.
- slug: t22-code-snippet-n
  lemma: code snippet
  pos: noun
  kind: collocation
  cefr: B1
  topic: communication
  ipa: /ˈkəʊd snɪpɪt/
  def: A short piece of code shown in a text.
  vi: đoạn mã ngắn
  examples:
    - en: Add a code snippet that shows the fix.
      vi: Thêm một đoạn mã ngắn minh hoạ bản sửa.
- slug: t22-walkthrough-n
  lemma: walkthrough
  pos: noun
  cefr: B2
  topic: communication
  ipa: /ˈwɔːkθruː/
  def: A step-by-step explanation of how something works.
  vi: buổi hướng dẫn từng bước
  examples:
    - en: Can you do a walkthrough of the billing code on Friday?
      vi: Thứ Sáu anh hướng dẫn từng bước phần code billing được không?
- slug: t22-explain-v
  lemma: explain
  pos: verb
  cefr: A2
  topic: communication
  ipa: /ɪkˈspleɪn/
  def: To tell someone about something so they understand it.
  vi: giải thích
  examples:
    - en: Can you explain why the build failed?
      vi: Bạn giải thích được vì sao build bị lỗi không?
- slug: t22-pull-request-n
  lemma: pull request
  pos: noun
  kind: collocation
  cefr: B1
  topic: communication
  ipa: /ˈpʊl rɪkwest/
  def: A request to add your code changes into the main project.
  vi: yêu cầu hợp nhất mã (pull request)
  examples:
    - en: I opened a pull request for the login fix.
      vi: Mình đã mở pull request cho bản sửa đăng nhập.
- slug: t22-reviewer-n
  lemma: reviewer
  pos: noun
  cefr: B1
  topic: communication
  ipa: /rɪˈvjuːə/
  def: A person who checks someone else's work and gives feedback.
  vi: người review
  examples:
    - en: The reviewer left three comments on the migration file.
      vi: Người review để lại ba bình luận trong file migration.
- slug: t22-request-changes-phr
  lemma: request changes
  pos: phrase
  kind: phrase
  cefr: B1
  topic: communication
  ipa: /rɪˈkwest ˈtʃeɪndʒɪz/
  def: To ask the author to fix things before a review can pass.
  vi: yêu cầu chỉnh sửa
  examples:
    - en: I requested changes because the tests don't cover the error path.
      vi: Mình yêu cầu chỉnh sửa vì test chưa bao phủ nhánh lỗi.
- slug: t22-nitpick-n
  lemma: nitpick
  pos: noun
  cefr: B2
  topic: communication
  ipa: /ˈnɪtpɪk/
  def: A comment about a very small detail that is not important.
  vi: góp ý vụn vặt
  examples:
    - en: This is just a nitpick, so feel free to merge without it.
      vi: Đây chỉ là góp ý vụn vặt, bạn cứ merge mà không cần sửa.
- slug: t22-constructive-adj
  lemma: constructive
  pos: adjective
  cefr: B2
  topic: communication
  ipa: /kənˈstrʌktɪv/
  def: Helpful and meant to improve something, not only to criticise.
  vi: mang tính xây dựng
  examples:
    - en: Keep review comments constructive and kind.
      vi: Hãy giữ bình luận review mang tính xây dựng và tử tế.
- slug: t22-suggestion-n
  lemma: suggestion
  pos: noun
  cefr: B1
  topic: communication
  ipa: /səˈdʒestʃən/
  def: An idea that you offer for someone to think about.
  vi: đề xuất, gợi ý
  examples:
    - en: Thanks for the suggestion about naming the variables.
      vi: Cảm ơn gợi ý về cách đặt tên biến.
- slug: t22-rationale-n
  lemma: rationale
  pos: noun
  cefr: C1
  topic: communication
  ipa: /ˌræʃəˈnɑːl/
  def: The reasons behind a decision.
  vi: lý do căn bản
  examples:
    - en: The rationale is that the team already knows Postgres well.
      vi: Lý do căn bản là nhóm đã rành Postgres.
- slug: t22-readable-adj
  lemma: readable
  pos: adjective
  cefr: B1
  topic: communication
  ipa: /ˈriːdəbl/
  def: Easy to read and understand.
  vi: dễ đọc
  examples:
    - en: Split this function so it is more readable.
      vi: Hãy tách hàm này ra để dễ đọc hơn.
- slug: t22-naming-convention-n
  lemma: naming convention
  pos: noun
  kind: collocation
  cefr: B1
  topic: communication
  ipa: /ˈneɪmɪŋ kənˈvenʃn/
  def: An agreed way of choosing names for files, variables or functions.
  vi: quy ước đặt tên
  examples:
    - en: The naming convention is camelCase for variables and PascalCase for types.
      vi: Quy ước đặt tên là camelCase cho biến và PascalCase cho kiểu.
- slug: t22-refactor-v
  lemma: refactor
  pos: verb
  cefr: B2
  topic: communication
  ipa: /riːˈfæktə/
  def: To change the structure of code without changing what it does.
  vi: tái cấu trúc mã
  examples:
    - en: I refactored the parser so it is easier to test.
      vi: Mình đã tái cấu trúc parser để dễ test hơn.
- slug: t22-diff-n
  lemma: diff
  pos: noun
  cefr: B1
  topic: communication
  ipa: /dɪf/
  def: The lines of code that were added or removed in a change.
  vi: phần khác biệt (diff)
  examples:
    - en: "The diff is small: only two files changed."
      vi: "Diff nhỏ thôi: chỉ hai tệp thay đổi."
- slug: t22-line-break-n
  lemma: line break
  pos: noun
  kind: collocation
  cefr: B2
  topic: communication
  ipa: /ˈlaɪn breɪk/
  def: The point where text ends one line and starts a new one.
  vi: ngắt dòng
  examples:
    - en: Add a line break between the steps.
      vi: Thêm ngắt dòng giữa các bước.
- slug: t22-indentation-n
  lemma: indentation
  pos: noun
  cefr: B1
  topic: communication
  ipa: /ˌɪndenˈteɪʃn/
  def: Space at the start of a line of code that shows its structure.
  vi: thụt lề
  examples:
    - en: The formatter fixes indentation automatically when you save.
      vi: Trình định dạng tự sửa thụt lề khi bạn lưu file.
- slug: t22-linter-n
  lemma: linter
  pos: noun
  cefr: B1
  topic: communication
  ipa: /ˈlɪntə/
  def: A tool that checks code for style problems and common mistakes.
  vi: công cụ kiểm tra mã (linter)
  examples:
    - en: The linter fails the build if you leave an unused import.
      vi: Linter sẽ làm build lỗi nếu bạn để lại import không dùng.
- slug: t22-test-plan-n
  lemma: test plan
  pos: noun
  kind: collocation
  cefr: B1
  topic: communication
  ipa: /ˈtest plæn/
  def: A description of how you checked that a change works.
  vi: kế hoạch kiểm thử
  examples:
    - en: My test plan lists the three cases I tried by hand.
      vi: Kế hoạch kiểm thử của mình liệt kê ba trường hợp mình thử bằng tay.
- slug: t22-address-feedback-phr
  lemma: address feedback
  pos: phrase
  kind: phrase
  cefr: B2
  topic: communication
  ipa: /əˌdres ˈfiːdbæk/
  def: To make changes because of comments from reviewers.
  vi: xử lý góp ý
  examples:
    - en: I addressed all the feedback in the last commit.
      vi: Mình đã xử lý hết góp ý trong commit cuối.
- slug: t22-agree-on-pv
  lemma: agree on
  pos: phrasal_verb
  kind: phrasal
  cefr: A2
  topic: communication
  ipa: /əˈɡriː ɒn/
  def: To decide something together after discussing it.
  vi: thống nhất về
  examples:
    - en: We agreed on one channel for all incident updates.
      vi: Nhóm đã thống nhất dùng một kênh cho mọi cập nhật sự cố.
- slug: t22-disagree-v
  lemma: disagree
  pos: verb
  cefr: A2
  topic: communication
  ipa: /ˌdɪsəˈɡriː/
  def: To have a different opinion from someone.
  vi: không đồng ý
  examples:
    - en: I disagree; caching here could show old prices.
      vi: Mình không đồng ý; cache ở đây có thể hiện giá cũ.
- slug: t22-concern-n
  lemma: concern
  pos: noun
  cefr: B1
  topic: communication
  ipa: /kənˈsɜːn/
  def: A worry about something.
  vi: mối lo ngại
  examples:
    - en: My main concern is the extra load on the database.
      vi: Mối lo ngại chính của mình là tải thêm lên cơ sở dữ liệu.
- slug: t22-objection-n
  lemma: objection
  pos: noun
  cefr: B2
  topic: communication
  ipa: /əbˈdʒekʃn/
  def: A reason you give for not agreeing with a plan.
  vi: sự phản đối
  examples:
    - en: Does anyone have an objection before we merge?
      vi: Có ai phản đối trước khi merge không?
- slug: t22-fair-point-phr
  lemma: fair point
  pos: phrase
  kind: phrase
  cefr: B1
  topic: communication
