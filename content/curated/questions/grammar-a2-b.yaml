- slug: g-a2-ed-ing-adjectives-7
  type: mcq_meaning
  cefr: A2
  topic: grammar
  stem: "Chọn câu đúng."
  question: "Câu nào đúng ngữ pháp và đúng nghĩa “Mình thấy chán trong buổi họp này”?"
  options:
    [
      "I'm boring in this meeting.",
      "I'm bored in this meeting.",
      "I'm bore in this meeting.",
      "I boring in this meeting.",
    ]
  answer: 1
  explanation_vi: "Người cảm thấy chán → bored. I'm boring nghĩa là mình là người nhạt nhẽo."
- slug: g-a2-ed-ing-adjectives-8
  type: mcq_meaning
  cefr: A2
  topic: grammar
  stem: "Phản hồi về giao diện."
  question: "“Dashboard mới khó hiểu nên người dùng thấy bối rối” là…"
  options:
    [
      "The new dashboard is confused, so users are confusing.",
      "The new dashboard is confusing, so users are confused.",
      "The new dashboard is confusing, so users are confusing.",
      "The new dashboard is confused, so users are confused.",
    ]
  answer: 1
  explanation_vi: "Dashboard gây rối → confusing; người dùng cảm thấy rối → confused."
