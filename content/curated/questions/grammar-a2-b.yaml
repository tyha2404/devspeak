# Grammar track A2 tests (batch a2-b). Original items; answers stay server-side.
- slug: g-a2-ed-ing-adjectives-1
  type: fill_blank
  cefr: A2
  topic: grammar
  skin: slack
  sentence: "I'm ___ by this error message. What does it mean?"
  options: [confuse, confused, confusing, confusion]
  answer: 1
  explanation_vi: "Người (I) cảm thấy rối → confused."
