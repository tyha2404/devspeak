  type: fill_blank
  cefr: C1
  topic: grammar
  skin: email
  sentence: "___ we invested in observability, we would know exactly where the latency comes from."
  options: [If had, Have, Had, Would]
  answer: 2
  explanation_vi: "Đảo ngữ trang trọng: Had + S + V3 thay cho If we had invested; bỏ hẳn if."
