- slug: g-c1-past-perfect-continuous-7
  type: mcq_meaning
  cefr: C1
  topic: grammar
  stem: "Viết mục Root cause trong postmortem."
  question: "Câu nào diễn đạt đúng một nguyên nhân tích luỹ dẫn tới sự cố?"
  options:
    - "The service crashed because it was leaking memory for days."
    - "The service crashed because it had been leaking memory for days."
    - "The service had crashed because it has been leaking memory for days."
    - "The service crashed because it had leaked memory since days."
  answer: 1
  explanation_vi: "For days trước mốc crashed → had been leaking; was leaking không đi với thời lượng trước mốc."
- slug: g-c1-past-perfect-continuous-8
  type: mcq_meaning
  cefr: C1
  topic: grammar
  stem: "Giải thích bối cảnh quyết định rewrite."
  question: "“Tụi mình đã cân nhắc viết lại suốt mấy tháng, nên sự cố chỉ là giọt nước tràn ly.” là…"
  options:
    - "We have been considering a rewrite for months, so the outage simply tipped the balance."
    - "We were considering a rewrite for months, so the outage had simply tipped the balance."
    - "We had been considering a rewrite for months, so the outage simply tipped the balance."
    - "We had considered a rewrite since months, so the outage simply tipped the balance."
  answer: 2
  explanation_vi: "Quá trình cân nhắc kéo dài trước mốc quá khứ (tipped) → had been considering; dùng for months, không dùng since months."
