# --- g-c1-mixed-conditionals
- slug: g-c1-mixed-conditionals-1
  type: fill_blank
  cefr: C1
  topic: grammar
  skin: pr
  sentence: "If we had written integration tests back then, we ___ afraid to refactor now."
  options: [wouldn't have been, wouldn't be, won't be, hadn't been]
  answer: 1
  explanation_vi: "Quá khứ (had written) → hiện tại (now) → would + V: wouldn't be."
- slug: g-c1-mixed-conditionals-2
  type: fill_blank
  cefr: C1
  topic: grammar
  skin: slack
  sentence: "If our onboarding docs ___ clearer, the new hire wouldn't have broken staging last week."
  options: [were, had been being, will be, are]
  answer: 0
  explanation_vi: "Đặc điểm lâu dài ở hiện tại (docs vẫn chưa rõ) giải thích kết quả quá khứ → If + were, would have + V3."
