    - "If I had knew, I would have called you."
    - "If I had known, I would called you."
  answer: 1
  explanation_vi: "If + had + V3, would have + V3. Không dùng would trong mệnh đề if."
- slug: g-b2-third-conditional-8
  type: mcq_meaning
  cefr: B2
  topic: grammar
  stem: "Nói về điều đã không xảy ra."
  question: "“Nếu hôm qua bạn gọi thì mình đã nghe máy rồi.” là…"
  options:
    - "If you called yesterday, I would answer."
    - "If you had called yesterday, I will answer."
    - "If you had called yesterday, I would have answered."
    - "If you have called yesterday, I would have answered."
  answer: 2
  explanation_vi: "Chuyện hôm qua đã không xảy ra → loại 3: had called / would have answered."
