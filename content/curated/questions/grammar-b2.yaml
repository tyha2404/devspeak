  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "I ___ have missed the train if you hadn't driven me to the station."
  options: [would, will, had, did]
  answer: 0
  explanation_vi: "Would have + V3: kết quả giả định trái với quá khứ."
