# Grammar track B2 tests. Original items; answers stay server-side.
# --- g-b2-future-continuous
- slug: g-b2-future-continuous-1
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "Don't call Lan at 2 pm. She ___ a workshop then."
  options: [will running, will be running, will be run, is run]
  answer: 1
  explanation_vi: "Việc đang diễn ra tại một mốc tương lai (2 pm) → will be + V-ing."
- slug: g-b2-future-continuous-2
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "At 8 pm tonight I ___ dinner with the client, so I can't reply."
  options: [will having, am have, will be had, will be having]
  answer: 3
  explanation_vi: "Lúc 8 giờ tối đang ăn tối dở → will be having. Không bỏ be, sau be là V-ing."
- slug: g-b2-future-continuous-3
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "___ you be using the projector this afternoon?"
  options: [Do, Are, Will, Have]
  answer: 2
  explanation_vi: "Câu hỏi tương lai tiếp diễn: Will + S + be + V-ing…?"
- slug: g-b2-future-continuous-4
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: email
  sentence: "I won't be at my desk tomorrow morning. I'll ___ a training course."
  options: [attending, be attending, be attend, attended]
  answer: 1
  explanation_vi: "I'll = I will → will + be + V-ing: I'll be attending."
- slug: g-b2-future-continuous-5
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "This time tomorrow, we ___ (fly – tương lai tiếp diễn) to Tokyo for the conference."
  accepted: ["will be flying", "'ll be flying"]
  explanation_vi: "This time tomorrow: đang bay vào lúc đó → will be flying."
- slug: g-b2-future-continuous-6
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "Sorry, I ___ (not / join – tương lai tiếp diễn) the 4 pm call. I'll be on a plane."
  accepted: ["won't be joining", "will not be joining"]
  explanation_vi: "Phủ định của tương lai tiếp diễn: won't be + V-ing."
- slug: g-b2-future-continuous-7
  type: mcq_meaning
  cefr: B2
  topic: grammar
  stem: "Chọn câu đúng."
  question: "Câu nào đúng ngữ pháp?"
  options:
    - "At 10 am tomorrow I will presenting the roadmap."
    - "At 10 am tomorrow I am be presenting the roadmap."
    - "At 10 am tomorrow I will be presenting the roadmap."
    - "At 10 am tomorrow I will be present the roadmap."
  answer: 2
  explanation_vi: "Đủ ba phần will + be + V-ing."
- slug: g-b2-future-continuous-8
  type: mcq_meaning
  cefr: B2
  topic: grammar
  stem: "Hỏi lịch sự về kế hoạch."
  question: "“Chiều nay bạn có định dùng phòng họp không?” là…"
  options:
    - "Will you using the meeting room this afternoon?"
    - "Will you be using the meeting room this afternoon?"
    - "Are you be using the meeting room this afternoon?"
    - "Do you be using the meeting room this afternoon?"
  answer: 1
  explanation_vi: "Will + you + be + V-ing…? hỏi kế hoạch một cách nhẹ nhàng."
# --- g-b2-future-perfect
- slug: g-b2-future-perfect-1
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: jira
  sentence: "By the end of the sprint, we ___ all the tickets in this epic."
  options: [will have closed, will closed, have close, will be close]
  answer: 0
  explanation_vi: "By + mốc tương lai, việc xong trước mốc đó → will have + V3 (closed)."
- slug: g-b2-future-perfect-2
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: email
  sentence: "Don't worry, I ___ the slides by tomorrow morning."
  options: [will have finish, will has finished, will have finished, would has finish]
  answer: 2
  explanation_vi: "Sau will luôn là have, theo sau là V3: will have finished."
- slug: g-b2-future-perfect-3
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "___ the end of the month, the new hire will have completed onboarding."
  options: [Until, By, Since, For]
  answer: 1
  explanation_vi: "By + mốc: chậm nhất là vào lúc đó. Until (cho đến khi) dùng cho việc kéo dài, không đi với will have + V3 ở đây."
- slug: g-b2-future-perfect-4
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "By 2030, she ___ for this company for twenty years."
  options: [has worked, will had worked, will have worked, will be work]
  answer: 2
  explanation_vi: "Tròn hai mươi năm tính đến một mốc tương lai (2030) → will have worked."
- slug: g-b2-future-perfect-5
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "By the time you get here, I ___ (leave – tương lai hoàn thành) the office."
  accepted: ["will have left", "'ll have left"]
  explanation_vi: "Xong trước lúc bạn tới → will have + V3; leave → left."
- slug: g-b2-future-perfect-6
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: jira
  sentence: "We ___ (not / finish – tương lai hoàn thành) the testing by Friday, so the release will slip."
  accepted: ["won't have finished", "will not have finished"]
  explanation_vi: "Đến thứ Sáu vẫn chưa xong → won't have + V3."
- slug: g-b2-future-perfect-7
  type: mcq_meaning
  cefr: B2
  topic: grammar
  stem: "Chọn câu đúng."
  question: "Câu nào đúng ngữ pháp?"
  options:
    - "By next week we will moved to the new server."
    - "By next week we will has moved to the new server."
    - "By next week we have will moved to the new server."
    - "By next week we will have moved to the new server."
  answer: 3
  explanation_vi: "Thứ tự đúng: will + have + V3."
- slug: g-b2-future-perfect-8
  type: mcq_meaning
  cefr: B2
  topic: grammar
  stem: "Email trước chuyến công tác."
  question: "“Lúc bạn đọc email này thì mình đã lên máy bay rồi.” là…"
  options:
    - "By the time you read this email, I will have boarded the plane."
    - "By the time you will read this email, I have boarded the plane."
    - "By the time you read this email, I will boarded the plane."
    - "By the time you read this email, I have board the plane."
  answer: 0
  explanation_vi: "Mệnh đề by the time dùng hiện tại đơn (read); vế chính dùng will have + V3."
# --- g-b2-past-perfect-continuous
- slug: g-b2-past-perfect-continuous-1
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "When I joined the team, they ___ on the project for six months."
  options: [have been working, had been working, had been work, are working]
  answer: 1
  explanation_vi: "Kéo dài sáu tháng trước một mốc quá khứ (when I joined) → had been + V-ing."
- slug: g-b2-past-perfect-continuous-2
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: pr
  sentence: "Her eyes were tired because she ___ code all afternoon."
  options: [has been reviewing, had been review, had been reviewing, was review]
  answer: 2
  explanation_vi: "Kết quả ở quá khứ (were tired), nguyên nhân kéo dài trước đó → had been reviewing."
- slug: g-b2-past-perfect-continuous-3
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "We had been ___ for 40 minutes when the bus finally came."
  options: [wait, waiting, waited, waits]
  answer: 1
  explanation_vi: "Sau had been là V-ing: waiting."
- slug: g-b2-past-perfect-continuous-4
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "How long ___ you been living in Da Nang before you moved to Hanoi?"
  options: [have, had, has, did]
  answer: 1
  explanation_vi: "Mốc là quá khứ (before you moved) → How long had you been + V-ing?"
- slug: g-b2-past-perfect-continuous-5
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "Tuan was exhausted. He ___ (fix – quá khứ hoàn thành tiếp diễn) production issues since 5 am."
  accepted: ["had been fixing", "'d been fixing"]
  explanation_vi: "Việc kéo dài từ 5 giờ sáng đến lúc anh ấy kiệt sức (quá khứ) → had been fixing."
- slug: g-b2-past-perfect-continuous-6
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "I ___ (not / sleep – quá khứ hoàn thành tiếp diễn) well for weeks before I took a holiday."
  accepted: ["hadn't been sleeping", "had not been sleeping"]
  explanation_vi: "Phủ định: hadn't been + V-ing, trước mốc quá khứ (before I took a holiday)."
- slug: g-b2-past-perfect-continuous-7
  type: mcq_meaning
  cefr: B2
  topic: grammar
  stem: "Chọn câu đúng."
  question: "Câu nào đúng ngữ pháp?"
  options:
    - "She has been working there for two years when she got promoted."
    - "She had been working there for two years when she got promoted."
    - "She had been work there for two years when she got promoted."
    - "She had being working there for two years when she got promoted."
  answer: 1
  explanation_vi: "Mốc quá khứ (when she got promoted) → had been + V-ing."
- slug: g-b2-past-perfect-continuous-8
  type: mcq_meaning
  cefr: B2
  topic: grammar
  stem: "Kể lại buổi họp."
  question: "“Họ đã tranh cãi suốt cả buổi trước khi quản lý bước vào.” là…"
  options:
    - "They have been arguing for the whole meeting before the manager came in."
    - "They were been arguing for the whole meeting before the manager came in."
    - "They had been arguing for the whole meeting before the manager came in."
    - "They had argue for the whole meeting before the manager came in."
  answer: 2
  explanation_vi: "Việc kéo dài trước một mốc quá khứ (before the manager came in) → had been arguing."
# --- g-b2-third-conditional
