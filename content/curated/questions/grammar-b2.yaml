  type: fill_blank
  cefr: B2
  topic: grammar
  skin: email
  sentence: "We ___ (not / lose – điều kiện loại 3) the client if we had replied faster."
  accepted: ["wouldn't have lost", "would not have lost"]
  explanation_vi: "Vế kết quả phủ định: wouldn't have + V3; lose → lost."
- slug: g-b2-third-conditional-7
  type: mcq_meaning
  cefr: B2
  topic: grammar
  stem: "Chọn câu đúng."
  question: "Câu nào đúng ngữ pháp?"
  options:
    - "If I would have known, I would have called you."
