  type: fill_blank
  cefr: B2
  topic: grammar
  skin: email
  sentence: "If they ___ the contract, the project wouldn't have been cancelled."
  options: [haven't changed, hadn't changed, didn't changed, hasn't changed]
  answer: 1
  explanation_vi: "Mệnh đề if phủ định của loại 3: hadn't + V3."
- slug: g-b2-third-conditional-5
  type: fill_blank
  cefr: B2
  topic: grammar
  skin: slack
  sentence: "If I ___ (know – điều kiện loại 3) about the meeting, I would have joined."
  accepted: ["had known", "'d known"]
  explanation_vi: "Mệnh đề if: had + V3; know → known."
