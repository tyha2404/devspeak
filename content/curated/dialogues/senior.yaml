- slug: mike-requirements
  npc: mike
  title_en: Requirements call
  title_vi: Họp yêu cầu với khách
  cefr: B2
  sort: 1
  unlock_level: 13
  xp: 35
  entry: hi
  nodes:
    hi:
      {
        type: line,
        en: "Hi! Great to meet the team. Our main [[requirement|requirement-n]]: managers download a report every Monday.",
        vi: "Chào! Rất vui được gặp nhóm. Yêu cầu chính: quản lý tải báo cáo mỗi thứ Hai.",
        next: ask,
      }
    ask:
      type: choice
      prompt_en: '"Real-time" was in his email, but the report is weekly. What do you say?'
      prompt_vi: 'Email của anh ấy ghi "real-time", nhưng báo cáo là hằng tuần. Bạn nói gì?'
      choices:
        - {
            id: a,
            en: 'Could you [[clarify|clarify-v]] what "real-time" means for you? Is a weekly report enough?',
            quality: best,
            feedback_vi: "Làm rõ yêu cầu trước khi ước lượng — rất chuyên nghiệp.",
            next: email,
          }
        - {
            id: b,
            en: "OK, real-time, no problem.",
            quality: poor,
            feedback_vi: "Đồng ý mù quáng dễ dẫn tới scope creep.",
            next: ask,
          }
        - {
            id: c,
            en: "Real-time is hard.",
            quality: ok,
            feedback_vi: "Đúng nhưng nên hỏi lại để làm rõ.",
            next: email,
          }
    email:
      type: freewrite
      task_en: 'Write a short follow-up email confirming what was agreed (start with "As discussed").'
      task_vi: 'Viết email ngắn xác nhận những gì đã thống nhất (bắt đầu bằng "As discussed").'
      keywords: ["as discussed", "report", "monday"]
      next: quiz
    quiz:
      {
        type: quiz,
        questions: [mike-fill-clarify, mike-fill-as-discussed, mike-eta-meaning, mike-listen-demo],
        passAt: 3,
        onPass: done,
        onFail: retry,
      }
    retry: { type: line, en: "Let's go over that again.", vi: "Ôn lại chút nhé.", next: quiz }
    done:
      {
        type: line,
        en: "Perfect, that's exactly what we need. I'll wait for your email!",
        vi: "Tuyệt, đúng thứ tụi tôi cần. Tôi chờ email của bạn!",
        next: end,
      }
    end:
      {
        type: end,
        effects:
          [
            { type: learnWord, sense: clarify-v },
            { type: learnWord, sense: as-discussed-phr },
            { type: learnWord, sense: follow-up-v },
          ],
      }

- slug: mike-scope
  npc: mike
  title_en: Pushing back on scope creep
  title_vi: Từ chối lịch sự khi phạm vi phình ra
  cefr: B2
  sort: 2
  unlock_level: 13
  xp: 35
  entry: hi
  nodes:
    hi:
      {
        type: line,
        en: "Love the demo! Could we squeeze in PDF export by Friday?",
        vi: "Demo tuyệt quá! Mình nhét thêm xuất PDF trước thứ Sáu được không?",
        next: ask,
      }
    ask:
      type: choice
      prompt_en: "The sprint is full. How do you answer?"
      prompt_vi: "Sprint đã kín. Bạn trả lời thế nào?"
      choices:
        - {
            id: a,
            en: "It's [[out of scope|out-of-scope-phr]] for Friday, but it's [[feasible|feasible-adj]] next sprint. Shall I add it?",
            quality: best,
            feedback_vi: "Từ chối rõ ràng + phương án thay thế.",
            next: quiz,
          }
        - {
            id: b,
            en: "Sure, we'll work the weekend.",
            quality: poor,
            feedback_vi: "Đồng ý quá dễ → scope creep và kiệt sức.",
            next: ask,
          }
        - {
            id: c,
            en: "No, impossible.",
            quality: ok,
            feedback_vi: "Rõ ràng nhưng hơi cứng — hãy đưa lựa chọn khác.",
            next: quiz,
          }
    quiz:
      {
        type: quiz,
        questions:
          [mike-scope-creep-meaning, mike-fill-out-of-scope, mike-fix-feasible, mike-reply-squeeze],
        passAt: 3,
        onPass: done,
        onFail: retry,
      }
    retry: { type: line, en: "One more time.", vi: "Thêm một lần nữa.", next: quiz }
    done:
      {
        type: line,
        en: "Fair enough — next sprint it is. Thanks for being honest.",
        vi: "Hợp lý — để sprint sau. Cảm ơn vì đã thẳng thắn.",
        next: end,
      }
    end:
      {
        type: end,
        effects:
          [{ type: learnWord, sense: scope-creep-n }, { type: learnWord, sense: out-of-scope-phr }],
      }

- slug: robert-tech-talk
  npc: robert
  title_en: Your first tech talk
  title_vi: Bài tech talk đầu tiên
  cefr: B2
  sort: 1
  unlock_level: 21
  xp: 40
  entry: hi
  nodes:
    hi:
      {
        type: line,
        en: "Welcome to the stage! Open your talk: [[walk us through|walk-through-phr]] what you built.",
        vi: "Chào mừng lên sân khấu! Mở đầu bài nói: giới thiệu từng bước những gì bạn đã làm.",
        next: open,
      }
    open:
      type: speak
      prompt_en: "Say your opening: introduce yourself, the topic, and what the audience will learn."
      prompt_vi: "Nói phần mở đầu: giới thiệu bản thân, chủ đề, và khán giả sẽ học được gì."
      expected: ["my name", "today", "walk you through"]
      next: close
    close:
      type: freewrite
      task_en: 'Write your closing line with "To sum up" and one key takeaway.'
      task_vi: 'Viết câu kết bằng "To sum up" và một ý chính.'
      keywords: ["to sum up", "takeaway"]
      next: quiz
    quiz:
      {
        type: quiz,
        questions:
          [
            robert-walk-through-meaning,
            robert-takeaway-meaning,
            robert-fill-sum-up,
            robert-listen-talk,
          ],
        passAt: 3,
        onPass: done,
        onFail: retry,
      }
    retry:
      {
        type: line,
        en: "Good effort. Let's rehearse once more.",
        vi: "Cố gắng tốt. Tập lại lần nữa nhé.",
        next: quiz,
      }
    done:
      {
        type: line,
        en: "Great talk! The audience loved it.",
        vi: "Bài nói tuyệt vời! Khán giả rất thích.",
        next: end,
      }
    end:
      {
        type: end,
        effects:
          [
            { type: learnWord, sense: walk-through-phr },
            { type: learnWord, sense: key-takeaway-n },
            { type: learnWord, sense: to-sum-up-phr },
          ],
      }

- slug: priya-networking
  npc: attendee-a
  title_en: Networking at the conference
  title_vi: Làm quen ở hội thảo
  cefr: B1
  sort: 1
  unlock_level: 21
  xp: 25
  entry: hi
  nodes:
    hi:
      {
        type: line,
        en: "Hi! I'm Priya. I really liked your talk. What do you work on?",
        vi: "Chào! Mình là Priya. Mình rất thích bài nói của bạn. Bạn làm về gì?",
        next: ask,
      }
    ask:
      type: choice
      prompt_en: "Introduce your work briefly."
      prompt_vi: "Giới thiệu ngắn gọn công việc của bạn."
      choices:
        - {
            id: a,
            en: "Thanks! I'm a senior developer working on search. How about you?",
            quality: best,
            feedback_vi: "Ngắn gọn và hỏi lại — networking chuẩn.",
            next: end,
          }
        - {
            id: b,
            en: "Code.",
            quality: poor,
            feedback_vi: "Quá ngắn — hãy kể thêm một chút.",
            next: ask,
          }
        - {
            id: c,
            en: "I work very much on many things.",
            quality: ok,
            feedback_vi: "Mơ hồ — nêu cụ thể mảng bạn làm.",
            next: end,
          }
    end: { type: end, effects: [{ type: learnWord, sense: handle-v }] }

- slug: lucas-qa
  npc: attendee-b
  title_en: Handling a tough question
  title_vi: Xử lý câu hỏi khó
  cefr: B2
  sort: 1
  unlock_level: 21
  xp: 25
  entry: hi
  nodes:
    hi:
      {
        type: line,
        en: "Great talk. But isn't caching just hiding a slow database?",
        vi: "Bài nói hay. Nhưng cache chẳng phải chỉ che giấu một database chậm sao?",
        next: ask,
      }
    ask:
      type: choice
      prompt_en: "Answer politely and confidently."
      prompt_vi: "Trả lời lịch sự và tự tin."
      choices:
        - {
            id: a,
            en: "Good question. It's a [[trade-off|trade-off-n]]: we fixed the slow query first, then added the cache.",
            quality: best,
            feedback_vi: "Cảm ơn câu hỏi + giải thích bằng dữ liệu.",
            next: end,
          }
        - {
            id: b,
            en: "You're wrong.",
            quality: poor,
            feedback_vi: "Phản ứng phòng thủ — hãy cảm ơn và giải thích.",
            next: ask,
          }
        - {
            id: c,
            en: "Maybe, I don't know.",
            quality: ok,
            feedback_vi: "Thiếu tự tin — bạn có dữ liệu để trả lời.",
            next: end,
          }
    end: { type: end, effects: [{ type: learnWord, sense: trade-off-n }] }

- slug: mentee-first-week
  npc: mentee
  title_en: Mentoring An
  title_vi: Kèm cặp An
  cefr: B2
  sort: 1
  unlock_level: 31
  xp: 40
  entry: hi
  nodes:
    hi:
      {
        type: line,
        en: "Hi! I'm An, the new intern. You're my mentor, right? What's a [[merge conflict|merge-conflict-n]]?",
        vi: "Chào anh/chị! Em là An, thực tập sinh mới. Anh/chị là mentor của em ạ? Merge conflict là gì vậy?",
        next: explain,
      }
    explain:
      type: freewrite
      task_en: "Explain a merge conflict to An in simple English (2–3 sentences) and how to fix it."
      task_vi: "Giải thích merge conflict cho An bằng tiếng Anh đơn giản (2–3 câu) và cách xử lý."
      keywords: ["same", "file", "commit"]
      next: quiz
    quiz:
      {
        type: quiz,
        questions: [mentee-mentor-meaning, mentee-reply-explain, tuan-conflict-meaning],
        passAt: 2,
        onPass: done,
        onFail: retry,
      }
    retry:
      {
        type: line,
        en: "Hmm, can you explain it another way?",
        vi: "Ừm, anh/chị giải thích cách khác được không ạ?",
        next: quiz,
      }
    done:
      {
        type: line,
        en: "Now I get it. Thank you — you're a great mentor!",
        vi: "Giờ em hiểu rồi. Cảm ơn — anh/chị là mentor tuyệt vời!",
        next: end,
      }
    end: { type: end, effects: [{ type: learnWord, sense: mentor-v }] }
