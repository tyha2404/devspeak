        next: quiz,
      }
    quiz:
      {
        type: quiz,
        questions: [dave-fill-hobby, dave-fix-like, dave-catch-up-meaning],
        passAt: 2,
        onPass: done,
        onFail: retry,
      }
    retry: { type: line, en: "Give it another try!", vi: "Thử lại nào!", next: quiz }
    done: { type: line, en: "Cheers! Good chat.", vi: "Cảm ơn! Nói chuyện vui lắm.", next: end }
    end:
      {
        type: end,
        effects: [{ type: learnWord, sense: hobby-n }, { type: learnWord, sense: catch-up-phr }],
      }

- slug: emma-bug-report
  npc: emma
  title_en: Reporting a bug
  title_vi: Báo lỗi
  cefr: B1
  sort: 1
  unlock_level: 3
  xp: 25
  entry: hi
  nodes:
    hi:
      {
        type: line,
        en: "Hi, I'm Emma from QA. I saw your message about the checkout bug, but I can't [[reproduce|reproduce-v]] it.",
        vi: "Chào, mình là Emma bên QA. Mình thấy tin nhắn về lỗi thanh toán nhưng không tái hiện được.",
        next: ask,
      }
    ask:
      type: choice
      prompt_en: "What do you tell Emma?"
      prompt_vi: "Bạn nói gì với Emma?"
      choices:
        - {
            id: a,
            en: "Sorry! [[Steps to reproduce|steps-to-reproduce-n]]: add two items, then tap Pay twice. It happens on Android.",
            quality: best,
            feedback_vi: "Bước cụ thể + môi trường. QA rất thích!",
            next: more,
          }
        - {
            id: b,
            en: "It's broken. Please fix.",
            quality: poor,
            feedback_vi: "Thiếu thông tin — QA cần các bước tái hiện.",
            next: ask,
          }
        - {
            id: c,
            en: "Tap Pay two times, it break.",
            quality: ok,
            feedback_vi: 'Có ý chính! Sửa: "it breaks" / "it crashes".',
            next: more,
          }
    more:
      {
        type: line,
        en: "Thanks! What's the [[expected behavior|expected-behavior-n]] and the [[actual behavior|actual-behavior-n]]? I'll write the [[ticket|ticket-n]].",
        vi: "Cảm ơn! Kết quả mong đợi và kết quả thực tế là gì? Mình sẽ viết ticket.",
        next: quiz,
      }
    quiz:
      {
        type: quiz,
        questions: [emma-reproduce-meaning, emma-fill-steps, emma-fill-actual, emma-reply-repro],
        passAt: 3,
        onPass: done,
        onFail: retry,
      }
    retry:
      {
        type: line,
        en: "Bug reports need practice. Try again!",
