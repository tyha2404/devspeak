slug: grammar-b1
stage: grammar
sort: 3
code: B1
kind: grammar
cefr: B1
status: published
title: { en: "Grammar B1", vi: "Ngữ pháp B1" }
summary_vi: "Kể chuyện với các thì hoàn thành, đoán và suy luận bằng might, must, can't, tường thuật lời nói và câu hỏi, hỏi lịch sự bằng câu hỏi gián tiếp, dùng câu điều kiện loại 0–2 và câu ước, cùng các cấu trúc so sánh, so/such, both/either/neither, V-ing/to V và cụm động từ."
can_do:
  - "Báo cáo tiến độ và kể lại sự việc theo đúng trình tự bằng các thì hoàn thành"
  - "Phỏng đoán nguyên nhân sự cố và nói về rủi ro, điều kiện, điều ước"
  - "Thuật lại lời đồng nghiệp, khách hàng và đặt câu hỏi lịch sự, xác nhận thông tin"
  - "Viết báo cáo, so sánh phương án bằng câu bị động, mệnh đề quan hệ và cấu trúc so sánh"
lessons:
  - slug: g-b1-present-perfect
    kind: grammar
    title: { en: "Present perfect vs past simple", vi: "Hiện tại hoàn thành và quá khứ đơn" }
    questions:
      [
        g-b1-present-perfect-1,
        g-b1-present-perfect-2,
        g-b1-present-perfect-3,
        g-b1-present-perfect-4,
        g-b1-present-perfect-5,
        g-b1-present-perfect-6,
        g-b1-present-perfect-7,
        g-b1-present-perfect-8,
      ]
    grammar:
      title_vi: "Hiện tại hoàn thành và quá khứ đơn"
      group: "Thì động từ"
      overview:
        focus: "Cả hai thì đều nói về việc đã xảy ra. Quá khứ đơn gắn với một thời điểm đã kết thúc (yesterday, in May). Hiện tại hoàn thành không nêu thời điểm, mà nhấn vào kết quả còn liên quan đến bây giờ: đã xong chưa, đã từng chưa, kéo dài đến nay bao lâu."
        formulas:
          - "S + have/has + V3 (past participle)"
          - "S + haven't/hasn't + V3 · Have/Has + S + V3…?"
          - "Quá khứ đơn: S + V2 + mốc thời gian đã qua"
        hook: "I've finished the review. I finished it an hour ago."
      functions:
        - title: "Kết quả còn ở hiện tại"
          explain: "Việc vừa xảy ra và quan trọng ngay bây giờ; không nói lúc nào."
          examples: ["I've lost my access card.", "Someone has deleted the main branch!"]
        - title: "Tiến độ: already, yet, just"
          explain: "Already (rồi, sớm hơn dự kiến), yet (chưa/chưa?, cuối câu phủ định và câu hỏi), just (vừa mới)."
          examples:
            [
              "We've already merged it.",
              "Have you deployed yet?",
              "QA has just approved the build.",
            ]
        - title: "Trải nghiệm: ever, never"
          explain: "Đã từng làm việc gì trong đời tới giờ, không quan trọng khi nào."
          examples: ["Have you ever worked with Go?", "I've never used Kubernetes in production."]
        - title: "Kéo dài đến nay: for, since"
          explain: "For + khoảng thời gian; since + mốc bắt đầu."
          examples:
            ["She has worked here for three years.", "The bug has existed since version 2.1."]
        - title: "Có mốc đã qua → quá khứ đơn"
          explain: "Khi hỏi hay kể chi tiết lúc nào, ở đâu, thế nào, chuyển sang quá khứ đơn."
          examples: ["I've been to Singapore. I went there in 2024 for a conference."]
      structure:
        forms:
          - {
              label: "Khẳng định",
              pattern: "I/you/we/they have + V3 · he/she/it has + V3",
              example: "They have released v3.",
            }
          - {
              label: "Phủ định",
              pattern: "S + haven't/hasn't + V3",
              example: "The client hasn't replied yet.",
            }
          - { label: "Nghi vấn", pattern: "Have/Has + S + V3…?", example: "Has the build passed?" }
          - {
              label: "Rút gọn",
              pattern: "I've · we've · she's · it's",
              example: "It's been a long week.",
            }
          - {
              label: "Quá khứ đơn",
              pattern: "S + V2 + yesterday/ago/in…",
              example: "They released v3 last Monday.",
            }
        steps:
          - title: "Có mốc thời gian đã kết thúc không?"
            explain: "Yesterday, last week, ago, in 2022, when I was… → quá khứ đơn. Không có, hoặc khoảng thời gian chưa hết (today, this week) → thường dùng hiện tại hoàn thành."
            example: "I've had three meetings today. / I had three meetings yesterday."
          - title: "Chọn have hay has"
            explain: "He, she, it, danh từ số ít → has; các chủ ngữ còn lại → have."
            example: "The team has grown."
          - title: "Dùng đúng V3"
            explain: "Có quy tắc thì V3 = V-ed; bất quy tắc phải học cột thứ ba (go – went – gone, write – wrote – written)."
            example: "I've written the spec. (không phải wrote)"
      examples:
        - {
            tag: "Kết quả",
            en: "I've fixed the login issue, so you can try again.",
            vi: "Mình sửa lỗi đăng nhập rồi, bạn thử lại nhé.",
            note: "Quan trọng là bây giờ đã sửa xong; không nêu thời điểm.",
          }
        - {
            tag: "Mốc quá khứ",
            en: "I fixed it at around 10 last night.",
            vi: "Mình sửa nó khoảng 10 giờ tối qua.",
            note: "Có mốc cụ thể → quá khứ đơn.",
          }
        - {
            tag: "Yet",
            en: "Has Product signed off on the design yet?",
            vi: "Bên Product duyệt thiết kế chưa?",
            note: "Yet đứng cuối câu hỏi.",
          }
        - {
            tag: "Since",
            en: "We haven't had an outage since March.",
            vi: "Từ tháng Ba tới giờ tụi mình chưa bị sập lần nào.",
            note: "Since + mốc bắt đầu, kéo dài đến hiện tại.",
          }
        - {
            tag: "For",
            en: "He's been our tech lead for two years.",
            vi: "Anh ấy làm tech lead của tụi mình được hai năm rồi.",
            note: "He's ở đây là he has; for + khoảng thời gian.",
          }
        - {
            tag: "Trải nghiệm",
            en: "Have you ever presented to a client in English?",
            vi: "Bạn đã bao giờ thuyết trình với khách bằng tiếng Anh chưa?",
            note: "Ever: từng trong đời đến giờ.",
          }
        - {
            tag: "Chuyển thì",
            en: "I've met her before. We met at a meetup in Saigon.",
            vi: "Mình gặp chị ấy rồi. Tụi mình gặp ở một buổi meetup ở Sài Gòn.",
            note: "Câu đầu nêu trải nghiệm; câu sau kể chi tiết nên dùng quá khứ đơn.",
          }
        - tag: "Just"
          en: "The client has just sent the final requirements."
          vi: "Khách vừa gửi yêu cầu cuối cùng."
          note: "Just (vừa mới) đứng giữa has và V3."
      contrast:
        title: "Hiện tại hoàn thành hay quá khứ đơn"
        rows:
          - {
              label: "Hiện tại hoàn thành",
              note: "không nêu lúc nào, kết quả quan trọng bây giờ",
              example: "I've sent the invoice.",
            }
          - {
              label: "Quá khứ đơn",
              note: "có mốc thời gian đã kết thúc",
              example: "I sent the invoice on Monday.",
            }
          - {
              label: "today / this week",
              note: "khoảng thời gian chưa kết thúc → hiện tại hoàn thành",
              example: "We've shipped two features this week.",
            }
          - {
              label: "yesterday / last week / ago",
              note: "đã kết thúc → quá khứ đơn",
              example: "We shipped two features last week.",
            }
        fixes:
          - {
              wrong: "I have finished it yesterday.",
              right: "I finished it yesterday.",
              why: "Có yesterday (mốc đã qua) nên không dùng hiện tại hoàn thành.",
            }
          - {
              wrong: "She works here since 2021.",
              right: "She has worked here since 2021.",
              why: "Since + mốc, việc kéo dài đến nay → hiện tại hoàn thành.",
            }
          - {
              wrong: "Did you finish yet?",
              right: "Have you finished yet?",
              why: "Yet hỏi tiến độ tới hiện tại, đi với hiện tại hoàn thành.",
            }
          - {
              wrong: "I have went to Japan twice.",
              right: "I have been to Japan twice.",
              why: "Sau have dùng V3; đã đến rồi về thì nói have been to.",
            }
  - slug: g-b1-first-conditional
    kind: grammar
    title: { en: "First conditional & will", vi: "Câu điều kiện loại 1 và will" }
    questions:
      [
        g-b1-first-conditional-1,
        g-b1-first-conditional-2,
        g-b1-first-conditional-3,
        g-b1-first-conditional-4,
        g-b1-first-conditional-5,
        g-b1-first-conditional-6,
        g-b1-first-conditional-7,
        g-b1-first-conditional-8,
      ]
    grammar:
      title_vi: "Câu điều kiện loại 1 và tương lai với will"
      group: "Câu điều kiện"
      overview:
        focus: "Câu điều kiện loại 1 nói về một khả năng có thật trong tương lai và hệ quả của nó: nếu A xảy ra thì B sẽ xảy ra. Điểm dễ sai nhất: mệnh đề if dùng hiện tại đơn dù nghĩa là tương lai; will chỉ nằm ở mệnh đề kết quả."
        formulas:
          - "If + S + V (hiện tại đơn), S + will/won't + V"
          - "S + will + V + if + S + V (hiện tại đơn)"
          - "unless = if … not"
        hook: "If the tests pass, we'll deploy tonight."
      functions:
        - title: "Hệ quả của một khả năng thực tế"
          explain: "Điều kiện có thể xảy ra thật; nói trước kết quả."
          examples: ["If we skip the review, we'll miss bugs.", "If it rains, I'll work from home."]
        - title: "Cảnh báo rủi ro"
          explain: "Hay gặp khi bàn kỹ thuật, ước lượng, phân tích rủi ro."
          examples: ["If traffic doubles, the database won't cope."]
        - title: "Hứa hẹn, đề nghị bằng will"
          explain: "Will dùng khi quyết định ngay lúc nói, hứa hoặc đề nghị giúp."
          examples: ["I'll send you the link right now.", "Don't worry, I'll handle it."]
        - title: "Dự đoán bằng will"
          explain: "Ý kiến, phỏng đoán về tương lai; thường kèm I think, probably."
          examples: ["I think the client will like it.", "It probably won't take long."]
        - title: "Unless, as soon as, when"
          explain: "Các từ nối thời gian, điều kiện này cũng theo sau là hiện tại đơn."
          examples:
            [
              "Unless you push now, the build won't include your fix.",
              "I'll call you as soon as I land.",
            ]
      structure:
        forms:
          - {
              label: "If trước",
              pattern: "If + hiện tại đơn, will + V",
              example: "If you need help, I'll stay late.",
            }
          - {
              label: "If sau",
              pattern: "will + V + if + hiện tại đơn",
              example: "I'll stay late if you need help.",
            }
          - {
              label: "Phủ định",
              pattern: "won't + V · if + don't/doesn't",
              example: "If he doesn't reply, we won't wait.",
            }
          - {
              label: "Câu hỏi",
              pattern: "What will + S + V + if …?",
              example: "What will happen if the API fails?",
            }
          - {
              label: "Unless",
              pattern: "unless + hiện tại đơn khẳng định",
              example: "Unless we fix it, users will complain.",
            }
        steps:
          - title: "Tách hai mệnh đề"
            explain: "Mệnh đề điều kiện (if/unless/when/as soon as) và mệnh đề kết quả."
            example: "[If the API is down] [the app will show an error]"
          - title: "Mệnh đề if: hiện tại đơn"
            explain: "Không đặt will sau if trong câu điều kiện loại 1. Nhớ -s với he/she/it."
            example: "If the server crashes… (không phải will crash)"
          - title: "Mệnh đề kết quả: will/won't + V"
            explain: "Đặt dấu phẩy khi if đứng đầu câu; bỏ dấu phẩy khi if đứng sau."
            example: "If it crashes, we'll get an alert. / We'll get an alert if it crashes."
      examples:
        - {
            tag: "Kế hoạch",
            en: "If the client approves the mockups, we'll start coding on Monday.",
            vi: "Nếu khách duyệt mockup thì thứ Hai tụi mình bắt đầu code.",
            note: "Approves: hiện tại đơn dù nói về tương lai.",
          }
        - {
            tag: "Rủi ro",
            en: "If we don't add an index, this query will get slower.",
            vi: "Nếu không thêm index, câu query này sẽ càng chậm.",
            note: "Phủ định trong mệnh đề if dùng don't.",
          }
        - {
            tag: "If sau",
            en: "You'll get a 401 if your token expires.",
            vi: "Bạn sẽ bị lỗi 401 nếu token hết hạn.",
            note: "If đứng sau thì không cần dấu phẩy.",
          }
        - {
            tag: "Unless",
            en: "We won't hit the deadline unless we cut scope.",
            vi: "Tụi mình sẽ không kịp hạn trừ khi cắt bớt phạm vi.",
            note: "Unless = if … not; theo sau là khẳng định.",
          }
        - {
            tag: "Đề nghị",
            en: "That looks heavy. I'll help you with it.",
            vi: "Cái đó trông nặng đấy. Để mình giúp.",
            note: "Quyết định ngay lúc nói → will.",
          }
        - {
            tag: "Thời gian",
            en: "I'll review your PR as soon as I finish this call.",
            vi: "Mình sẽ review PR của bạn ngay khi xong cuộc gọi này.",
            note: "As soon as + hiện tại đơn, giống if.",
          }
        - tag: "Câu hỏi"
          en: "What will we do if the vendor doesn't deliver by Friday?"
          vi: "Nếu đến thứ Sáu bên cung cấp vẫn không giao hàng thì tụi mình sẽ làm gì?"
          note: "Will nằm ở mệnh đề chính; mệnh đề if vẫn là hiện tại đơn (doesn't deliver)."
        - tag: "Dự đoán"
          en: "I think it'll be ready by Friday."
          vi: "Mình nghĩ đến thứ Sáu là xong."
          note: "Dự đoán theo ý kiến cá nhân → I think + will ('ll) + V."
      contrast:
        title: "Vị trí của will"
        rows:
          - {
              label: "Mệnh đề if/unless",
              note: "hiện tại đơn, không có will",
              example: "If the build fails…",
            }
          - { label: "Mệnh đề kết quả", note: "will / won't + V", example: "…we'll roll back." }
          - {
              label: "when / as soon as",
              note: "cũng dùng hiện tại đơn",
              example: "When it's ready, I'll ping you.",
            }
          - {
              label: "Will đứng một mình",
              note: "hứa, đề nghị, dự đoán",
              example: "I'll take this ticket.",
            }
        fixes:
          - {
              wrong: "If it will rain, I'll stay home.",
              right: "If it rains, I'll stay home.",
              why: "Mệnh đề if dùng hiện tại đơn, không dùng will.",
            }
          - {
              wrong: "If he don't answer, we'll escalate.",
              right: "If he doesn't answer, we'll escalate.",
              why: "He ngôi thứ ba số ít → doesn't.",
            }
          - {
              wrong: "Unless you don't hurry, you'll miss the bus.",
              right: "Unless you hurry, you'll miss the bus.",
              why: "Unless đã mang nghĩa phủ định, không thêm don't.",
            }
          - {
              wrong: "I call you when I will arrive.",
              right: "I'll call you when I arrive.",
              why: "Will thuộc mệnh đề kết quả; mệnh đề when dùng hiện tại đơn.",
            }
  - slug: g-b1-used-to
    kind: grammar
    title: { en: "used to & be used to", vi: "Used to và be used to" }
    questions:
      [
        g-b1-used-to-1,
        g-b1-used-to-2,
        g-b1-used-to-3,
        g-b1-used-to-4,
        g-b1-used-to-5,
        g-b1-used-to-6,
        g-b1-used-to-7,
        g-b1-used-to-8,
      ]
    grammar:
      title_vi: "Used to (thói quen cũ) và be used to (đã quen với)"
      group: "Thì động từ"
      overview:
        focus: "Used to + V nói về thói quen hoặc trạng thái từng đúng trong quá khứ nhưng bây giờ không còn: “trước đây hay…”. Đừng nhầm với be used to + V-ing/danh từ (đã quen với) — cấu trúc khác, nghĩa khác. Tiếng Việt chỉ thêm “trước đây/hồi xưa”, nên người học hay quên used to và dùng quá khứ đơn cho mọi thứ."
        formulas:
          - "S + used to + V (nguyên mẫu)"
          - "S + didn't use to + V · Did + S + use to + V…?"
          - "S + be / get used to + V-ing / N = (dần) quen với"
        hook: "We used to deploy by hand. Now the pipeline does it."
      functions:
        - title: "Thói quen đã bỏ"
          explain: "Việc lặp lại nhiều lần trong quá khứ, nay không còn."
          examples: ["I used to work night shifts.", "We used to have stand-ups at 9."]
        - title: "Trạng thái đã thay đổi"
          explain: "Dùng được với động từ chỉ trạng thái: be, have, live, like, know."
          examples: ["This office used to be a café.", "She used to live in Da Lat."]
        - title: "So sánh trước và nay"
          explain: "Thường đi kèm một câu hiện tại để thấy sự thay đổi."
          examples: ["I used to hate meetings, but now I enjoy them."]
        - title: "Be used to / get used to"
          explain: "Be used to + V-ing/N: đã quen. Get used to: dần quen. Ở đây to là giới từ."
          examples: ["I'm used to working remotely.", "You'll get used to the new IDE."]
      structure:
        forms:
          - { label: "Khẳng định", pattern: "S + used to + V", example: "He used to write PHP." }
          - {
              label: "Phủ định",
              pattern: "S + didn't use to + V",
              example: "We didn't use to write tests.",
            }
          - {
              label: "Nghi vấn",
              pattern: "Did + S + use to + V…?",
              example: "Did you use to play games?",
            }
          - {
              label: "Đã quen",
              pattern: "S + be used to + V-ing / N",
              example: "I'm used to the noise.",
            }
          - {
              label: "Dần quen",
              pattern: "S + get used to + V-ing / N",
              example: "She's getting used to the new time zone.",
            }
        steps:
          - title: "Bây giờ còn đúng không?"
            explain: "Không còn nữa và từng lặp lại/kéo dài → used to. Chỉ xảy ra một lần, có mốc cụ thể → quá khứ đơn."
            example: "I used to take the bus. / I took the bus yesterday."
          - title: "Bỏ -d sau did"
            explain: "Sau did/didn't dùng use to (không có d)."
            example: "Did you use to…? / I didn't use to…"
          - title: "Sau be used to là V-ing"
            explain: "Trong be/get used to, to là giới từ nên theo sau là V-ing hoặc danh từ."
            example: "I'm used to getting up early. (không phải used to get up)"
      examples:
        - tag: "Thói quen cũ"
          en: "I used to take the bus to work."
          vi: "Trước đây mình hay đi xe buýt đi làm."
          note: "Thói quen trong quá khứ, nay không còn."
        - tag: "Trạng thái"
          en: "This building used to be a factory."
          vi: "Tòa nhà này trước kia là một nhà máy."
          note: "Trạng thái đã thay đổi → used to + be."
        - tag: "Phủ định"
          en: "We didn't use to write unit tests."
          vi: "Trước đây tụi mình không viết unit test."
          note: "Didn't + use to (không có d)."
        - tag: "Câu hỏi"
          en: "Did you use to work for a bank?"
          vi: "Trước đây bạn từng làm ở ngân hàng à?"
          note: "Did + S + use to + V."
        - tag: "Trước và nay"
          en: "She used to hate public speaking, but now she likes it."
          vi: "Trước đây chị ấy ghét nói trước đám đông, nhưng giờ chị ấy lại thích."
          note: "Used to cho quá khứ; now + hiện tại đơn cho hiện tại."
        - tag: "Be used to"
          en: "I'm used to working with people in different time zones."
          vi: "Mình đã quen làm việc với người ở các múi giờ khác nhau."
          note: "Be used to + V-ing = đã quen với."
        - tag: "Get used to"
          en: "Don't worry, you'll get used to the new keyboard."
          vi: "Đừng lo, rồi bạn sẽ quen với bàn phím mới."
          note: "Get used to + danh từ = dần dần quen."
        - tag: "Quy trình cũ"
          en: "Our team used to deploy manually every Friday."
          vi: "Trước đây thứ Sáu nào team mình cũng deploy bằng tay."
          note: "Việc lặp lại đều đặn trong quá khứ, nay đã thay đổi."
      contrast:
        title: "used to, be used to và quá khứ đơn"
        rows:
          - {
              label: "used to + V",
              note: "thói quen/trạng thái cũ, nay không còn",
              example: "I used to drink tea.",
            }
          - {
              label: "Quá khứ đơn",
              note: "một việc cụ thể, có mốc",
              example: "I drank tea this morning.",
            }
          - {
              label: "be used to + V-ing",
              note: "đã quen với",
              example: "I'm used to drinking tea without sugar.",
            }
          - {
              label: "get used to + V-ing",
              note: "đang/dần quen",
              example: "I'm getting used to the cold.",
            }
        fixes:
          - {
              wrong: "I use to live in Hue.",
              right: "I used to live in Hue.",
              why: "Câu khẳng định: used to (có d).",
            }
          - {
              wrong: "Did you used to play football?",
              right: "Did you use to play football?",
              why: "Sau did bỏ d: use to.",
            }
          - {
              wrong: "I'm used to work late.",
              right: "I'm used to working late.",
              why: "Be used to + V-ing.",
            }
          - {
              wrong: "I used to go to Japan last year.",
              right: "I went to Japan last year.",
              why: "Một lần, có mốc cụ thể → quá khứ đơn.",
            }
  - slug: g-b1-passive
    kind: grammar
    title: { en: "Passive voice (present & past)", vi: "Câu bị động hiện tại đơn và quá khứ đơn" }
    questions:
      [
        g-b1-passive-1,
        g-b1-passive-2,
        g-b1-passive-3,
        g-b1-passive-4,
        g-b1-passive-5,
        g-b1-passive-6,
        g-b1-passive-7,
        g-b1-passive-8,
      ]
    grammar:
      title_vi: "Câu bị động ở hiện tại đơn và quá khứ đơn"
      group: "Cấu trúc câu"
      overview:
        focus: "Câu bị động đưa đối tượng chịu tác động lên làm chủ ngữ, khi người làm không quan trọng, không rõ, hoặc ai cũng biết. Công thức là be + V3; be chia theo thì và chủ ngữ mới (am/is/are cho hiện tại, was/were cho quá khứ). Tiếng Việt hay dùng “được/bị”, nhưng nhiều câu tiếng Việt không có hai từ này vẫn cần bị động trong tiếng Anh."
        formulas:
          - "Hiện tại: S + am/is/are + V3 (+ by …)"
          - "Quá khứ: S + was/were + V3 (+ by …)"
          - "Phủ định: isn't/wasn't + V3 · Câu hỏi: Is/Was + S + V3…?"
        hook: "The bug was reported by a customer and fixed the same day."
      functions:
        - title: "Người làm không quan trọng"
          explain: "Tập trung vào việc được làm và kết quả."
          examples: ["The data is encrypted at rest.", "The office is cleaned every evening."]
        - title: "Không biết ai làm"
          explain: "Không cần, hoặc không thể nêu người làm."
          examples: ["My laptop was stolen at the airport."]
        - title: "Tài liệu và báo cáo sự cố"
          explain: "Văn phong kỹ thuật hay dùng bị động để khách quan, không đổ lỗi."
          examples: ["The incident was detected at 03:10.", "Logs are stored for 30 days."]
        - title: "Nêu người làm bằng by"
          explain: "Chỉ thêm by + người làm khi đó là thông tin quan trọng."
          examples: ["The app was designed by an agency in Da Nang."]
      structure:
        forms:
          - {
              label: "Hiện tại",
              pattern: "am/is/are + V3",
              example: "Payments are processed by Stripe.",
            }
          - {
              label: "Quá khứ",
              pattern: "was/were + V3",
              example: "The servers were moved to AWS in 2024.",
            }
          - {
              label: "Phủ định",
              pattern: "isn't/aren't/wasn't/weren't + V3",
              example: "The file wasn't saved.",
            }
          - {
              label: "Nghi vấn",
              pattern: "Is/Are/Was/Were + S + V3…?",
              example: "Was the email sent?",
            }
          - {
              label: "Có by",
              pattern: "… + by + người làm",
              example: "This library is maintained by volunteers.",
            }
        steps:
          - title: "Đưa tân ngữ lên làm chủ ngữ"
            explain: "Tân ngữ của câu chủ động trở thành chủ ngữ của câu bị động."
            example: "Someone deleted the file. → The file was deleted."
          - title: "Chia be theo thì và chủ ngữ mới"
            explain: "Hiện tại: is/are; quá khứ: was/were — hợp với chủ ngữ mới, không phải người làm."
            example: "The tickets were closed."
          - title: "Động từ chính luôn ở V3"
            explain: "Động từ bất quy tắc phải dùng cột thứ ba."
            example: "write → written · send → sent · build → built"
          - title: "Có cần by không?"
            explain: "Bỏ by khi người làm không rõ hoặc không quan trọng."
            example: "The meeting was cancelled. (không cần by someone)"
      examples:
        - tag: "Hiện tại"
          en: "Passwords are never stored in plain text."
          vi: "Mật khẩu không bao giờ được lưu dưới dạng văn bản thô."
          note: "Hiện tại đơn bị động: are + stored; never đứng sau are."
        - tag: "Quá khứ + by"
          en: "The outage was caused by an expired certificate."
          vi: "Sự cố sập hệ thống là do một chứng chỉ hết hạn gây ra."
          note: "Was + caused; by nêu nguyên nhân."
        - tag: "Không rõ ai làm"
          en: "My bike was stolen last night."
          vi: "Tối qua xe đạp của mình bị mất trộm."
          note: "Không biết ai lấy → bị động, không cần by."
        - tag: "Số nhiều"
          en: "Two new testers were hired last month."
          vi: "Tháng trước có hai tester mới được tuyển vào."
          note: "Chủ ngữ số nhiều → were + V3."
        - tag: "Câu hỏi"
          en: "Was the invoice sent to the client yesterday?"
          vi: "Hôm qua hóa đơn có được gửi cho khách không?"
          note: "Was + S + V3 (sent)."
        - tag: "By"
          en: "This app was built by a team of five developers."
          vi: "Ứng dụng này được một nhóm năm lập trình viên xây dựng."
          note: "Build → built; giữ by vì người làm là thông tin chính."
        - tag: "Lịch lặp lại"
          en: "The reports are generated every Monday morning."
          vi: "Báo cáo được tạo vào mỗi sáng thứ Hai."
          note: "Việc lặp lại → hiện tại đơn bị động: are generated."
        - tag: "Phủ định"
          en: "Unfortunately, the meeting wasn't recorded."
          vi: "Tiếc là buổi họp không được ghi lại."
          note: "Wasn't + V3."
      contrast:
        title: "Chủ động và bị động"
        rows:
          - { label: "Chủ động", note: "người làm là chủ ngữ", example: "Mai tested the feature." }
          - {
              label: "Bị động quá khứ",
              note: "đối tượng là chủ ngữ: was/were + V3",
              example: "The feature was tested by Mai.",
            }
          - {
              label: "Bị động hiện tại",
              note: "is/are + V3",
              example: "The feature is tested every sprint.",
            }
          - {
              label: "Nội động từ",
              note: "happen, arrive, die… không có bị động",
              example: "The error happened at noon.",
            }
        fixes:
          - {
              wrong: "The bug was fix yesterday.",
              right: "The bug was fixed yesterday.",
              why: "Bị động cần V3: fixed.",
            }
          - {
              wrong: "The emails was sent.",
              right: "The emails were sent.",
              why: "Emails số nhiều → were.",
            }
          - {
              wrong: "The accident was happened at night.",
              right: "The accident happened at night.",
              why: "Happen là nội động từ, không có dạng bị động.",
            }
          - {
              wrong: "This tool is use by many teams.",
              right: "This tool is used by many teams.",
              why: "Is + V3: used.",
            }
  - slug: g-b1-relative-clauses
    kind: grammar
    title: { en: "Relative clauses: who, which, that", vi: "Mệnh đề quan hệ who, which, that" }
    questions:
      [
        g-b1-relative-clauses-1,
        g-b1-relative-clauses-2,
        g-b1-relative-clauses-3,
        g-b1-relative-clauses-4,
        g-b1-relative-clauses-5,
        g-b1-relative-clauses-6,
        g-b1-relative-clauses-7,
        g-b1-relative-clauses-8,
      ]
    grammar:
      title_vi: "Mệnh đề quan hệ xác định với who, which, that"
      group: "Mệnh đề"
      overview:
        focus: "Mệnh đề quan hệ đứng ngay sau danh từ để cho biết đang nói về người hay vật nào: “người mà…”, “cái mà…”. Who dùng cho người, which cho vật, that dùng được cho cả hai. Tiếng Việt thường bỏ “mà”, còn tiếng Anh bắt buộc có đại từ quan hệ khi nó làm chủ ngữ của mệnh đề; chỉ được bỏ khi nó là tân ngữ."
        formulas:
          - "N (người) + who/that + V…"
          - "N (vật) + which/that + V…"
          - "N + (who/which/that) + S + V… (bỏ được khi là tân ngữ)"
        hook: "The developer who wrote this module is on leave this week."
      functions:
        - title: "Xác định người"
          explain: "Cho biết chính xác người nào."
          examples:
            ["The woman who interviewed me is the CTO.", "Do you know anyone who speaks Japanese?"]
        - title: "Xác định vật"
          explain: "Cho biết chính xác vật, tính năng, tài liệu nào."
          examples: ["This is the bug that broke checkout.", "I need a tool which can read PDFs."]
        - title: "Lược đại từ khi là tân ngữ"
          explain: "Nếu ngay sau who/which/that là một chủ ngữ mới, có thể bỏ đại từ."
          examples: ["The tool we use is free.", "The person you need is Nam."]
        - title: "Gộp hai câu thành một"
          explain: "Thay vì lặp lại danh từ ở câu thứ hai."
          examples:
            ["I met a designer. She works at a bank. → I met a designer who works at a bank."]
      structure:
        forms:
          - {
              label: "Người – chủ ngữ",
              pattern: "N + who/that + V",
              example: "the tester who found the bug",
            }
          - {
              label: "Vật – chủ ngữ",
              pattern: "N + which/that + V",
              example: "the script which runs the backup",
            }
          - {
              label: "Tân ngữ",
              pattern: "N + (that/who/which) + S + V",
              example: "the library (that) we chose",
            }
          - {
              label: "Vị trí",
              pattern: "mệnh đề đứng ngay sau danh từ",
              example: "The ticket that you created is a duplicate.",
            }
        steps:
          - title: "Danh từ là người hay vật?"
            explain: "Người → who/that; vật → which/that."
            example: "the client who… · the feature which…"
          - title: "Đại từ là chủ ngữ hay tân ngữ?"
            explain: "Ngay sau là động từ → chủ ngữ, bắt buộc giữ. Ngay sau là S + V → tân ngữ, có thể bỏ."
            example: "the man who called · the man (who) I called"
          - title: "Không lặp lại đại từ"
            explain: "Đại từ quan hệ đã thay cho danh từ, không thêm he/it/them nữa."
            example: "the bug that I found (không phải that I found it)"
      examples:
        - tag: "Who"
          en: "The engineer who fixed the outage got a bonus."
          vi: "Kỹ sư đã khắc phục sự cố sập hệ thống được thưởng."
          note: "Who thay cho người, làm chủ ngữ của fixed."
        - tag: "Which"
          en: "This is the script which cleans up the old logs."
          vi: "Đây là script dọn các log cũ."
          note: "Which thay cho vật (script), làm chủ ngữ của cleans."
        - tag: "Anyone who"
          en: "Do you know anyone who speaks Japanese?"
          vi: "Bạn có biết ai nói được tiếng Nhật không?"
          note: "Anyone chỉ người → who."
        - tag: "That"
          en: "The feature that gets the most complaints is search."
          vi: "Tính năng bị phàn nàn nhiều nhất là tìm kiếm."
          note: "That thay cho feature, làm chủ ngữ của gets."
        - tag: "Lược đại từ"
          en: "The laptop I ordered last week still hasn't arrived."
          vi: "Cái laptop mình đặt tuần trước vẫn chưa tới."
          note: "Lược that/which vì ngay sau là chủ ngữ mới I."
        - tag: "Gộp câu"
          en: "We hired a designer who used to work for a bank."
          vi: "Tụi mình tuyển được một designer từng làm ở ngân hàng."
          note: "Who gộp hai câu: We hired a designer. She used to work at a bank."
        - tag: "Bắt buộc giữ"
          en: "Read the guide that explains the release process."
          vi: "Hãy đọc tài liệu giải thích quy trình release."
          note: "That làm chủ ngữ của explains nên không bỏ được."
        - tag: "Không lặp it"
          en: "Is this the bug that you mentioned yesterday?"
          vi: "Đây có phải là lỗi bạn nhắc hôm qua không?"
          note: "That là tân ngữ của mentioned; không thêm it sau mentioned."
      contrast:
        title: "who, which, that và khi nào được lược"
        rows:
          - { label: "who", note: "người", example: "the manager who hired me" }
          - { label: "which", note: "vật, con vật", example: "the server which hosts the API" }
          - {
              label: "that",
              note: "người hoặc vật (mệnh đề xác định)",
              example: "the app that we built",
            }
          - { label: "Lược đại từ", note: "chỉ khi nó là tân ngữ", example: "the app we built" }
        fixes:
          - {
              wrong: "The man which called you is my boss.",
              right: "The man who called you is my boss.",
              why: "Người → who/that.",
            }
          - {
              wrong: "The bug that I reported it is fixed.",
              right: "The bug that I reported is fixed.",
              why: "That đã thay cho it, không lặp lại.",
            }
          - {
              wrong: "The user complained is angry.",
              right: "The user who complained is angry.",
              why: "Đại từ làm chủ ngữ thì không được lược.",
            }
          - {
              wrong: "This is the library who we use.",
              right: "This is the library that we use.",
              why: "Vật → which/that.",
            }
  - slug: g-b1-second-conditional
    kind: grammar
    title: { en: "Second conditional", vi: "Câu điều kiện loại 2" }
    questions:
      [
        g-b1-second-conditional-1,
        g-b1-second-conditional-2,
        g-b1-second-conditional-3,
        g-b1-second-conditional-4,
        g-b1-second-conditional-5,
        g-b1-second-conditional-6,
        g-b1-second-conditional-7,
        g-b1-second-conditional-8,
      ]
    grammar:
      title_vi: "Câu điều kiện loại 2: giả định trái hiện tại"
      group: "Câu điều kiện"
      overview:
        focus: "Câu điều kiện loại 2 nói về một tình huống không có thật hoặc khó xảy ra ở hiện tại/tương lai, và kết quả tưởng tượng của nó. Mệnh đề if dùng quá khứ đơn nhưng nghĩa là hiện tại; mệnh đề kết quả dùng would + V. Khác với loại 1 ở mức độ có thật: loại 1 là khả năng thật, loại 2 là giả định."
        formulas:
          - "If + S + V2 (quá khứ đơn), S + would/wouldn't + V"
          - "If + S + were …, S + would + V"
          - "If I were you, I'd + V (lời khuyên)"
        hook: "If we had more testers, we would release every week."
      functions:
        - title: "Tình huống trái với hiện tại"
          explain: "Thực tế không như vậy; tưởng tượng điều ngược lại."
          examples:
            [
              "If I had more time, I'd learn Rust.",
              "If the office were closer, I'd go in every day.",
            ]
        - title: "Giả định khó xảy ra"
          explain: "Chuyện ít khả năng xảy ra, thường bắt đầu bằng What would you do if…?"
          examples:
            ["If I won the lottery, I'd open a café.", "What would you do if the CEO called you?"]
        - title: "Lời khuyên: If I were you"
          explain: "Cách khuyên nhẹ nhàng, rất hay gặp."
          examples: ["If I were you, I'd ask for a raise."]
        - title: "Từ chối, giải thích khéo"
          explain: "Nêu lý do không làm được một cách lịch sự."
          examples: ["I'd help you if I weren't so busy."]
      structure:
        forms:
          - {
              label: "If trước",
              pattern: "If + V2, would + V",
              example: "If it were cheaper, we'd buy it.",
            }
          - {
              label: "If sau",
              pattern: "would + V + if + V2",
              example: "We'd buy it if it were cheaper.",
            }
          - {
              label: "Phủ định",
              pattern: "wouldn't + V · if + didn't + V",
              example: "If we didn't have tests, we wouldn't trust the code.",
            }
          - {
              label: "Câu hỏi",
              pattern: "What would + S + V + if + V2?",
              example: "What would you change if you were the PM?",
            }
          - {
              label: "Rút gọn",
              pattern: "I'd · you'd · we'd = I/you/we would",
              example: "I'd say yes.",
            }
        steps:
          - title: "Có thật hay tưởng tượng?"
            explain: "Có thể xảy ra thật → loại 1 (if + hiện tại, will). Trái thực tế hoặc khó xảy ra → loại 2."
            example: "If it rains, I'll stay in. / If I lived in Da Lat, I'd never need a fan."
          - title: "Mệnh đề if: quá khứ đơn"
            explain: "Không đặt would sau if. Với be, văn chuẩn dùng were cho mọi chủ ngữ."
            example: "If she were here… (không phải If she would be here…)"
          - title: "Mệnh đề kết quả: would + V nguyên mẫu"
            explain: "Có thể thay would bằng could (có thể) hoặc might (có lẽ)."
            example: "If we had a budget, we could hire a designer."
      examples:
        - tag: "Trái hiện tại"
          en: "If I had more time, I would learn Japanese."
          vi: "Nếu có nhiều thời gian hơn, mình sẽ học tiếng Nhật."
          note: "Thực tế là không có thời gian → had + would."
        - tag: "Câu hỏi"
          en: "Would you move to Singapore if they offered you a job there?"
          vi: "Giả sử họ mời bạn làm việc ở Singapore, bạn có chuyển sang đó không?"
          note: "Câu hỏi: Would + S + V + if + V2 (offered)."
        - tag: "Giả sử"
          en: "What would you do if the server went down during the demo?"
          vi: "Giả sử server sập giữa buổi demo thì bạn sẽ làm gì?"
          note: "Tình huống giả định → went + would."
        - tag: "Phủ định"
          en: "If we didn't have a CI pipeline, every release would take days."
          vi: "Nếu không có pipeline CI, mỗi lần release sẽ mất cả mấy ngày."
          note: "Thực tế là có CI → didn't have + would."
        - tag: "Ước muốn"
          en: "If our apartment had a balcony, we would grow vegetables."
          vi: "Nếu căn hộ có ban công, tụi mình sẽ trồng rau."
          note: "Thực tế không có ban công → had + would."
        - tag: "Could"
          en: "If we had a bigger budget, we could hire a designer."
          vi: "Nếu có ngân sách lớn hơn, tụi mình có thể thuê một designer."
          note: "Could = would be able to (có thể)."
        - tag: "Từ chối khéo"
          en: "I would have lunch with you if I weren't so busy."
          vi: "Mình sẽ đi ăn trưa với bạn nếu không quá bận."
          note: "Thực tế đang bận → weren't + would."
        - tag: "Nơi ở"
          en: "If I lived in Da Lat, I wouldn't need air conditioning."
          vi: "Nếu sống ở Đà Lạt, mình sẽ không cần máy lạnh."
          note: "Thực tế không sống ở Đà Lạt → lived + wouldn't."
      contrast:
        title: "Câu điều kiện loại 1 và loại 2"
        rows:
          - {
              label: "Loại 1",
              note: "có thể xảy ra thật · if + hiện tại, will",
              example: "If I get the job, I'll move to Hanoi.",
            }
          - {
              label: "Loại 2",
              note: "giả định, khó xảy ra · if + V2, would",
              example: "If I got a job in Tokyo, I'd move there.",
            }
          - {
              label: "If I were you",
              note: "lời khuyên",
              example: "If I were you, I'd take the offer.",
            }
          - {
              label: "could / might",
              note: "thay would để nói khả năng",
              example: "If we had more data, we might find the cause.",
            }
        fixes:
          - {
              wrong: "If I would have time, I would help.",
              right: "If I had time, I would help.",
              why: "Không dùng would trong mệnh đề if.",
            }
          - {
              wrong: "If I am you, I'd say no.",
              right: "If I were you, I'd say no.",
              why: "Giả định trái thực tế: If I were you.",
            }
          - {
              wrong: "If we had more money, we will hire more people.",
              right: "If we had more money, we would hire more people.",
              why: "Loại 2 đi với would, không phải will.",
            }
          - {
              wrong: "If she knew the answer, she would told us.",
              right: "If she knew the answer, she would tell us.",
              why: "Sau would là V nguyên mẫu.",
            }
  - slug: g-b1-present-perfect-continuous
    kind: grammar
    title: { en: "Present perfect continuous", vi: "Hiện tại hoàn thành tiếp diễn" }
    questions:
      [
        g-b1-present-perfect-continuous-1,
        g-b1-present-perfect-continuous-2,
        g-b1-present-perfect-continuous-3,
        g-b1-present-perfect-continuous-4,
        g-b1-present-perfect-continuous-5,
        g-b1-present-perfect-continuous-6,
        g-b1-present-perfect-continuous-7,
        g-b1-present-perfect-continuous-8,
      ]
    grammar:
      title_vi: "Thì hiện tại hoàn thành tiếp diễn"
      group: "Thì động từ"
      overview:
        focus: "Dùng khi một hoạt động bắt đầu trong quá khứ, kéo dài liên tục đến bây giờ (và có thể vẫn đang tiếp tục). Thì này nhấn vào quá trình và thời lượng (bao lâu rồi), còn hiện tại hoàn thành nhấn vào kết quả và số lượng (xong mấy cái rồi)."
        formulas:
          - "S + have/has + been + V-ing"
          - "S + haven't/hasn't + been + V-ing"
          - "(How long) + have/has + S + been + V-ing…?"
        hook: "I've been debugging this for two hours, and I still haven't found the cause."
      functions:
        - title: "Hoạt động kéo dài đến bây giờ"
          explain: "Bắt đầu trong quá khứ, vẫn đang diễn ra; hay đi với for, since, all day, all morning."
          examples:
            [
              "We've been waiting for the client since 9 a.m.",
              "She's been leading the team for a year.",
            ]
        - title: "Hỏi bao lâu rồi"
          explain: "How long + have/has + S + been + V-ing? hỏi về thời lượng của một hoạt động đang diễn ra."
          examples: ["How long have you been working here?"]
        - title: "Giải thích dấu hiệu ở hiện tại"
          explain: "Thấy kết quả trước mắt (mệt, ướt, mắt đỏ) và đoán hoạt động vừa diễn ra liên tục trước đó."
          examples:
            [
              "Your hair is wet. Have you been swimming?",
              "I'm tired because I've been coding all night.",
            ]
        - title: "Gần đây, dạo này"
          explain: "Thói quen tạm thời gần đây với lately, recently."
          examples: ["I've been going to the gym a lot lately."]
      structure:
        forms:
          - {
              label: "Khẳng định",
              pattern: "I/you/we/they have been + V-ing · he/she/it has been + V-ing",
              example: "They have been testing the app all week.",
            }
          - {
              label: "Phủ định",
              pattern: "S + haven't/hasn't been + V-ing",
              example: "He hasn't been feeling well lately.",
            }
          - {
              label: "Nghi vấn",
              pattern: "Have/Has + S + been + V-ing…?",
              example: "Has it been raining?",
            }
          - {
              label: "How long",
              pattern: "How long + have/has + S + been + V-ing?",
              example: "How long have they been talking?",
            }
          - {
              label: "Rút gọn",
              pattern: "I've been · she's been · it's been",
              example: "It's been snowing since Monday.",
            }
        steps:
          - title: "Hoạt động có còn kéo dài không?"
            explain: "Nếu muốn nhấn vào quá trình, thời lượng → been + V-ing. Nếu muốn nói kết quả, số lượng đã xong → hiện tại hoàn thành."
            example: "I've been writing emails all morning. / I've written ten emails."
          - title: "Chọn have hay has, thêm been"
            explain: "Been luôn đứng sau have/has và không đổi hình thức."
            example: "The team has been working remotely."
          - title: "Động từ chỉ trạng thái thì không dùng V-ing"
            explain: "Know, like, want, believe, own… dùng hiện tại hoàn thành thường."
            example: "I've known him for years. (không phải have been knowing)"
      examples:
        - tag: "Cả buổi sáng"
          en: "I've been working on this bug all morning."
          vi: "Mình loay hoay với con bug này cả buổi sáng rồi."
          note: "Hoạt động kéo dài từ sáng tới giờ, nhấn vào quá trình."
        - tag: "How long"
          en: "Sorry I'm late. How long have you been waiting?"
          vi: "Xin lỗi mình tới trễ. Bạn đợi bao lâu rồi?"
          note: "Hỏi thời lượng của việc vẫn đang diễn ra."
        - tag: "Since"
          en: "She has been testing the payment flow since lunch, so she is tired."
          vi: "Chị ấy test luồng thanh toán từ trưa tới giờ nên đang mệt."
          note: "She → has been; since + mốc bắt đầu."
        - tag: "Phủ định"
          en: "We haven't been sleeping well because of the release."
          vi: "Dạo này tụi mình ngủ không ngon vì đợt release."
          note: "Haven't been + V-ing: dạo gần đây không…"
        - tag: "Dấu hiệu"
          en: "Your eyes are red. Have you been staring at the screen all day?"
          vi: "Mắt bạn đỏ quá. Cả ngày nay bạn dán mắt vào màn hình à?"
          note: "Thấy kết quả trước mắt, hỏi về hoạt động kéo dài gây ra nó."
        - tag: "Chưa xong"
          en: "I've been writing the docs, but I haven't finished them yet."
          vi: "Mình viết tài liệu nãy giờ, nhưng vẫn chưa xong."
          note: "Been writing: quá trình; haven't finished: kết quả chưa có."
        - tag: "Thời tiết"
          en: "It's been raining since this morning, so the roads are flooded."
          vi: "Trời mưa từ sáng tới giờ nên đường ngập hết rồi."
          note: "It's been = It has been; since + mốc bắt đầu."
        - tag: "For"
          en: "They have been using this library for five years, and they still love it."
          vi: "Họ dùng thư viện này được năm năm rồi, mà vẫn rất thích nó."
          note: "For + khoảng thời gian; việc vẫn còn tiếp tục."
      contrast:
        title: "Quá trình hay kết quả"
        rows:
          - {
              label: "have been + V-ing",
              note: "quá trình, bao lâu",
              example: "I've been reading the spec for an hour.",
            }
          - {
              label: "have + V3",
              note: "kết quả, bao nhiêu",
              example: "I've read twenty pages of the spec.",
            }
          - {
              label: "Động từ trạng thái",
              note: "know, like, own → không dùng V-ing",
              example: "We've owned this domain since 2020.",
            }
          - {
              label: "Hiện tại tiếp diễn",
              note: "chỉ nói bây giờ, không nói từ bao giờ",
              example: "I'm reading the spec now.",
            }
        fixes:
          - {
              wrong: "I am working here since 2023.",
              right: "I have been working here since 2023.",
              why: "Có since và việc kéo dài đến nay → have been + V-ing, không dùng hiện tại tiếp diễn.",
            }
          - {
              wrong: "I've been knowing him for years.",
              right: "I've known him for years.",
              why: "Know là động từ trạng thái, không chia V-ing.",
            }
          - {
              wrong: "She has been work all day.",
              right: "She has been working all day.",
              why: "Sau been là V-ing.",
            }
          - {
              wrong: "How long are you waiting?",
              right: "How long have you been waiting?",
              why: "Hỏi bao lâu rồi → How long have you been + V-ing.",
            }
  - slug: g-b1-past-perfect
    kind: grammar
    title: { en: "Past perfect", vi: "Quá khứ hoàn thành" }
    questions:
      [
        g-b1-past-perfect-1,
        g-b1-past-perfect-2,
        g-b1-past-perfect-3,
        g-b1-past-perfect-4,
        g-b1-past-perfect-5,
        g-b1-past-perfect-6,
        g-b1-past-perfect-7,
        g-b1-past-perfect-8,
      ]
    grammar:
      title_vi: "Thì quá khứ hoàn thành"
      group: "Thì động từ"
      overview:
        focus: "Khi kể chuyện quá khứ, quá khứ hoàn thành (had + V3) đánh dấu việc xảy ra TRƯỚC một mốc hoặc một việc khác trong quá khứ. Việc sau dùng quá khứ đơn. Nó giống như hiện tại hoàn thành nhưng lùi về quá khứ."
        formulas:
          - "S + had + V3"
          - "S + hadn't + V3 · Had + S + V3…?"
          - "When/By the time + S + V2, S + had (already) + V3"
        hook: "When I joined the call, they had already made the decision."
      functions:
        - title: "Việc xảy ra trước việc khác"
          explain: "Hai việc trong quá khứ: việc trước → had + V3, việc sau → V2."
          examples:
            [
              "When we arrived, the train had left.",
              "After she had read the report, she called me.",
            ]
        - title: "By the time, already, before"
          explain: "Các từ này hay đi kèm để làm rõ thứ tự thời gian."
          examples: ["By the time I logged in, the sale had ended."]
        - title: "Giải thích nguyên nhân trong quá khứ"
          explain: "Vì trước đó đã có chuyện gì nên mới xảy ra kết quả."
          examples: ["The app crashed because someone had changed the config."]
        - title: "Trải nghiệm tính đến một mốc quá khứ"
          explain: "Never/ever + had + V3: trước lúc đó chưa từng/đã từng."
          examples: ["I had never seen snow before I moved to Canada."]
      structure:
        forms:
          - {
              label: "Khẳng định",
              pattern: "S + had + V3 (mọi ngôi)",
              example: "She had finished the slides.",
            }
          - { label: "Phủ định", pattern: "S + hadn't + V3", example: "We hadn't tested it." }
          - { label: "Nghi vấn", pattern: "Had + S + V3…?", example: "Had they paid the invoice?" }
          - {
              label: "Rút gọn",
              pattern: "I'd · she'd · they'd (= had)",
              example: "I'd already left.",
            }
          - {
              label: "Hai việc",
              pattern: "When + V2, … had + V3",
              example: "When I called, he had gone out.",
            }
        steps:
          - title: "Xác định hai việc và thứ tự"
            explain: "Việc nào xảy ra trước? Việc đó dùng had + V3."
            example: "[1] The meeting started. [2] I arrived. → When I arrived, the meeting had started."
          - title: "Had dùng cho mọi chủ ngữ"
            explain: "Không có has/have trong quá khứ hoàn thành."
            example: "They had / He had / I had"
          - title: "Không cần khi thứ tự đã rõ"
            explain: "Kể lần lượt từng việc theo đúng thứ tự thì chỉ cần quá khứ đơn."
            example: "I opened my laptop, checked email and joined the call."
      examples:
        - tag: "When"
          en: "When I joined the call, the demo had already started."
          vi: "Lúc mình vào cuộc gọi thì buổi demo đã bắt đầu rồi."
          note: "Demo bắt đầu trước khi mình vào → had started."
        - tag: "Never"
          en: "She had never used Docker before she started this job."
          vi: "Trước khi nhận việc này, chị ấy chưa từng dùng Docker."
          note: "Trải nghiệm tính đến một mốc trong quá khứ."
        - tag: "By the time"
          en: "By the time we noticed, someone had already deleted the backup."
          vi: "Đến lúc tụi mình phát hiện thì ai đó đã xoá bản backup mất rồi."
          note: "By the time + V2, had + V3."
        - tag: "Nguyên nhân"
          en: "The server crashed because nobody had renewed the certificate."
          vi: "Server sập vì trước đó không ai gia hạn chứng chỉ."
          note: "Nguyên nhân xảy ra trước kết quả → had renewed."
        - tag: "Về hết rồi"
          en: "By the time I got to the office, everyone had gone home."
          vi: "Lúc mình tới văn phòng thì mọi người về hết rồi."
          note: "Go → gone (V3)."
        - tag: "After"
          en: "After we had fixed the bug, we deployed the patch."
          vi: "Sau khi sửa xong bug, tụi mình deploy bản vá."
          note: "After + had + V3 nhấn mạnh việc trước đã hoàn tất."
        - tag: "Đã kết thúc"
          en: "The meeting had already finished when I remembered it."
          vi: "Đến lúc mình nhớ ra thì cuộc họp đã kết thúc rồi."
          note: "Mệnh đề when có thể đứng sau."
        - tag: "Lần đầu"
          en: "It was the first time I had spoken to a CEO."
          vi: "Đó là lần đầu tiên mình nói chuyện với một CEO."
          note: "It was the first time + had + V3."
      contrast:
        title: "Quá khứ đơn hay quá khứ hoàn thành"
        rows:
          - {
              label: "Quá khứ đơn",
              note: "việc xảy ra sau, hoặc kể theo thứ tự",
              example: "I arrived at 9.",
            }
          - {
              label: "Quá khứ hoàn thành",
              note: "việc xảy ra trước một việc quá khứ khác",
              example: "The meeting had started before I arrived.",
            }
          - {
              label: "Hiện tại hoàn thành",
              note: "mốc so sánh là bây giờ",
              example: "The meeting has started. Hurry up!",
            }
        fixes:
          - {
              wrong: "When I arrived, the meeting has already started.",
              right: "When I arrived, the meeting had already started.",
              why: "Mốc là quá khứ (When I arrived) → had, không phải has.",
            }
          - {
              wrong: "Everyone had went home.",
              right: "Everyone had gone home.",
              why: "Sau had là V3: go – went – gone.",
            }
          - {
              wrong: "After he had finish the report, he left.",
              right: "After he had finished the report, he left.",
              why: "Had + V3 (finished).",
            }
          - {
              wrong: "Before I came here, I never worked in a startup.",
              right: "Before I came here, I had never worked in a startup.",
              why: "Trải nghiệm tính đến một mốc quá khứ → had never + V3.",
            }
  - slug: g-b1-might-may-could
    kind: grammar
    title: { en: "Might, may, could (possibility)", vi: "Might, may, could: khả năng" }
    questions:
      [
        g-b1-might-may-could-1,
        g-b1-might-may-could-2,
        g-b1-might-may-could-3,
        g-b1-might-may-could-4,
        g-b1-might-may-could-5,
        g-b1-might-may-could-6,
        g-b1-might-may-could-7,
        g-b1-might-may-could-8,
      ]
    grammar:
      title_vi: "Might, may, could: nói về khả năng ở hiện tại và tương lai"
      group: "Động từ khuyết thiếu"
      overview:
        focus: "Khi không chắc chắn (khoảng 30–50%), tiếng Anh dùng might, may hoặc could + V nguyên mẫu, tương đương “có thể, có lẽ”. Ba từ gần nghĩa nhau; may hơi trang trọng hơn. Phủ định dùng might not / may not (không dùng could not với nghĩa này)."
        formulas:
          - "S + might/may/could + V (nguyên mẫu)"
          - "S + might not/may not + V"
          - "There might/may/could be + N"
        hook: "The API might be down. Let me check the status page."
      functions:
        - title: "Đoán về hiện tại"
          explain: "Không chắc điều gì đang đúng bây giờ."
          examples: ["She might be in a meeting.", "The problem could be the cache."]
        - title: "Khả năng trong tương lai"
          explain: "Việc có thể xảy ra nhưng chưa chắc."
          examples: ["It may rain later.", "We might hire two more developers next year."]
        - title: "Khả năng không xảy ra"
          explain: "Might not / may not = có thể sẽ không."
          examples: ["I might not finish today.", "The client may not agree."]
        - title: "Gợi ý nhẹ nhàng"
          explain: "Could dùng để đưa ra một phương án có thể làm."
          examples: ["We could ask Lan. She knows the old system."]
      structure:
        forms:
          - {
              label: "Khẳng định",
              pattern: "S + might/may/could + V",
              example: "He might know the answer.",
            }
          - {
              label: "Phủ định",
              pattern: "S + might not/may not + V",
              example: "They may not come.",
            }
          - { label: "There", pattern: "There might/may be + N", example: "There may be a delay." }
          - {
              label: "Với be + V-ing",
              pattern: "S + might be + V-ing",
              example: "She might be working from home today.",
            }
        steps:
          - title: "Bạn có chắc không?"
            explain: "Chắc chắn → hiện tại đơn hoặc will. Không chắc → might/may/could."
            example: "It will rain. (chắc) / It might rain. (có thể)"
          - title: "Sau modal là V nguyên mẫu"
            explain: "Không thêm -s, không thêm to, không chia thì."
            example: "He might know. (không phải mights / might to / might knows)"
          - title: "Phủ định: might not / may not"
            explain: "Could not mang nghĩa “không thể nào”, khác với “có thể sẽ không”."
            example: "He might not come. (có lẽ không đến)"
      examples:
        - tag: "Đoán"
          en: "The API might be down. We are getting timeouts."
          vi: "Có thể API đang sập. Tụi mình toàn bị timeout."
          note: "Might + be: đoán về tình trạng hiện tại."
        - tag: "Thời tiết"
          en: "It may rain this afternoon, so take an umbrella."
          vi: "Chiều nay có thể mưa, nên mang theo ô nhé."
          note: "May + V: khả năng trong tương lai."
        - tag: "Might not"
          en: "She might not come to the meeting. Her daughter is sick."
          vi: "Chị ấy có thể sẽ không đến họp. Con gái chị bị ốm."
          note: "Might not + V: có thể sẽ không."
        - tag: "Could"
          en: "The problem could be in the config file."
          vi: "Có thể vấn đề nằm ở file config."
          note: "Could + be: một khả năng, chưa chắc chắn."
        - tag: "May"
          en: "Ask Nam. He may know the password."
          vi: "Hỏi Nam đi. Có thể anh ấy biết mật khẩu."
          note: "May + V nguyên mẫu (know, không phải knows)."
        - tag: "Kế hoạch"
          en: "They might move the release to next week."
          vi: "Có thể họ sẽ dời bản phát hành sang tuần sau."
          note: "Kế hoạch chưa chắc chắn."
        - tag: "Phủ định"
          en: "It may not be a bug at all."
          vi: "Có khi đó hoàn toàn không phải bug."
          note: "May not be: có thể không phải."
        - tag: "There"
          en: "There might be a problem with the payment gateway."
          vi: "Có thể đang có trục trặc với cổng thanh toán."
          note: "There might be + danh từ."
      contrast:
        title: "Mức độ chắc chắn"
        rows:
          - { label: "will / is", note: "chắc chắn", example: "The server is down." }
          - {
              label: "might / may / could",
              note: "có thể, không chắc",
              example: "The server might be down.",
            }
          - {
              label: "might not / may not",
              note: "có thể không",
              example: "The server may not be down.",
            }
          - {
              label: "maybe + câu thường",
              note: "trạng từ, đứng đầu câu",
              example: "Maybe the server is down.",
            }
        fixes:
          - {
              wrong: "The API mights be down.",
              right: "The API might be down.",
              why: "Modal không thêm -s với he/she/it.",
            }
          - {
              wrong: "He may knows the password.",
              right: "He may know the password.",
              why: "Sau may là V nguyên mẫu.",
            }
          - {
              wrong: "It might to rain later.",
              right: "It might rain later.",
              why: "Không dùng to sau might/may/could.",
            }
          - {
              wrong: "Maybe she might come.",
              right: "She might come.",
              why: "Maybe và might cùng nghĩa; dùng một trong hai.",
            }
  - slug: g-b1-must-cant-deduction
    kind: grammar
    title: { en: "Must & can't (deduction)", vi: "Must và can't: suy luận" }
    questions:
      [
        g-b1-must-cant-deduction-1,
        g-b1-must-cant-deduction-2,
        g-b1-must-cant-deduction-3,
        g-b1-must-cant-deduction-4,
        g-b1-must-cant-deduction-5,
        g-b1-must-cant-deduction-6,
        g-b1-must-cant-deduction-7,
        g-b1-must-cant-deduction-8,
      ]
    grammar:
      title_vi: "Must và can't: suy luận về hiện tại"
      group: "Động từ khuyết thiếu"
      overview:
        focus: "Khi có bằng chứng rõ ràng, ta suy luận: must + V = chắc hẳn là (gần như chắc đúng); can't + V = không thể nào (gần như chắc sai). Lưu ý: phủ định của must suy luận là can't, không phải mustn't (mustn't nghĩa là cấm)."
        formulas:
          - "S + must + V (chắc hẳn)"
          - "S + can't + V (không thể nào)"
          - "S + must/can't + be + V-ing"
        hook: "You've been working for ten hours. You must be exhausted."
      functions:
        - title: "Must: gần như chắc đúng"
          explain: "Dựa vào bằng chứng, kết luận điều gì đó chắc hẳn đúng."
          examples: ["The lights are on. Someone must be in the office."]
        - title: "Can't: gần như chắc sai"
          explain: "Bằng chứng cho thấy điều đó không thể đúng."
          examples: ["That can't be right. I checked it twice."]
        - title: "Đoán việc đang diễn ra"
          explain: "Must/can't + be + V-ing cho hoạt động đang xảy ra lúc nói."
          examples: ["He isn't replying. He must be driving."]
        - title: "Phản ứng khi trò chuyện"
          explain: "Thể hiện đồng cảm hoặc ngạc nhiên."
          examples: ["You must be happy with the result!", "You can't be serious!"]
      structure:
        forms:
          - { label: "Chắc hẳn", pattern: "S + must + V", example: "She must know him." }
          - { label: "Không thể", pattern: "S + can't + V", example: "It can't be Friday already." }
          - {
              label: "Đang làm",
              pattern: "S + must/can't + be + V-ing",
              example: "They must be having lunch.",
            }
          - {
              label: "Không chắc",
              pattern: "S + might/may/could + V",
              example: "She might know him.",
            }
        steps:
          - title: "Bạn chắc đến mức nào?"
            explain: "Gần chắc đúng → must; không chắc → might; gần chắc sai → can't."
            example: "He must / might / can't be at home."
          - title: "Phủ định là can't"
            explain: "Mustn't = không được phép, không dùng để suy luận."
            example: "It can't be true. (không phải It mustn't be true)"
          - title: "Sau must/can't là V nguyên mẫu"
            explain: "Không có to, không chia động từ."
            example: "You must be tired. (không phải must to be / must are)"
      examples:
        - tag: "Đồng cảm"
          en: "You've been working for ten hours. You must be exhausted."
          vi: "Bạn làm mười tiếng rồi. Chắc bạn mệt lả lắm."
          note: "Bằng chứng: mười tiếng làm việc → must be."
        - tag: "Không thể"
          en: "That can't be Minh. He is on holiday in Da Nang."
          vi: "Đó không thể là Minh được. Anh ấy đang đi nghỉ ở Đà Nẵng."
          note: "Biết chắc Minh ở nơi khác → can't be."
        - tag: "Bằng chứng"
          en: "The lights are off, so the office must be empty."
          vi: "Đèn tắt hết rồi, chắc văn phòng không còn ai."
          note: "Must be + tính từ."
        - tag: "File sai"
          en: "This can't be the right file. It's from 2019."
          vi: "Đây không thể là file đúng được. Nó từ năm 2019 lận."
          note: "Can't be + danh từ."
        - tag: "Chắc biết"
          en: "She must know the answer. She wrote the code."
          vi: "Chắc chắn chị ấy biết câu trả lời. Chính chị ấy viết đoạn code đó."
          note: "Must + V nguyên mẫu (know)."
        - tag: "Ngạc nhiên"
          en: "You can't be serious! The deadline is tomorrow?"
          vi: "Bạn không thể nói thật được! Hạn chót là ngày mai á?"
          note: "Can't be serious: không tin nổi."
        - tag: "There must be"
          en: "There must be a mistake somewhere. The totals don't match."
          vi: "Chắc chắn có sai ở đâu đó. Tổng số không khớp."
          note: "There must be + danh từ."
        - tag: "Không ở nhà"
          en: "He can't be at home. His car isn't there."
          vi: "Anh ấy không thể ở nhà được. Xe anh ấy không có ở đó."
          note: "Bằng chứng (không thấy xe) → can't be."
      contrast:
        title: "Must suy luận và must bắt buộc"
        rows:
          - { label: "must (suy luận)", note: "chắc hẳn là", example: "She must be tired." }
          - {
              label: "can't (suy luận)",
              note: "không thể nào",
              example: "She can't be tired. She just woke up.",
            }
          - {
              label: "mustn't (cấm)",
              note: "không được phép",
              example: "You mustn't share your password.",
            }
          - { label: "might (không chắc)", note: "có thể", example: "She might be tired." }
        fixes:
          - {
              wrong: "That mustn't be Minh. He is on holiday.",
              right: "That can't be Minh. He is on holiday.",
              why: "Suy luận phủ định dùng can't; mustn't nghĩa là cấm.",
            }
          - {
              wrong: "You must being tired.",
              right: "You must be tired.",
              why: "Sau must là V nguyên mẫu (be).",
            }
          - {
              wrong: "They must are busy.",
              right: "They must be busy.",
              why: "Không chia be sau must.",
            }
          - {
              wrong: "She must to know the answer.",
              right: "She must know the answer.",
              why: "Không dùng to sau must.",
            }
  - slug: g-b1-reported-statements
    kind: grammar
    title: { en: "Reported statements", vi: "Câu tường thuật: câu kể" }
    questions:
      [
        g-b1-reported-statements-1,
        g-b1-reported-statements-2,
        g-b1-reported-statements-3,
        g-b1-reported-statements-4,
        g-b1-reported-statements-5,
        g-b1-reported-statements-6,
        g-b1-reported-statements-7,
        g-b1-reported-statements-8,
      ]
    grammar:
      title_vi: "Câu tường thuật với say và tell"
      group: "Câu tường thuật"
      overview:
        focus: "Khi kể lại lời người khác, ta dùng said hoặc told + mệnh đề (that có thể bỏ). Vì lời nói đã ở quá khứ, động từ thường lùi một thì (is → was, will → would, can → could, đã làm → had + V3), đồng thời đổi đại từ và từ chỉ thời gian cho hợp với người kể."
        formulas:
          - "S + said (that) + S + V (lùi thì)"
          - "S + told + người nghe + (that) + S + V (lùi thì)"
          - "is → was · will → would · can → could · V2 → had + V3"
        hook: "“I'm busy.” → She said she was busy."
      functions:
        - title: "Say và tell"
          explain: "Say không có người nghe ngay sau. Tell luôn có người nghe ngay sau (told me, told us)."
          examples: ["He said he was tired.", "He told me he was tired."]
        - title: "Lùi thì"
          explain: "Hiện tại → quá khứ; quá khứ đơn hoặc hiện tại hoàn thành → quá khứ hoàn thành; will → would; can → could."
          examples:
            [
              "“We can help.” → They said they could help.",
              "“I lost my key.” → She said she had lost her key.",
            ]
        - title: "Đổi đại từ"
          explain: "I, we, my… đổi theo người được nhắc tới."
          examples: ["“I like my job.” → Nam said he liked his job."]
        - title: "Đổi từ chỉ thời gian, nơi chốn"
          explain: "Today → that day, tomorrow → the next day, yesterday → the day before, here → there."
          examples: ["“I'll call you tomorrow.” → He said he would call me the next day."]
      structure:
        forms:
          - {
              label: "Said",
              pattern: "S + said (that) + mệnh đề",
              example: "Linh said (that) she was busy.",
            }
          - {
              label: "Told",
              pattern: "S + told + O + (that) + mệnh đề",
              example: "Linh told me (that) she was busy.",
            }
          - {
              label: "Hiện tại → quá khứ",
              pattern: "am/is/are → was/were · do → did",
              example: "“I work here.” → He said he worked there.",
            }
          - {
              label: "Quá khứ → had + V3",
              pattern: "V2 / have + V3 → had + V3",
              example: "“I've finished.” → She said she had finished.",
            }
          - {
              label: "Modal",
              pattern: "will → would · can → could",
              example: "“I'll be late.” → He said he would be late.",
            }
        steps:
          - title: "Chọn said hay told"
            explain: "Có người nghe ngay sau động từ → told + người nghe; không có → said."
            example: "She told us… / She said…"
          - title: "Lùi thì động từ"
            explain: "Lùi một bậc về quá khứ. Nếu điều đó vẫn đúng đến giờ, đôi khi có thể giữ nguyên, nhưng lùi thì luôn an toàn."
            example: "“The API is slow.” → He said the API was slow."
          - title: "Đổi đại từ và thời gian"
            explain: "Đứng ở vị trí người kể để đổi I/my/today/tomorrow cho đúng."
            example: "“I'll send it today.” → She said she would send it that day."
      examples:
        - tag: "Said"
          en: "Linh said that she was busy."
          vi: "Linh nói là chị ấy đang bận."
          note: "“I am busy” → was busy; I → she."
        - tag: "Told"
          en: "He told me he would send the file later."
          vi: "Anh ấy bảo mình là anh ấy sẽ gửi file sau."
          note: "Told + người nghe (me); will → would."
        - tag: "Phủ định"
          en: "The client said they didn't like the new logo."
          vi: "Khách nói là họ không thích logo mới."
          note: "“We don't like…” → they didn't like."
        - tag: "Had + V3"
          en: "She told us that the server had crashed the night before."
          vi: "Chị ấy kể với tụi mình là server đã sập vào tối hôm trước."
          note: "“It crashed last night” → had crashed the night before."
        - tag: "Could"
          en: "Minh said he couldn't come to the party."
          vi: "Minh nói là anh ấy không đến dự tiệc được."
          note: "Can't → couldn't."
        - tag: "Khen"
          en: "My manager told me that I was doing a great job."
          vi: "Quản lý nói với mình là mình đang làm rất tốt."
          note: "“You are doing…” → I was doing; you → I."
        - tag: "Thời gian"
          en: "They said they were moving to a new office the following month."
          vi: "Họ nói là tháng sau đó họ sẽ chuyển sang văn phòng mới."
          note: "Next month → the following month; are → were."
        - tag: "Đổi đại từ"
          en: "He said the tests were passing on his machine."
          vi: "Anh ấy nói là test vẫn chạy qua trên máy của anh ấy."
          note: "“The tests are passing on my machine” → were, my → his."
      contrast:
        title: "Lời nói trực tiếp và câu tường thuật"
        rows:
          - {
              label: "“I am…”",
              note: "→ said (that) he was…",
              example: "“I'm ready.” → He said he was ready.",
            }
          - {
              label: "“I will…”",
              note: "→ said she would…",
              example: "“I'll call.” → She said she would call.",
            }
          - {
              label: "“I did / have done…”",
              note: "→ said they had done…",
              example: "“We fixed it.” → They said they had fixed it.",
            }
          - {
              label: "today / tomorrow / yesterday",
              note: "→ that day / the next day / the day before",
              example: "He said he was leaving the next day.",
            }
        fixes:
          - {
              wrong: "She said me that she was busy.",
              right: "She told me that she was busy.",
              why: "Có người nghe ngay sau → told me, không phải said me.",
            }
          - {
              wrong: "He told that he was tired.",
              right: "He said that he was tired.",
              why: "Tell phải có người nghe; không có thì dùng said.",
            }
          - {
              wrong: "He told to me that he was tired.",
              right: "He told me that he was tired.",
              why: "Tell + người nghe, không có to.",
            }
  - slug: g-b1-reported-questions
    kind: grammar
    title: { en: "Reported questions", vi: "Câu tường thuật: câu hỏi" }
    questions:
      [
        g-b1-reported-questions-1,
        g-b1-reported-questions-2,
        g-b1-reported-questions-3,
        g-b1-reported-questions-4,
        g-b1-reported-questions-5,
        g-b1-reported-questions-6,
        g-b1-reported-questions-7,
        g-b1-reported-questions-8,
      ]
    grammar:
      title_vi: "Tường thuật câu hỏi"
      group: "Câu tường thuật"
      overview:
        focus: "Khi kể lại một câu hỏi, câu không còn là câu hỏi nữa: chủ ngữ đứng trước động từ, bỏ do/does/did, bỏ dấu chấm hỏi và vẫn lùi thì như câu kể. Câu hỏi Yes/No dùng if hoặc whether; câu hỏi có từ để hỏi giữ nguyên từ đó."
        formulas:
          - "S + asked (+ O) + if/whether + S + V (lùi thì)"
          - "S + asked (+ O) + wh- + S + V (lùi thì)"
          - "wanted to know / wondered + if/wh- + S + V"
        hook: "“Are you free on Friday?” → She asked me if I was free on Friday."
      functions:
        - title: "Câu hỏi Yes/No → if/whether"
          explain: "Thêm if hoặc whether, rồi viết như câu kể."
          examples: ["“Do you use Vim?” → He asked if I used Vim."]
        - title: "Câu hỏi có từ để hỏi"
          explain: "Giữ what/where/when/why/how, rồi đặt chủ ngữ trước động từ."
          examples: ["“Where do you live?” → She asked where I lived."]
        - title: "Bỏ trợ động từ do/does/did"
          explain: "Động từ chính tự mang thì quá khứ."
          examples: ["“When did you start?” → They asked when I had started."]
        - title: "Cách nói khác của asked"
          explain: "Wanted to know, wondered dùng y như asked."
          examples: ["He wanted to know how much it cost."]
      structure:
        forms:
          - {
              label: "Yes/No",
              pattern: "asked (O) + if/whether + S + V",
              example: "She asked me if I was ready.",
            }
          - {
              label: "Wh-",
              pattern: "asked (O) + wh- + S + V",
              example: "He asked what time it was.",
            }
          - {
              label: "Be",
              pattern: "wh- + S + was/were (cuối mệnh đề)",
              example: "They asked where the station was.",
            }
          - {
              label: "Modal",
              pattern: "can → could · will → would",
              example: "She asked if I could help.",
            }
        steps:
          - title: "Câu hỏi loại nào?"
            explain: "Yes/No → thêm if/whether. Có từ để hỏi → giữ từ đó."
            example: "“Is it ready?” → if it was ready"
          - title: "Đưa về trật tự câu kể"
            explain: "Chủ ngữ + động từ; bỏ do/does/did; không dùng dấu ?."
            example: "“Where is the room?” → where the room was"
          - title: "Lùi thì, đổi đại từ"
            explain: "Giống câu kể: is → was, you → I…"
            example: "“Can you join?” → He asked if I could join."
      examples:
        - tag: "If"
          en: "She asked me if I was free on Friday."
          vi: "Chị ấy hỏi mình có rảnh vào thứ Sáu không."
          note: "“Are you free…?” → if I was free."
        - tag: "Where"
          en: "He asked where the meeting room was."
          vi: "Anh ấy hỏi phòng họp ở đâu."
          note: "Was đứng cuối, sau chủ ngữ (the meeting room)."
        - tag: "When"
          en: "They asked us when we could start."
          vi: "Họ hỏi tụi mình khi nào có thể bắt đầu."
          note: "“When can you start?” → when we could start."
        - tag: "Why"
          en: "The interviewer asked me why I wanted this job."
          vi: "Người phỏng vấn hỏi mình vì sao mình muốn công việc này."
          note: "Bỏ do: “Why do you want…?” → why I wanted."
        - tag: "Whether"
          en: "Lan asked whether the tests were passing."
          vi: "Lan hỏi test có đang chạy qua không."
          note: "Whether = if; are → were."
        - tag: "Wanted to know"
          en: "He wanted to know how much the license cost."
          vi: "Anh ấy muốn biết giấy phép giá bao nhiêu."
          note: "Wanted to know dùng như asked."
        - tag: "Mấy giờ"
          en: "My mum asked me what time I would be home."
          vi: "Mẹ hỏi mình mấy giờ mình về nhà."
          note: "“What time will you be home?” → what time I would be home."
        - tag: "Hay"
          en: "She asked if we were using the old API or the new one."
          vi: "Chị ấy hỏi tụi mình đang dùng API cũ hay API mới."
          note: "If … or …: câu hỏi lựa chọn."
      contrast:
        title: "Câu hỏi trực tiếp và câu hỏi tường thuật"
        rows:
          - {
              label: "Trực tiếp",
              note: "trợ động từ trước chủ ngữ, có dấu ?",
              example: "“Where do you work?”",
            }
          - {
              label: "Tường thuật",
              note: "chủ ngữ trước động từ, không có do, không có ?",
              example: "She asked where I worked.",
            }
          - { label: "Yes/No", note: "thêm if/whether", example: "He asked if I had a car." }
        fixes:
          - {
              wrong: "She asked where did I live.",
              right: "She asked where I lived.",
              why: "Bỏ did, chủ ngữ đứng trước động từ (I lived).",
            }
          - {
              wrong: "He asked me was I ready.",
              right: "He asked me if I was ready.",
              why: "Câu hỏi Yes/No cần if/whether và trật tự câu kể.",
            }
          - {
              wrong: "She asked what time is it?",
              right: "She asked me what time it was.",
              why: "Trật tự câu kể (it was), lùi thì, không có dấu ?.",
            }
  - slug: g-b1-gerund-infinitive
    kind: grammar
    title: { en: "Verb + -ing or to-infinitive", vi: "Động từ + V-ing hay to V" }
    questions:
      [
        g-b1-gerund-infinitive-1,
        g-b1-gerund-infinitive-2,
        g-b1-gerund-infinitive-3,
        g-b1-gerund-infinitive-4,
        g-b1-gerund-infinitive-5,
        g-b1-gerund-infinitive-6,
        g-b1-gerund-infinitive-7,
        g-b1-gerund-infinitive-8,
      ]
    grammar:
      title_vi: "Động từ theo sau là V-ing hay to + V"
      group: "Dạng thức động từ"
      overview:
        focus: "Khi hai động từ đi liền nhau, động từ thứ hai có dạng V-ing hoặc to + V tuỳ động từ đứng trước. Không có quy tắc tuyệt đối, nên hãy học theo nhóm: enjoy, finish, avoid, mind, keep, consider + V-ing; want, need, decide, plan, hope, agree, refuse, manage + to V. Sau giới từ luôn là V-ing."
        formulas:
          - "enjoy/finish/avoid/mind/keep/consider + V-ing"
          - "want/need/decide/plan/hope/agree/refuse/manage + to V"
          - "giới từ (for, about, at, of, to trong look forward to) + V-ing"
        hook: "I enjoy pairing, but I need to focus today."
      functions:
        - title: "Động từ + V-ing"
          explain: "Thường là thói quen, cảm xúc, việc đang diễn ra hoặc vừa kết thúc."
          examples: ["She enjoys teaching.", "I've finished writing the tests.", "Keep trying!"]
        - title: "Động từ + to V"
          explain: "Thường hướng về tương lai: ý định, kế hoạch, mong muốn, quyết định."
          examples: ["We plan to launch in May.", "He refused to sign the contract."]
        - title: "Sau giới từ: V-ing"
          explain: "Thanks for, good at, interested in, think about, look forward to + V-ing."
          examples: ["Thanks for waiting.", "I'm looking forward to working with you."]
        - title: "Stop, remember, forget: đổi nghĩa"
          explain: "Stop + V-ing = bỏ hẳn việc đó; stop + to V = dừng lại để làm việc khác. Remember/forget + to V = nhớ/quên việc cần làm."
          examples:
            ["He stopped smoking.", "He stopped to answer the phone.", "Remember to lock the door."]
        - title: "Cả hai đều được"
          explain: "Like, love, hate, start, begin + V-ing hoặc to V, nghĩa gần như nhau."
          examples: ["It started raining. / It started to rain."]
      structure:
        forms:
          - {
              label: "+ V-ing",
              pattern: "enjoy, finish, avoid, mind, keep, consider, suggest",
              example: "Would you mind waiting?",
            }
          - {
              label: "+ to V",
              pattern: "want, need, decide, plan, hope, agree, refuse, manage, offer, promise",
              example: "She offered to help.",
            }
          - {
              label: "Giới từ + V-ing",
              pattern: "for/at/in/about/of + V-ing",
              example: "I'm bad at remembering names.",
            }
          - {
              label: "Phủ định",
              pattern: "not + V-ing · not + to V",
              example: "I decided not to go.",
            }
        steps:
          - title: "Tìm động từ thứ nhất"
            explain: "Xem nó thuộc nhóm + V-ing hay + to V."
            example: "avoid → avoid using; decide → decide to use"
          - title: "Có giới từ không?"
            explain: "Ngay sau giới từ luôn là V-ing, kể cả to trong look forward to."
            example: "Thanks for coming. I look forward to hearing from you."
          - title: "Đặt not đúng chỗ"
            explain: "Not đứng ngay trước V-ing hoặc to V."
            example: "Try not to be late."
      examples:
        - tag: "Enjoy"
          en: "I enjoy working with this team."
          vi: "Mình thích làm việc với nhóm này."
          note: "Enjoy + V-ing."
        - tag: "Decide"
          en: "We decided to rewrite the old module."
          vi: "Tụi mình quyết định viết lại module cũ."
          note: "Decide + to V."
        - tag: "Finish"
          en: "I finished testing the login page an hour ago."
          vi: "Mình test xong trang đăng nhập cách đây một tiếng."
          note: "Finish + V-ing."
        - tag: "Want"
          en: "He wants to learn Rust next year."
          vi: "Anh ấy muốn học Rust vào năm sau."
          note: "Want + to V."
        - tag: "Mind"
          en: "Would you mind closing the window?"
          vi: "Bạn đóng giúp mình cửa sổ được không?"
          note: "Would you mind + V-ing: nhờ vả lịch sự."
        - tag: "Agree"
          en: "They agreed to extend the deadline."
          vi: "Họ đồng ý gia hạn deadline."
          note: "Agree + to V."
        - tag: "Giới từ"
          en: "Thanks for helping me with the migration."
          vi: "Cảm ơn bạn đã giúp mình với đợt migration."
          note: "Sau for là V-ing."
        - tag: "Need + avoid"
          en: "We need to avoid using global variables in this file."
          vi: "Tụi mình cần tránh dùng biến toàn cục trong file này."
          note: "Need + to V; avoid + V-ing."
      contrast:
        title: "Stop + V-ing hay stop + to V"
        rows:
          - {
              label: "stop + V-ing",
              note: "bỏ, ngừng hẳn việc đó",
              example: "I stopped drinking coffee.",
            }
          - {
              label: "stop + to V",
              note: "dừng việc đang làm để làm việc khác",
              example: "I stopped to drink some coffee.",
            }
          - {
              label: "remember + to V",
              note: "nhớ phải làm (chưa làm)",
              example: "Remember to send the invoice.",
            }
          - {
              label: "remember + V-ing",
              note: "nhớ đã làm (đã làm rồi)",
              example: "I remember sending it on Monday.",
            }
        fixes:
          - {
              wrong: "I enjoy work with this team.",
              right: "I enjoy working with this team.",
              why: "Enjoy + V-ing.",
            }
          - {
              wrong: "Thanks for help me with the migration.",
              right: "Thanks for helping me with the migration.",
              why: "Sau giới từ for là V-ing.",
            }
          - {
              wrong: "He wants learning Rust.",
              right: "He wants to learn Rust.",
              why: "Want + to V.",
            }
          - {
              wrong: "I look forward to meet you.",
              right: "I look forward to meeting you.",
              why: "To trong look forward to là giới từ → V-ing.",
            }
  - slug: g-b1-question-tags
    kind: grammar
    title: { en: "Question tags", vi: "Câu hỏi đuôi" }
    questions:
      [
        g-b1-question-tags-1,
        g-b1-question-tags-2,
        g-b1-question-tags-3,
        g-b1-question-tags-4,
        g-b1-question-tags-5,
        g-b1-question-tags-6,
        g-b1-question-tags-7,
        g-b1-question-tags-8,
      ]
    grammar:
      title_vi: "Câu hỏi đuôi"
      group: "Cấu trúc câu"
      overview:
        focus: "Câu hỏi đuôi là phần ngắn ở cuối câu (…, isn't it? / …, did they?) để xác nhận thông tin, giống “…, đúng không?”, “…, nhỉ?”. Quy tắc: câu khẳng định → đuôi phủ định, câu phủ định → đuôi khẳng định; đuôi dùng lại trợ động từ (be, do, have, modal) và đại từ của chủ ngữ."
        formulas:
          - "Câu khẳng định, + trợ động từ + n't + đại từ?"
          - "Câu phủ định, + trợ động từ + đại từ?"
          - "Không có trợ động từ → do/does/did"
        hook: "You've pushed the fix, haven't you?"
      functions:
        - title: "Xác nhận điều mình nghĩ là đúng"
          explain: "Xuống giọng ở đuôi: gần như chắc, chỉ muốn người kia đồng ý."
          examples: ["It's a nice office, isn't it?"]
        - title: "Hỏi thật vì chưa chắc"
          explain: "Lên giọng ở đuôi: mình không chắc, cần câu trả lời."
          examples: ["You haven't seen my charger, have you?"]
        - title: "Mượn do/does/did"
          explain: "Câu dùng động từ thường ở hiện tại đơn/quá khứ đơn thì đuôi dùng do/does/did."
          examples: ["She lives in Hanoi, doesn't she?", "They won, didn't they?"]
        - title: "Trường hợp đặc biệt"
          explain: "I am → aren't I; Let's → shall we; There is → isn't there."
          examples:
            ["I'm next, aren't I?", "Let's go, shall we?", "There's a problem, isn't there?"]
      structure:
        forms:
          - {
              label: "Be",
              pattern: "S + is/are…, isn't/aren't + đại từ?",
              example: "They're ready, aren't they?",
            }
          - {
              label: "Hiện tại đơn",
              pattern: "S + V(s)…, don't/doesn't + đại từ?",
              example: "He codes in Go, doesn't he?",
            }
          - {
              label: "Quá khứ đơn",
              pattern: "S + V2…, didn't + đại từ?",
              example: "You called her, didn't you?",
            }
          - {
              label: "Have + V3",
              pattern: "S + have/has + V3…, haven't/hasn't + đại từ?",
              example: "She has left, hasn't she?",
            }
          - {
              label: "Modal",
              pattern: "S + can/will/should…, can't/won't/shouldn't + đại từ?",
              example: "We should wait, shouldn't we?",
            }
        steps:
          - title: "Tìm trợ động từ của câu"
            explain: "Be, have, modal thì lấy lại; không có thì dùng do/does/did theo thì."
            example: "She works here → does"
          - title: "Đảo khẳng định/phủ định"
            explain: "Khẳng định → đuôi phủ định; phủ định (not, never) → đuôi khẳng định."
            example: "She works here, doesn't she? / She doesn't work here, does she?"
          - title: "Dùng đại từ"
            explain: "Đổi danh từ thành đại từ: the tests → they, Lan → she, this → it."
            example: "The tests passed, didn't they?"
      examples:
        - tag: "Be"
          en: "You're coming to the retro, aren't you?"
          vi: "Bạn sẽ đến buổi retro, đúng không?"
          note: "You're = you are → aren't you."
        - tag: "Does"
          en: "She works remotely, doesn't she?"
          vi: "Chị ấy làm việc từ xa, phải không?"
          note: "Hiện tại đơn với she → doesn't she."
        - tag: "Did"
          en: "They didn't call back, did they?"
          vi: "Họ chưa gọi lại, đúng không?"
          note: "Câu phủ định → đuôi khẳng định (did)."
        - tag: "Is"
          en: "It isn't ready yet, is it?"
          vi: "Nó chưa xong đâu, đúng không?"
          note: "Isn't → is it."
        - tag: "Have"
          en: "You haven't seen my headphones, have you?"
          vi: "Bạn không thấy tai nghe của mình đâu, đúng không?"
          note: "Haven't + V3 → have you."
        - tag: "Can"
          en: "We can deploy on Friday, can't we?"
          vi: "Tụi mình deploy vào thứ Sáu được, đúng không?"
          note: "Modal can → can't we."
        - tag: "Quá khứ"
          en: "The tests passed, didn't they?"
          vi: "Test chạy qua rồi, đúng không?"
          note: "Passed (quá khứ đơn) → didn't; the tests → they."
        - tag: "I am"
          en: "I'm late again, aren't I?"
          vi: "Mình lại trễ nữa rồi, đúng không?"
          note: "Trường hợp đặc biệt: I am → aren't I."
      contrast:
        title: "Chọn đuôi"
        rows:
          - { label: "Khẳng định", note: "→ đuôi phủ định", example: "It works, doesn't it?" }
          - { label: "Phủ định", note: "→ đuôi khẳng định", example: "It doesn't work, does it?" }
          - {
              label: "never / nobody",
              note: "nghĩa phủ định → đuôi khẳng định",
              example: "He never complains, does he?",
            }
          - { label: "Let's", note: "→ shall we", example: "Let's take a break, shall we?" }
        fixes:
          - {
              wrong: "She works remotely, isn't she?",
              right: "She works remotely, doesn't she?",
              why: "Động từ thường ở hiện tại đơn → đuôi dùng does, không dùng is.",
            }
          - {
              wrong: "They didn't call back, didn't they?",
              right: "They didn't call back, did they?",
              why: "Câu phủ định thì đuôi khẳng định.",
            }
          - {
              wrong: "You're coming to the retro, are you?",
              right: "You're coming to the retro, aren't you?",
              why: "Câu khẳng định thì đuôi phủ định.",
            }
          - {
              wrong: "I'm late again, am not I?",
              right: "I'm late again, aren't I?",
              why: "Đuôi của I am là aren't I.",
            }
  - slug: g-b1-indirect-questions
    kind: grammar
    title: { en: "Indirect questions", vi: "Câu hỏi gián tiếp" }
    questions:
      [
        g-b1-indirect-questions-1,
        g-b1-indirect-questions-2,
        g-b1-indirect-questions-3,
        g-b1-indirect-questions-4,
        g-b1-indirect-questions-5,
        g-b1-indirect-questions-6,
        g-b1-indirect-questions-7,
        g-b1-indirect-questions-8,
      ]
    grammar:
      title_vi: "Câu hỏi gián tiếp để hỏi lịch sự"
      group: "Cấu trúc câu"
      overview:
        focus: "Để hỏi lịch sự hơn, ta đặt câu hỏi vào sau một cụm mở đầu như Could you tell me…, Do you know…, I'd like to know…. Phần câu hỏi phía sau dùng trật tự câu kể (chủ ngữ + động từ), bỏ do/does/did. Khác với câu tường thuật, ở đây không lùi thì vì ta đang hỏi ngay bây giờ."
        formulas:
          - "Could you tell me / Do you know + wh- + S + V?"
          - "Could you tell me / Do you know + if/whether + S + V?"
          - "I wonder / I'd like to know + wh- + S + V."
        hook: "Could you tell me where the meeting room is?"
      functions:
        - title: "Hỏi đường, hỏi thông tin lịch sự"
          explain: "Dùng với người lạ, khách hàng, cấp trên."
          examples: ["Could you tell me where the lift is?", "Do you know what time it opens?"]
        - title: "Câu hỏi Yes/No"
          explain: "Thêm if hoặc whether."
          examples: ["Do you know if the API is public?"]
        - title: "Tự hỏi, nêu điều mình muốn biết"
          explain: "I wonder…, I'd like to know…, I'm not sure… kết thúc bằng dấu chấm."
          examples: ["I wonder why the build is so slow.", "I'm not sure whether she's free."]
        - title: "Nhờ giải thích"
          explain: "Could you explain how/why…? nhẹ nhàng hơn How/Why…? trực tiếp."
          examples: ["Could you explain how this works?"]
      structure:
        forms:
          - {
              label: "Câu hỏi thường",
              pattern: "Where is the room?",
              example: "Where is the meeting room?",
            }
          - {
              label: "Gián tiếp với be",
              pattern: "… where + S + is?",
              example: "Could you tell me where the meeting room is?",
            }
          - {
              label: "Gián tiếp với do",
              pattern: "… what time + S + V(s)?",
              example: "Do you know what time the shop opens?",
            }
          - {
              label: "Yes/No",
              pattern: "… if/whether + S + V?",
              example: "Can you tell me if the office is open?",
            }
          - {
              label: "Câu kể",
              pattern: "I wonder + wh- + S + V.",
              example: "I wonder who broke the build.",
            }
        steps:
          - title: "Chọn cụm mở đầu"
            explain: "Could you tell me…? Do you know…? Can you tell me…? I wonder…"
            example: "Do you know…"
          - title: "Viết phần sau theo trật tự câu kể"
            explain: "Chủ ngữ trước động từ; bỏ do/does/did nhưng giữ -s/-ed của động từ."
            example: "“When does it start?” → …when it starts?"
          - title: "Dấu câu theo cụm mở đầu"
            explain: "Cụm mở đầu là câu hỏi thì có dấu ?; I wonder / I'd like to know thì dấu chấm."
            example: "Do you know when it starts? / I wonder when it starts."
      examples:
        - tag: "Where"
          en: "Could you tell me where the nearest ATM is?"
          vi: "Bạn có thể cho mình biết cây ATM gần nhất ở đâu không?"
          note: "Is đứng cuối, sau chủ ngữ."
        - tag: "How much"
          en: "I'd like to know how much this course costs."
          vi: "Mình muốn biết khoá học này giá bao nhiêu."
          note: "Bỏ does, động từ giữ -s (costs)."
        - tag: "If"
          en: "Can you tell me if Lan is working today?"
          vi: "Bạn cho mình hỏi hôm nay Lan có đi làm không?"
          note: "Câu hỏi Yes/No → if + S + V."
        - tag: "I wonder"
          en: "I wonder why the tests are so slow."
          vi: "Không biết tại sao test chạy chậm vậy."
          note: "I wonder… là câu kể, dấu chấm."
        - tag: "Giải thích"
          en: "Could you explain how this script works?"
          vi: "Bạn giải thích giúp mình script này chạy thế nào được không?"
          note: "“How does it work?” → how it works."
        - tag: "When"
          en: "Would you mind telling me when the next release is?"
          vi: "Bạn cho mình biết khi nào có bản phát hành tiếp theo được không?"
          note: "Would you mind + V-ing + câu hỏi gián tiếp."
        - tag: "Whether"
          en: "I'm not sure whether they are coming."
          vi: "Mình không chắc họ có đến không."
          note: "Whether = if."
        - tag: "What"
          en: "Could you check what the error message says?"
          vi: "Bạn xem giúp thông báo lỗi ghi gì được không?"
          note: "“What does it say?” → what it says."
      contrast:
        title: "Câu hỏi trực tiếp và gián tiếp"
        rows:
          - {
              label: "Trực tiếp",
              note: "đảo trợ động từ, ngắn, hơi thẳng",
              example: "Where is the station?",
            }
          - {
              label: "Gián tiếp",
              note: "lịch sự, trật tự câu kể",
              example: "Could you tell me where the station is?",
            }
          - {
              label: "Câu tường thuật",
              note: "kể lại câu hỏi đã qua, lùi thì",
              example: "He asked where the station was.",
            }
        fixes:
          - {
              wrong: "Can you tell me where is the station?",
              right: "Can you tell me where the main station is?",
              why: "Phần câu hỏi gián tiếp dùng trật tự câu kể: S + is.",
            }
          - {
              wrong: "Do you know what time does it start?",
              right: "Do you know what time it starts?",
              why: "Bỏ does, động từ thêm -s.",
            }
          - {
              wrong: "Could you tell me if is she free?",
              right: "Could you tell me whether she's free?",
              why: "Sau if/whether: chủ ngữ trước động từ.",
            }
  - slug: g-b1-so-such
    kind: grammar
    title: { en: "So / such … that", vi: "So / such … that" }
    questions:
      [
        g-b1-so-such-1,
        g-b1-so-such-2,
        g-b1-so-such-3,
        g-b1-so-such-4,
        g-b1-so-such-5,
        g-b1-so-such-6,
        g-b1-so-such-7,
        g-b1-so-such-8,
      ]
    grammar:
      title_vi: "So và such … that: đến mức mà"
      group: "Cấu trúc câu"
      overview:
        focus: "So và such đều nhấn mạnh “quá, đến mức”, thường kèm that + kết quả. Khác nhau ở từ theo sau: so + tính từ/trạng từ (so fast), such + (a/an) + tính từ + danh từ (such a fast laptop). Với số lượng: so much/many/few/little + danh từ."
        formulas:
          - "S + be + so + adj + (that) + kết quả"
          - "S + V + so + adv + (that) + kết quả"
          - "such + a/an + adj + N (số ít) · such + adj + N (số nhiều/không đếm được)"
          - "so much/many + N + (that) + kết quả"
        hook: "The demo was so good that the client signed the same day."
      functions:
        - title: "So + tính từ / trạng từ"
          explain: "Không có danh từ ngay sau."
          examples: ["The API is so slow.", "He talks so fast that I can't follow."]
        - title: "Such + cụm danh từ"
          explain: "Danh từ số ít đếm được cần a/an; số nhiều và không đếm được thì không."
          examples:
            ["It's such a good idea.", "They are such nice people.", "It was such bad weather."]
        - title: "So much / so many"
          explain: "Nhấn mạnh số lượng: much với danh từ không đếm được, many với danh từ đếm được số nhiều."
          examples: ["I have so much work.", "There are so many tickets."]
        - title: "Kết quả với that"
          explain: "That có thể bỏ trong văn nói."
          examples: ["I was so tired (that) I went to bed at 8."]
      structure:
        forms:
          - {
              label: "So + adj",
              pattern: "so + tính từ + that…",
              example: "It was so hot that we stayed inside.",
            }
          - {
              label: "So + adv",
              pattern: "V + so + trạng từ + that…",
              example: "She typed so quickly that she made mistakes.",
            }
          - {
              label: "Such a/an",
              pattern: "such + a/an + adj + N số ít",
              example: "It was such an easy task.",
            }
          - {
              label: "Such + N",
              pattern: "such + adj + N số nhiều / không đếm được",
              example: "They give such useful feedback.",
            }
          - {
              label: "Số lượng",
              pattern: "so much/many/few/little + N",
              example: "We had so few users that we shut it down.",
            }
        steps:
          - title: "Ngay sau là gì?"
            explain: "Tính từ/trạng từ đứng một mình → so. Có danh từ → such."
            example: "so long / such a long meeting"
          - title: "Danh từ đếm được số ít?"
            explain: "Thêm a/an sau such."
            example: "such a mess · such an issue"
          - title: "Thêm kết quả"
            explain: "That + mệnh đề chỉ kết quả."
            example: "…that we missed the deadline."
      examples:
        - tag: "So + adj"
          en: "The meeting was so long that I fell asleep."
          vi: "Cuộc họp dài đến mức mình ngủ gục."
          note: "So + tính từ (long)."
        - tag: "Such a"
          en: "It was such a long meeting that I fell asleep."
          vi: "Đó là một cuộc họp dài tới mức mình ngủ gục."
          note: "Such + a + tính từ + danh từ số ít."
        - tag: "Kết quả"
          en: "The new laptop is so fast that builds take seconds."
          vi: "Laptop mới nhanh đến mức build chỉ mất vài giây."
          note: "So fast that + kết quả."
        - tag: "Số nhiều"
          en: "They are such friendly people that everyone wants to join their team."
          vi: "Họ là những người thân thiện tới mức ai cũng muốn vào nhóm của họ."
          note: "Danh từ số nhiều → such, không có a."
        - tag: "So many"
          en: "There were so many bugs that we delayed the release."
          vi: "Có nhiều bug đến mức tụi mình phải hoãn phát hành."
          note: "Bugs đếm được số nhiều → so many."
        - tag: "So much"
          en: "I had so much work that I skipped lunch."
          vi: "Mình nhiều việc tới mức bỏ cả bữa trưa."
          note: "Work không đếm được → so much."
        - tag: "Không đếm được"
          en: "It was such bad weather that the flight was cancelled."
          vi: "Thời tiết tệ đến mức chuyến bay bị huỷ."
          note: "Weather không đếm được → such bad weather, không có a."
        - tag: "Rõ ràng"
          en: "The instructions were so clear that nobody needed help."
          vi: "Hướng dẫn rõ ràng tới mức không ai cần hỏi thêm."
          note: "So + tính từ (clear)."
      contrast:
        title: "So hay such"
        rows:
          - {
              label: "so + adj/adv",
              note: "không có danh từ ngay sau",
              example: "so easy · so quickly",
            }
          - {
              label: "such a/an + adj + N",
              note: "danh từ đếm được số ít",
              example: "such an easy task",
            }
          - {
              label: "such + adj + N",
              note: "số nhiều hoặc không đếm được",
              example: "such easy tasks · such good advice",
            }
          - {
              label: "so much/many + N",
              note: "nhấn mạnh số lượng",
              example: "so many tasks · so much advice",
            }
        fixes:
          - {
              wrong: "It was so a long meeting.",
              right: "It was such a long meeting.",
              why: "Có a + danh từ → such, không phải so.",
            }
          - {
              wrong: "The meeting was such long that I slept.",
              right: "The meeting was so long that I slept.",
              why: "Chỉ có tính từ → so.",
            }
          - {
              wrong: "It was such a bad weather.",
              right: "It was such bad weather.",
              why: "Weather không đếm được nên không có a.",
            }
          - {
              wrong: "There were so much bugs.",
              right: "There were so many bugs.",
              why: "Bugs đếm được số nhiều → many.",
            }
  - slug: g-b1-zero-conditional
    kind: grammar
    title: { en: "Zero conditional", vi: "Câu điều kiện loại 0" }
    questions:
      [
        g-b1-zero-conditional-1,
        g-b1-zero-conditional-2,
        g-b1-zero-conditional-3,
        g-b1-zero-conditional-4,
        g-b1-zero-conditional-5,
        g-b1-zero-conditional-6,
        g-b1-zero-conditional-7,
        g-b1-zero-conditional-8,
      ]
    grammar:
      title_vi: "Câu điều kiện loại 0: sự thật và quy luật"
      group: "Câu điều kiện"
      overview:
        focus: "Câu điều kiện loại 0 nói về điều luôn đúng: quy luật tự nhiên, cách một hệ thống hoạt động, thói quen. Cả hai mệnh đề đều dùng hiện tại đơn. If ở đây gần nghĩa với when (hễ… thì…)."
        formulas:
          - "If/When + S + V (hiện tại đơn), S + V (hiện tại đơn)"
          - "S + V (hiện tại đơn) + if/when + S + V (hiện tại đơn)"
        hook: "If you push to main, the pipeline runs automatically."
      functions:
        - title: "Quy luật tự nhiên, khoa học"
          explain: "Điều luôn xảy ra mỗi khi có điều kiện."
          examples: ["If you heat ice, it melts.", "Water boils if you heat it to 100°C."]
        - title: "Cách hệ thống hoạt động"
          explain: "Mô tả hành vi phần mềm, quy trình, quy định."
          examples: ["If the token expires, the API returns 401."]
        - title: "Thói quen, phản ứng quen thuộc"
          explain: "Hễ có chuyện này là có chuyện kia."
          examples: ["When I'm stressed, I eat chocolate."]
        - title: "Hướng dẫn"
          explain: "Mệnh đề chính có thể là câu mệnh lệnh."
          examples: ["If the page doesn't load, refresh it."]
      structure:
        forms:
          - {
              label: "If trước",
              pattern: "If + hiện tại đơn, hiện tại đơn",
              example: "If you click here, a menu opens.",
            }
          - {
              label: "If sau",
              pattern: "hiện tại đơn + if + hiện tại đơn",
              example: "A menu opens if you click here.",
            }
          - {
              label: "When",
              pattern: "When + hiện tại đơn, hiện tại đơn",
              example: "When it rains, the roads flood.",
            }
          - {
              label: "Phủ định",
              pattern: "If + don't/doesn't…, S + V / can't…",
              example: "If you don't log in, you can't comment.",
            }
          - {
              label: "Mệnh lệnh",
              pattern: "If + hiện tại đơn, V nguyên mẫu",
              example: "If it fails, check the logs.",
            }
        steps:
          - title: "Điều đó có luôn đúng không?"
            explain: "Luôn đúng, mỗi lần → loại 0. Một tình huống cụ thể trong tương lai → loại 1 (will)."
            example: "If you heat ice, it melts. / If it's sunny tomorrow, we'll go out."
          - title: "Hai mệnh đề đều hiện tại đơn"
            explain: "Nhớ -s với he/she/it."
            example: "If the battery dies, the phone turns off."
          - title: "Dấu phẩy"
            explain: "Có dấu phẩy khi if đứng đầu câu."
            example: "If it fails, … / … if it fails."
      examples:
        - tag: "Tự nhiên"
          en: "If you heat ice, it melts."
          vi: "Nếu làm nóng nước đá, nó tan ra."
          note: "Quy luật luôn đúng → hai vế hiện tại đơn."
        - tag: "Thiết bị"
          en: "If the battery is low, the laptop goes into sleep mode."
          vi: "Nếu pin yếu, laptop tự chuyển sang chế độ ngủ."
          note: "Laptop = it → goes."
        - tag: "Thói quen"
          en: "When I drink coffee after 4 p.m., I can't sleep."
          vi: "Hễ uống cà phê sau 4 giờ chiều là mình không ngủ được."
          note: "When = mỗi khi."
        - tag: "Phím tắt"
          en: "If you press Ctrl+S, the editor saves the file."
          vi: "Nếu bấm Ctrl+S thì trình soạn thảo lưu file."
          note: "Mô tả cách phần mềm hoạt động."
        - tag: "Pipeline"
          en: "If a test fails, the pipeline stops."
          vi: "Nếu có test lỗi thì pipeline dừng lại."
          note: "A test = it → fails."
        - tag: "If sau"
          en: "Plants die if they don't get enough water."
          vi: "Cây chết nếu không được tưới đủ nước."
          note: "If đứng sau thì không cần dấu phẩy."
        - tag: "Phủ định"
          en: "If you don't have an account, you can't see the dashboard."
          vi: "Nếu không có tài khoản thì bạn không xem được dashboard."
          note: "Don't + V trong mệnh đề if."
        - tag: "Lần nào cũng vậy"
          en: "My code always breaks when I don't write tests."
          vi: "Lần nào không viết test là code của mình bị lỗi."
          note: "Always + hiện tại đơn: điều lặp lại."
      contrast:
        title: "Loại 0 hay loại 1"
        rows:
          - {
              label: "Loại 0",
              note: "luôn đúng, mỗi lần",
              example: "If you don't water plants, they die.",
            }
          - {
              label: "Loại 1",
              note: "một tình huống cụ thể trong tương lai",
              example: "If you don't water this plant, it'll die.",
            }
          - {
              label: "if ≈ when",
              note: "loại 0 thay được bằng when",
              example: "When you heat ice, it melts.",
            }
        fixes:
          - {
              wrong: "If you heat ice, it will melts.",
              right: "If you heat ice, it melts.",
              why: "Sự thật luôn đúng → hiện tại đơn; và sau will không có -s.",
            }
          - {
              wrong: "If the battery is low, the laptop go into sleep mode.",
              right: "If the battery is low, the laptop goes into sleep mode.",
              why: "The laptop = it → goes.",
            }
          - {
              wrong: "If a test fail, the pipeline stops.",
              right: "If a test fails, the pipeline stops.",
              why: "A test = it → fails.",
            }
          - {
              wrong: "When I will drink coffee, I can't sleep.",
              right: "When I drink coffee, I can't sleep.",
              why: "Không dùng will sau when/if.",
            }
  - slug: g-b1-wish-present
    kind: grammar
    title: { en: "I wish / If only (present)", vi: "I wish / If only ở hiện tại" }
    questions:
      [
        g-b1-wish-present-1,
        g-b1-wish-present-2,
        g-b1-wish-present-3,
        g-b1-wish-present-4,
        g-b1-wish-present-5,
        g-b1-wish-present-6,
        g-b1-wish-present-7,
        g-b1-wish-present-8,
      ]
    grammar:
      title_vi: "Câu ước ở hiện tại: I wish / If only"
      group: "Câu điều kiện"
      overview:
        focus: "Dùng I wish hoặc If only (mạnh hơn) để ước điều trái với thực tế bây giờ. Giống câu điều kiện loại 2, động từ lùi về quá khứ dù nghĩa là hiện tại: have → had, can → could, don't → didn't. Với be, dùng were cho mọi ngôi (văn nói hay dùng was với I/he/she)."
        formulas:
          - "S + wish(es) + S + V2 (quá khứ đơn)"
          - "S + wish(es) + S + could + V"
          - "S + wish(es) + S + were / didn't + V"
          - "If only + S + V2!"
        hook: "I wish we had more time. (Thực tế: tụi mình không có đủ thời gian.)"
      functions:
        - title: "Ước điều trái thực tế"
          explain: "Thực tế ngược lại với điều được ước."
          examples: ["I wish I lived near the office. (Thực tế: nhà xa.)"]
        - title: "Ước có khả năng làm gì"
          explain: "Wish + could + V."
          examples: ["I wish I could play the guitar."]
        - title: "Ước điều gì đó không xảy ra"
          explain: "Wish + didn't + V hoặc wasn't/weren't."
          examples: ["I wish it didn't rain so much here."]
        - title: "If only: nhấn mạnh"
          explain: "Cảm xúc mạnh hơn, thường có dấu chấm than."
          examples: ["If only I had a car!"]
      structure:
        forms:
          - {
              label: "Động từ thường",
              pattern: "wish + S + V2",
              example: "I wish I knew his name.",
            }
          - { label: "Be", pattern: "wish + S + were", example: "I wish we were on holiday." }
          - {
              label: "Can",
              pattern: "wish + S + could + V",
              example: "She wishes she could stay longer.",
            }
          - {
              label: "Phủ định",
              pattern: "wish + S + didn't + V / weren't",
              example: "I wish I didn't have to go.",
            }
          - { label: "If only", pattern: "If only + S + V2!", example: "If only it were Friday!" }
        steps:
          - title: "Xác định thực tế"
            explain: "Thực tế là gì? Điều ước là ngược lại."
            example: "Thực tế: I don't have a car. → I wish I had a car."
          - title: "Lùi động từ về quá khứ"
            explain: "Hiện tại → quá khứ; can → could; is/are → were."
            example: "I can't swim. → I wish I could swim."
          - title: "Wish hay wishes"
            explain: "He/she/it → wishes; động từ sau vẫn ở quá khứ."
            example: "He wishes he had more holidays."
      examples:
        - tag: "Had"
          en: "I wish I had more time for side projects."
          vi: "Ước gì mình có nhiều thời gian hơn cho dự án riêng."
          note: "Thực tế: không có đủ thời gian → had."
        - tag: "Were"
          en: "I wish we were in the same time zone."
          vi: "Ước gì tụi mình ở cùng múi giờ."
          note: "Be → were."
        - tag: "If only"
          en: "If only I knew the answer!"
          vi: "Giá mà mình biết câu trả lời!"
          note: "Know → knew."
        - tag: "Didn't"
          en: "I wish my laptop didn't crash so often."
          vi: "Ước gì laptop của mình không bị treo thường xuyên vậy."
          note: "Doesn't → didn't."
        - tag: "Could"
          en: "She wishes she could speak Japanese."
          vi: "Chị ấy ước gì mình nói được tiếng Nhật."
          note: "Can → could; she → wishes."
        - tag: "Bạn ở đây"
          en: "I wish you were here to help us."
          vi: "Ước gì có bạn ở đây giúp tụi mình."
          note: "You → were."
        - tag: "Than phiền"
          en: "If only the client answered emails faster!"
          vi: "Giá mà khách trả lời email nhanh hơn!"
          note: "Answer → answered: thực tế khách trả lời chậm."
        - tag: "Không phải"
          en: "We wish we didn't have to work this weekend."
          vi: "Tụi mình ước gì không phải làm việc cuối tuần này."
          note: "Have to → didn't have to."
      contrast:
        title: "Wish hay hope"
        rows:
          - {
              label: "wish + V2",
              note: "trái thực tế, khó/không thể xảy ra",
              example: "I wish I had a car.",
            }
          - {
              label: "hope + hiện tại/will",
              note: "có thể xảy ra thật",
              example: "I hope you have a great trip.",
            }
          - { label: "wish + could", note: "ước có khả năng", example: "I wish I could come." }
        fixes:
          - {
              wrong: "I wish I have more time.",
              right: "I wish I had more time.",
              why: "Sau wish lùi về quá khứ: have → had.",
            }
          - {
              wrong: "If only I know the answer!",
              right: "If only I knew the answer!",
              why: "If only + quá khứ đơn.",
            }
          - {
              wrong: "I wish my laptop doesn't crash so often.",
              right: "I wish my laptop didn't crash so often.",
              why: "Doesn't → didn't.",
            }
          - {
              wrong: "She wishes she can speak Japanese.",
              right: "She wishes she could speak Japanese.",
              why: "Can → could.",
            }
  - slug: g-b1-as-as-the-more
    kind: grammar
    title: { en: "As … as, the more … the more", vi: "As … as và the more … the more" }
    questions:
      [
        g-b1-as-as-the-more-1,
        g-b1-as-as-the-more-2,
        g-b1-as-as-the-more-3,
        g-b1-as-as-the-more-4,
        g-b1-as-as-the-more-5,
        g-b1-as-as-the-more-6,
        g-b1-as-as-the-more-7,
        g-b1-as-as-the-more-8,
      ]
    grammar:
      title_vi: "So sánh bằng và so sánh kép"
      group: "Cấu trúc câu"
      overview:
        focus: "As + tính từ/trạng từ + as nghĩa là “bằng, ngang với”; not as … as nghĩa là “không bằng”. So sánh kép the + so sánh hơn …, the + so sánh hơn … diễn tả hai thứ thay đổi cùng nhau: “càng… càng…”. Sau as … as dùng tính từ nguyên dạng, sau the … the dùng dạng so sánh hơn."
        formulas:
          - "S + V + as + adj/adv + as + N"
          - "S + be + not as + adj + as + N"
          - "The + so sánh hơn + S + V, the + so sánh hơn + S + V"
          - "twice / three times + as + adj + as"
        hook: "The more tests we write, the fewer bugs we ship."
      functions:
        - title: "Bằng nhau: as … as"
          explain: "Hai thứ ngang nhau về một đặc điểm."
          examples:
            ["Go is as fast as Rust for this task.", "She speaks English as well as her manager."]
        - title: "Không bằng: not as … as"
          explain: "Thường lịch sự hơn so sánh hơn trực tiếp."
          examples: ["The new design isn't as clear as the old one."]
        - title: "Càng… càng…"
          explain: "The + so sánh hơn ở cả hai vế."
          examples:
            ["The longer you wait, the harder it gets.", "The more I read, the less I understand."]
        - title: "Gấp mấy lần"
          explain: "Twice / three times + as … as."
          examples: ["This server is twice as powerful as the old one."]
      structure:
        forms:
          - {
              label: "Bằng",
              pattern: "as + adj/adv + as",
              example: "It's as cheap as the other plan.",
            }
          - {
              label: "Không bằng",
              pattern: "not as + adj/adv + as",
              example: "It doesn't run as smoothly as before.",
            }
          - {
              label: "Số lượng",
              pattern: "as much/many + N + as",
              example: "We don't have as much time as last year.",
            }
          - {
              label: "Càng… càng",
              pattern: "The + adj-er/more adj …, the + adj-er/more adj …",
              example: "The simpler the code, the easier it is to test.",
            }
          - {
              label: "Gấp lần",
              pattern: "twice / three times as + adj + as",
              example: "It's three times as expensive as Plan A.",
            }
        steps:
          - title: "So sánh bằng: tính từ nguyên dạng"
            explain: "Không dùng -er hay more giữa as … as."
            example: "as fast as (không phải as faster as)"
          - title: "Vế sau dùng as, không dùng than"
            explain: "Than chỉ đi với so sánh hơn."
            example: "as big as · bigger than"
          - title: "So sánh kép: luôn có the ở cả hai vế"
            explain: "Dùng so sánh hơn (-er, more, less, fewer), không dùng so sánh nhất."
            example: "The more, the better. (không phải the most)"
      examples:
        - tag: "Bằng"
          en: "The new API is as fast as the old one."
          vi: "API mới nhanh bằng API cũ."
          note: "As + tính từ nguyên dạng + as."
        - tag: "Không bằng"
          en: "This laptop isn't as heavy as my old one."
          vi: "Laptop này không nặng bằng cái cũ của mình."
          note: "Not as … as: không bằng."
        - tag: "Trạng từ"
          en: "She works as hard as her manager."
          vi: "Chị ấy làm việc chăm chỉ ngang với quản lý của chị."
          note: "As + trạng từ + as."
        - tag: "Càng… càng"
          en: "The more you practise, the more confident you become."
          vi: "Càng luyện tập nhiều, bạn càng tự tin."
          note: "The more …, the more …"
        - tag: "Sớm"
          en: "The sooner we start, the sooner we finish."
          vi: "Bắt đầu càng sớm thì xong càng sớm."
          note: "The + so sánh hơn (sooner) ở cả hai vế."
        - tag: "Rút gọn"
          en: "The bigger the project, the harder it is to estimate."
          vi: "Dự án càng lớn thì càng khó ước lượng."
          note: "Vế đầu có thể bỏ động từ be."
        - tag: "Gấp đôi"
          en: "Our office is twice as big as theirs."
          vi: "Văn phòng tụi mình rộng gấp đôi văn phòng của họ."
          note: "Twice as + tính từ + as."
        - tag: "As many"
          en: "There aren't as many bugs as last month."
          vi: "Số bug không nhiều bằng tháng trước."
          note: "Bugs đếm được → as many … as."
      contrast:
        title: "As … as hay so sánh hơn"
        rows:
          - { label: "as + adj + as", note: "bằng nhau", example: "as fast as" }
          - { label: "not as + adj + as", note: "kém hơn", example: "not as fast as" }
          - {
              label: "adj-er / more adj + than",
              note: "hơn",
              example: "faster than · more stable than",
            }
          - {
              label: "the + -er …, the + -er …",
              note: "càng… càng…",
              example: "the faster, the better",
            }
        fixes:
          - {
              wrong: "The new API is as fast than the old one.",
              right: "The new API is as fast as the old one.",
              why: "As … as, không dùng than.",
            }
          - {
              wrong: "This laptop isn't as heavier as my old one.",
              right: "This laptop isn't as heavy as my old one.",
              why: "Giữa as … as là tính từ nguyên dạng.",
            }
          - {
              wrong: "More you practise, more confident you become.",
              right: "The more you practise, the more confident you become.",
              why: "So sánh kép cần the ở cả hai vế.",
            }
  - slug: g-b1-both-either-neither
    kind: grammar
    title: { en: "Both, either, neither", vi: "Both, either, neither" }
    questions:
      [
        g-b1-both-either-neither-1,
        g-b1-both-either-neither-2,
        g-b1-both-either-neither-3,
        g-b1-both-either-neither-4,
        g-b1-both-either-neither-5,
        g-b1-both-either-neither-6,
        g-b1-both-either-neither-7,
        g-b1-both-either-neither-8,
      ]
    grammar:
      title_vi: "Both, either, neither: nói về hai người, hai vật"
      group: "Liên từ"
      overview:
        focus: "Ba từ này đều nói về đúng hai lựa chọn. Both = cả hai (khẳng định, động từ số nhiều). Either = một trong hai, cái nào cũng được (hoặc dùng sau phủ định: không… cái nào). Neither = không cái nào trong hai (đã mang nghĩa phủ định nên không thêm not)."
        formulas:
          - "both A and B · both + N số nhiều · both of + the/my/them"
          - "either A or B · either + N số ít"
          - "neither A nor B · neither + N số ít"
          - "So/Neither + trợ động từ + S (cũng vậy / cũng không)"
        hook: "Both options work, but neither is cheap."
      functions:
        - title: "Both: cả hai"
          explain: "Both A and B, both + danh từ số nhiều, both of them."
          examples: ["Both Lan and Minh are on leave.", "Both of them use Linux."]
        - title: "Either: một trong hai"
          explain: "Either A or B đưa ra hai lựa chọn; either + danh từ số ít = cái nào cũng được."
          examples: ["You can call me either today or tomorrow.", "Either room is fine."]
        - title: "Neither: không cái nào"
          explain: "Neither A nor B; neither + danh từ số ít. Câu không có not."
          examples: ["Neither option is perfect.", "Neither Tuan nor I have the key."]
        - title: "Cũng không: neither + trợ động từ"
          explain: "Đáp lại một câu phủ định; câu khẳng định thì dùng so."
          examples: ["“I can't come.” “Neither can I.”", "“I'm tired.” “So am I.”"]
      structure:
        forms:
          - {
              label: "Both … and",
              pattern: "Both A and B + V số nhiều",
              example: "Both Go and Rust are fast.",
            }
          - {
              label: "Either … or",
              pattern: "either A or B",
              example: "We can use either Postgres or MySQL.",
            }
          - {
              label: "Neither … nor",
              pattern: "neither A nor B",
              example: "Neither the CEO nor the CTO was there.",
            }
          - {
              label: "Với danh từ",
              pattern: "both + N số nhiều · either/neither + N số ít",
              example: "both rooms · either room · neither room",
            }
          - {
              label: "Of",
              pattern: "both/either/neither + of + the/my/them",
              example: "Neither of them replied.",
            }
        steps:
          - title: "Khẳng định cả hai → both"
            explain: "Đi với and và danh từ số nhiều."
            example: "Both laptops are new."
          - title: "Một trong hai → either"
            explain: "Đi với or; sau câu phủ định nghĩa là “cái nào cũng không”."
            example: "I don't like either colour."
          - title: "Không cái nào → neither"
            explain: "Đi với nor; không thêm not hay don't nữa."
            example: "I like neither colour. (không phải don't like neither)"
      examples:
        - tag: "Both … and"
          en: "Both Lan and Minh speak Japanese."
          vi: "Cả Lan lẫn Minh đều nói được tiếng Nhật."
          note: "Both A and B + động từ số nhiều (speak)."
        - tag: "Either … or"
          en: "You can use either Python or Go for this task."
          vi: "Bạn có thể dùng Python hoặc Go cho việc này."
          note: "Một trong hai lựa chọn."
        - tag: "Neither … nor"
          en: "Neither the client nor the designer likes the new logo."
          vi: "Cả khách lẫn designer đều không thích logo mới."
          note: "Neither … nor: cả hai đều không."
        - tag: "Both of"
          en: "Both of my parents are teachers."
          vi: "Bố mẹ mình đều là giáo viên."
          note: "Both of + my + danh từ số nhiều."
        - tag: "Not … either"
          en: "I don't like either option."
          vi: "Mình không thích phương án nào trong hai cái."
          note: "Sau phủ định dùng either."
        - tag: "Neither + N"
          en: "Neither answer is correct."
          vi: "Cả hai câu trả lời đều không đúng."
          note: "Neither + danh từ số ít + động từ số ít."
        - tag: "Either + N"
          en: "We could meet on Monday or Tuesday. Either day is fine for me."
          vi: "Tụi mình có thể gặp vào thứ Hai hoặc thứ Ba. Ngày nào cũng được với mình."
          note: "Either + danh từ số ít: cái nào cũng được."
        - tag: "Cũng không"
          en: "Tuan can't come, and neither can I."
          vi: "Tuấn không đến được, mình cũng vậy."
          note: "Neither + trợ động từ + chủ ngữ."
      contrast:
        title: "Both, either hay neither"
        rows:
          - { label: "both", note: "cả hai (+)", example: "Both rooms are free." }
          - {
              label: "either",
              note: "một trong hai, cái nào cũng được",
              example: "Either room is free.",
            }
          - {
              label: "not … either",
              note: "không cái nào (phủ định bằng not)",
              example: "I can't use either room.",
            }
          - {
              label: "neither",
              note: "không cái nào (bản thân đã phủ định)",
              example: "Neither room is free.",
            }
        fixes:
          - {
              wrong: "Both Lan and Minh speaks Japanese.",
              right: "Both Lan and Minh speak Japanese.",
              why: "Both A and B là chủ ngữ số nhiều.",
            }
          - {
              wrong: "Neither the client or the designer likes it.",
              right: "Neither the client nor the designer likes it.",
              why: "Neither đi với nor, either đi với or.",
            }
          - {
              wrong: "I don't like neither of the options.",
              right: "I don't like either option.",
              why: "Không dùng hai phủ định; sau don't dùng either.",
            }
  - slug: g-b1-phrasal-verbs
    kind: grammar
    title: { en: "Phrasal verbs: separable or not", vi: "Cụm động từ tách được và không tách được" }
    questions:
      [
        g-b1-phrasal-verbs-1,
        g-b1-phrasal-verbs-2,
        g-b1-phrasal-verbs-3,
        g-b1-phrasal-verbs-4,
        g-b1-phrasal-verbs-5,
        g-b1-phrasal-verbs-6,
        g-b1-phrasal-verbs-7,
        g-b1-phrasal-verbs-8,
      ]
    grammar:
      title_vi: "Cụm động từ: tách được và không tách được"
      group: "Từ loại"
      overview:
        focus: "Cụm động từ (phrasal verb) gồm động từ + tiểu từ (up, off, on, out, after…) và thường mang nghĩa mới. Với loại tách được (turn off, set up, fill in, look up…), tân ngữ danh từ đứng sau hoặc giữa; nhưng đại từ (it, them, him…) bắt buộc đứng giữa. Loại không tách được (look after, look for, run into, deal with…) luôn giữ động từ và tiểu từ liền nhau."
        formulas:
          - "Tách được + danh từ: turn off the light / turn the light off"
          - "Tách được + đại từ: turn it off (không phải turn off it)"
          - "Không tách được: look after the kids / look after them"
        hook: "The alarm is ringing. Can you turn it off?"
      functions:
        - title: "Tách được với danh từ"
          explain: "Danh từ đứng sau hoặc giữa đều đúng."
          examples: ["Please fill in the form.", "Please fill the form in."]
        - title: "Tách được với đại từ"
          explain: "Đại từ luôn nằm giữa động từ và tiểu từ."
          examples: ["Here's the form. Please fill it in.", "I'll pick you up at 8."]
        - title: "Không tách được"
          explain: "Tân ngữ luôn đứng sau cả cụm, dù là danh từ hay đại từ."
          examples: ["I'm looking for my keys.", "Who will deal with this issue?"]
        - title: "Không có tân ngữ"
          explain: "Một số cụm không cần tân ngữ: get up, break down, log in, show up."
          examples: ["The server broke down last night.", "He didn't show up."]
      structure:
        forms:
          - {
              label: "Tách được + N",
              pattern: "V + particle + N · V + N + particle",
              example: "back up the database / back the database up",
            }
          - {
              label: "Tách được + đại từ",
              pattern: "V + it/them/him + particle",
              example: "back it up",
            }
          - {
              label: "Không tách được",
              pattern: "V + particle + N/đại từ",
              example: "look after the server / look after it",
            }
          - { label: "Không tân ngữ", pattern: "V + particle", example: "The car broke down." }
        steps:
          - title: "Học cụm theo nhóm"
            explain: "Tách được: turn on/off, set up, fill in, look up, put off, pick up, give back, figure out. Không tách được: look after, look for, run into, deal with, go over, come across."
            example: "set up (tách được) · look for (không tách)"
          - title: "Tân ngữ là đại từ?"
            explain: "Với cụm tách được, đặt đại từ vào giữa."
            example: "set them up · look it up"
          - title: "Cụm không tách được"
            explain: "Giữ nguyên cụm, tân ngữ đứng sau."
            example: "I ran into her. (không phải ran her into)"
      examples:
        - tag: "Turn off"
          en: "Can you turn it off? It's really loud."
          vi: "Bạn tắt nó đi được không? Ồn quá."
          note: "Đại từ it nằm giữa turn và off."
        - tag: "Set up"
          en: "The new laptops are here. I'll set them up tomorrow."
          vi: "Laptop mới về rồi. Mai mình sẽ cài đặt chúng."
          note: "Set them up: đại từ ở giữa."
        - tag: "Fill in"
          en: "Please fill in this form before the meeting."
          vi: "Vui lòng điền vào mẫu đơn này trước cuộc họp."
          note: "Với danh từ, có thể đặt sau tiểu từ."
        - tag: "Look after"
          en: "Could you look after my cat this weekend?"
          vi: "Cuối tuần này bạn trông con mèo giúp mình được không?"
          note: "Look after không tách được."
        - tag: "Look for"
          en: "I'm looking for my charger. Have you seen it?"
          vi: "Mình đang tìm cục sạc. Bạn có thấy nó không?"
          note: "Look for + tân ngữ, không tách."
        - tag: "Put off"
          en: "We need to put off the release until next month."
          vi: "Tụi mình cần hoãn bản phát hành đến tháng sau."
          note: "Put off = hoãn lại."
        - tag: "Run into"
          en: "I ran into an old classmate yesterday."
          vi: "Hôm qua mình tình cờ gặp một bạn học cũ."
          note: "Run into = tình cờ gặp; không tách được."
        - tag: "Look up"
          en: "If you don't know the word, look it up."
          vi: "Nếu không biết từ đó thì tra từ điển đi."
          note: "Look it up: đại từ ở giữa."
      contrast:
        title: "Vị trí tân ngữ"
        rows:
          - {
              label: "Tách được + danh từ",
              note: "hai vị trí đều đúng",
              example: "turn off the TV / turn the TV off",
            }
          - { label: "Tách được + đại từ", note: "chỉ đặt giữa", example: "turn it off" }
          - { label: "Không tách được", note: "tân ngữ luôn sau cụm", example: "look after it" }
        fixes:
          - {
              wrong: "Can you turn off it, please?",
              right: "Can you turn it off?",
              why: "Đại từ phải nằm giữa động từ và tiểu từ.",
            }
          - {
              wrong: "I'll set up them.",
              right: "I'll set them up tomorrow.",
              why: "Set up tách được → set them up.",
            }
          - {
              wrong: "Could you look my cat after?",
              right: "Could you look after my cat, please?",
              why: "Look after không tách được.",
            }
          - {
              wrong: "I'm looking my charger.",
              right: "I'm looking for my charger.",
              why: "Thiếu tiểu từ for thì nghĩa thay đổi và sai ngữ pháp.",
            }
