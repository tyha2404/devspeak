slug: grammar-a2
stage: grammar
sort: 2
code: A2
kind: grammar
cefr: A2
status: published
title:
  en: Grammar A2 — Updates, Requests & Plans
  vi: Ngữ pháp A2
summary_vi: Kể việc đã làm, mô tả lỗi và thống nhất bước tiếp theo. Dùng câu
  hỏi, so sánh và lời đề nghị để trao đổi trong stand-up, ticket và kế hoạch
  sprint.
