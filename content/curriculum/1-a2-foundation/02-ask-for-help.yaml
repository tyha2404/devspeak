  - slug: s2-task
    kind: task
    mode: write
    title: { en: "Ask Tuấn for help", vi: "Nhiệm vụ: nhờ Tuấn giúp" }
    context:
      - {
          speaker: "Terminal",
          text: "Error: Cannot find module 'dotenv' — npm run dev exited with code 1",
        }
    prompt:
      en: "Your app won't start because of the error above. Write a Slack message to Tuấn: what you're doing, what you've tried, and what you need."
      vi: "App không chạy vì lỗi trên. Viết tin nhắn cho Tuấn: bạn đang làm gì, đã thử gì, cần giúp gì."
    keywords: ["I'm", tried, error, "could you", look]
    model_answer: 'Hi Tuấn, I''m setting up the project locally and npm run dev fails with "Cannot find module ''dotenv''". I''ve tried deleting node_modules and running npm install again, but it still fails. Could you take a look when you have a moment?'
roleplay:
  goal:
    {
      en: "Explain to Tuấn what you're stuck on and what you've tried, then thank him.",
      vi: "Giải thích cho Tuấn bạn đang kẹt ở đâu, đã thử gì, rồi cảm ơn.",
    }
  opener: "Hey, I saw your message. What's going on?"
  target_words: [stuck, tried, take a look]
