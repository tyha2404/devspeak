summary_vi: "Hỏi đúng cách khi bị kẹt: nêu bối cảnh, đã thử gì, và câu hỏi cụ thể."
can_do:
  - "Viết tin nhắn nhờ giúp có đủ bối cảnh, việc đã thử và câu hỏi cụ thể"
