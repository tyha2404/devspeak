lessons:
  - slug: s2-words
    kind: vocab
    title: { en: "Key words", vi: "Từ vựng" }
    senses: [ask-for-help-phr, stuck-adj, take-a-look-phr, bug-n, fix-v]
    questions: [tuan-stuck-meaning, tuan-fill-take-a-look, tuan-fill-bug]
  - slug: s2-focus
    kind: focus
    title: { en: "Asking a good question", vi: "Hỏi sao cho người khác dễ giúp" }
    body_vi: |
      Một câu hỏi tốt trên Slack có **3 phần**:

      1. **Bối cảnh:** *I'm working on the login API and I'm stuck on a CORS error.*
      2. **Đã thử gì:** *I've tried adding the header and restarting the server.* (**I've tried** + V-ing/danh từ)
      3. **Câu hỏi cụ thể:** *Could you take a look when you have a moment?*

      **Can you…?** thân mật, **Could you…?** lịch sự hơn. Thêm *when you have a moment* / *no rush* để không tạo áp lực.
      Gửi kèm log hoặc ảnh chụp màn hình thay vì chỉ viết *"It doesn't work."*
    examples:
      - {
          en: "Quick question: the build fails on CI but passes locally. I've tried clearing the cache. Any ideas?",
          vi: "Hỏi nhanh: build lỗi trên CI nhưng chạy local được. Mình đã thử xóa cache. Có ai biết không?",
        }
      - {
          en: "Could you take a look at my PR when you have a moment? No rush.",
          vi: "Anh xem giúp PR của em lúc rảnh nhé, không gấp.",
        }
    questions: [tuan-order-help, tuan-order-stuck, x-fill-stuck, tuan-fix-slack-1, tuan-fix-slack-2]
  - slug: s2-practice
    kind: practice
