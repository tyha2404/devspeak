slug: report-a-bug
stage: a2-foundation
sort: 6
code: S4
kind: situation
cefr: A2
character: emma
status: published
title: { en: "Report a simple bug", vi: "Báo một lỗi đơn giản" }
summary_vi: "Mô tả lỗi rõ ràng: điều gì xảy ra, điều gì lẽ ra phải xảy ra, và ở đâu."
can_do:
  - "Phân biệt và mô tả expected behavior và actual behavior"
  - "Viết một bug report ngắn trên Slack"
lessons:
  - slug: s4-words
    kind: vocab
    title: { en: "Key words", vi: "Từ vựng" }
    senses: [crash-v, ticket-n, expected-behavior-n, actual-behavior-n]
    questions: [x-ticket-meaning, emma-expected-meaning, emma-fill-crash]
  - slug: s4-bug-report
    kind: dialogue
    title: { en: "Reporting a bug", vi: "Báo bug với Emma" }
    dialogue: emma-bug-report
  - slug: s4-focus
    kind: focus
    title: { en: "Expected vs actual", vi: "Lẽ ra phải… / Thực tế thì…" }
    body_vi: |
      Bug report ngắn gọn luôn có **hai câu đối lập**:

      - **Expected:** *The app **should** show the order list.* (dùng **should** + động từ nguyên mẫu)
      - **Actual:** *It **shows** a blank page. / It **crashes** when I tap "Pay".* (hiện tại đơn)

      Thêm **ở đâu & khi nào**: *on the login page*, *on Android 14*, *after I upload a photo*.
      Nếu lỗi đang diễn ra: *The page **is loading** forever.* (hiện tại tiếp diễn)
    examples:
      - {
          en: "Expected: the user is redirected to the dashboard. Actual: nothing happens.",
          vi: "Mong đợi: người dùng được chuyển tới dashboard. Thực tế: không có gì xảy ra.",
        }
      - {
          en: "The app crashes when I rotate the screen on iOS 17.",
          vi: "App bị crash khi xoay màn hình trên iOS 17.",
        }
    questions: [emma-fill-ticket, x-fill-expected, emma-fix-reproduce, emma-fix-crash]
  - slug: s4-practice
    kind: practice
    title: { en: "Practice", vi: "Luyện tập" }
    questions: [x-reply-crash, emma-order-reproduce, x-crash-meaning]
  - slug: s4-mistakes
    kind: mistakes
    title: { en: "Common mistakes", vi: "Lỗi hay gặp" }
    mistakes: [code-not-work, fix-bug-article]
  - slug: s4-task
    kind: task
    mode: write
    title: { en: "Report a bug to Emma", vi: "Nhiệm vụ: báo bug cho Emma" }
    context:
      - {
          speaker: "You",
          text: '(You click "Save" on the profile page. The spinner turns forever and your changes are lost.)',
        }
    prompt:
      en: "Write a short Slack message to Emma about this bug: where it happens, what you expected, and what actually happened."
      vi: "Viết tin nhắn ngắn cho Emma về bug này: xảy ra ở đâu, bạn mong đợi gì, thực tế ra sao."
    keywords: [expected, actual, save, profile]
    model_answer: 'Hi Emma, I found a bug on the profile page. When I click "Save", the spinner keeps loading and my changes are lost. Expected: the changes are saved and a success message appears. Actual: it loads forever and nothing is saved.'
