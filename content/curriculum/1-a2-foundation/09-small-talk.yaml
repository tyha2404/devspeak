  - slug: s6-focus
    kind: focus
    title: { en: "Answer + detail + question back", vi: "Trả lời + chi tiết + hỏi lại" }
    body_vi: |
      Trả lời *"Yes."* hay *"Fine."* làm cuộc trò chuyện chết ngay. Công thức **A + D + Q**:

      - **A**nswer: *It was great!*
      - **D**etail: *I went hiking near Đà Lạt with some friends.*
      - **Q**uestion back: *How about you? Did you do anything fun?*

      Kể chuyện cuối tuần dùng **quá khứ đơn** (*went, watched, stayed*); nói sở thích dùng **like/love + V-ing** (*I love cooking*).
    examples:
      - {
          en: "Not bad! I stayed home and binge-watched a series. How was yours?",
          vi: "Cũng ổn! Mình ở nhà cày phim. Còn bạn thì sao?",
        }
      - {
          en: "I'm into board games. We play every Friday night.",
          vi: "Mình mê board game, tối thứ Sáu nào cũng chơi.",
        }
    questions:
      [dave-order-weekend, dave-order-hobby, x-order-coffee, dave-fill-busy, dave-fill-coffee]
