  - slug: s6-task
    kind: task
    mode: speak
    title: { en: "How was your weekend?", vi: "Nhiệm vụ: kể về cuối tuần" }
    context:
      - { speaker: "Dave", text: "Morning! How was your weekend? Do anything fun?" }
    prompt:
      en: "Answer Dave with the A + D + Q formula: answer, one or two details, and a question back."
      vi: "Trả lời Dave theo công thức A + D + Q: trả lời, một hai chi tiết, rồi hỏi lại."
    keywords: [weekend, went, "how about you"]
    model_answer: "It was really nice, thanks! I went to a coffee shop with my friends on Saturday and watched a movie on Sunday. How about you? Did you do anything fun?"
roleplay:
  goal:
