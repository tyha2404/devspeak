  - slug: k3-task
    kind: task
    mode: write
    title: { en: "Explain your git flow", vi: "Nhiệm vụ: mô tả quy trình git" }
    prompt:
      en: "A new intern asks how you ship a small fix. Explain your git steps in 3–4 short sentences."
      vi: "Một bạn intern hỏi bạn đưa một bản sửa nhỏ lên như thế nào. Giải thích các bước git trong 3–4 câu ngắn."
    keywords: [branch, commit, push, pull request]
    model_answer: "First, I pull the latest main and create a new branch. Then I make the fix and commit it with a clear message. After that, I push the branch and open a pull request. When someone approves it, I merge it."
