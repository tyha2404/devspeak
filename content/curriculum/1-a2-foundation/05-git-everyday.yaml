  - slug: k3-focus
    kind: focus
    title: { en: "Git verbs & instructions", vi: "Động từ git & câu mệnh lệnh" }
    body_vi: |
      Trong tiếng Anh, dev dùng **chính lệnh git làm động từ**:

      - *I **pulled** the latest changes.* · *Did you **push** your branch?* · *Let me **rebase** on main.*
      - **commit** vừa là động từ (*commit the changes*) vừa là danh từ (*a commit*).
      - **merge conflict** = xung đột khi gộp: *I got a merge conflict in `app.ts`.*

      Hướng dẫn người khác thì dùng **câu mệnh lệnh** (động từ nguyên mẫu đứng đầu):
      *Always **pull** before you **push**.* · ***Create** a new branch for each ticket.*
    examples:
      - {
          en: "Create a branch, commit your changes, push it and open a pull request.",
          vi: "Tạo branch, commit, push rồi mở pull request.",
        }
      - {
          en: "I resolved the merge conflict and pushed again.",
          vi: "Mình đã xử lý conflict và push lại.",
        }
    questions:
      [tuan-order-branch, tuan-fill-pull, tuan-fill-commit, tuan-fill-conflict, x-fill-branch]
  - slug: k3-listening
    kind: listening
    title: { en: "Listen", vi: "Nghe" }
    questions: [tuan-listen-pull]
  - slug: k3-practice
    kind: practice
    title: { en: "Practice", vi: "Luyện tập" }
