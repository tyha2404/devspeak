  - slug: s3-focus
    kind: focus
    title: { en: "Yesterday · Today · Blockers", vi: "Ba câu của standup" }
    body_vi: |
      Standup có **3 câu**, mỗi câu một thì:

      | Phần | Thì | Ví dụ |
      |---|---|---|
      | **Yesterday** | quá khứ đơn | *Yesterday I **finished** the login form.* |
      | **Today** | *I'm going to / I'll* hoặc *I'm working on* | *Today I'**m going to** write the tests.* |
      | **Blockers** | hiện tại đơn | *I'm blocked by the API. / **No blockers.*** |

      Mẹo: nói **kết quả** (*finished, fixed, merged*) thay vì chỉ *"I worked on…"*. Ngắn gọn, khoảng 30–60 giây.
    examples:
      - {
          en: "Yesterday I fixed the checkout bug. Today I'm going to review Emma's PR. No blockers.",
          vi: "Hôm qua mình sửa bug checkout. Hôm nay mình review PR của Emma. Không có blocker.",
        }
      - {
          en: "I'm blocked by the staging server — it's been down since this morning.",
          vi: "Mình bị chặn vì server staging sập từ sáng.",
        }
    questions:
