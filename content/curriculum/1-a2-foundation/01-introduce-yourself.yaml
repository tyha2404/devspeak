lessons:
  - slug: s1-words
    kind: vocab
    title: { en: "Key words", vi: "Từ vựng" }
    senses: [introduce-yourself-phr, onboarding-n, colleague-n, responsible-for-phr]
    questions: [linh-colleague-meaning, x-responsible-meaning, x-fill-colleague]
  - slug: s1-welcome
    kind: dialogue
    title: { en: "Welcome aboard", vi: "Chào mừng gia nhập" }
    dialogue: linh-welcome
  - slug: s1-focus
    kind: focus
    title: { en: "I'm a… / I work on… / I'm responsible for…", vi: "Mẫu câu giới thiệu" }
    body_vi: |
      Một lời giới thiệu tốt ở chỗ làm có **3 phần**, mỗi phần một câu ngắn:

      1. **Tên + vai trò:** *I'm Nam, a backend developer.* (nhớ có **a/an** trước nghề nghiệp)
      2. **Bạn làm gì / làm với gì:** *I mostly work on the payment service.* · *I work with React and Node.js.*
      3. **Phụ trách / mong muốn:** *I'm responsible for the mobile API.* · *I'm looking forward to working with you.*

      Dùng **hiện tại đơn** cho việc thường ngày: *I work…, I build…, I use…* (không phải *I am work*).
    examples:
      - {
          en: "Hi everyone, I'm Lan. I'm a QA engineer and I mostly test the mobile app.",
          vi: "Chào mọi người, mình là Lan, QA, chủ yếu test app mobile.",
        }
      - { en: "I'm responsible for the checkout page.", vi: "Mình phụ trách trang thanh toán." }
    questions:
      [linh-order-introduce, linh-order-responsible, linh-fix-introduce, linh-fix-experience]
  - slug: s1-practice
    kind: practice
    title: { en: "Practice", vi: "Luyện tập" }
    questions: [linh-reply-welcome, linh-listen-onboarding, linh-fill-responsible]
  - slug: s1-mistakes
    kind: mistakes
    title: { en: "Common mistakes", vi: "Lỗi hay gặp" }
    mistakes: [im-developer, dear-sir-slack, negative-question-answer]
  - slug: s1-task
    kind: task
    mode: write
    title: { en: "Say hi to the team", vi: "Nhiệm vụ: chào team trên Slack" }
    context:
      - {
          speaker: "Linh (HR)",
          text: "Everyone, please welcome our new developer! 🎉 Feel free to introduce yourself in #team.",
        }
    prompt:
      en: "Write a short message in #team to introduce yourself: your name, your role, what you work with, and one friendly line."
      vi: "Viết tin nhắn ngắn giới thiệu bản thân: tên, vai trò, công nghệ bạn dùng và một câu thân thiện."
    keywords: ["I'm", developer, work, team, "looking forward"]
    model_answer: "Hi everyone! I'm Minh, a new frontend developer. I mostly work with React and TypeScript, and I'll be on the checkout team. Looking forward to working with you all!"
roleplay:
  goal:
    {
      en: "Introduce yourself to Linh and ask one question about the team.",
      vi: "Giới thiệu bản thân với Linh và hỏi một câu về team.",
    }
  opener: "Hi! You must be our new developer. Welcome! Tell me a bit about yourself?"
  target_words: [introduce, responsible for, colleague]
