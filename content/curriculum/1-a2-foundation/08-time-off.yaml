summary_vi: "Báo cho team khi bạn nghỉ, ốm, đến muộn hoặc mất mạng — ngắn, rõ và lịch sự."
can_do:
  - "Xin nghỉ phép và báo ốm bằng tin nhắn ngắn, lịch sự"
