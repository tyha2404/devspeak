title:
  en: Maps, Logistics & Location-Based Products
  vi: Bản đồ, logistics & sản phẩm vị trí
summary_vi: "Luyện trao đổi yêu cầu bằng một miền sản phẩm cụ thể: bản đồ, đặt
  chuyến, giao hàng và theo dõi vị trí. Kết hợp ngôn ngữ đời sống với dữ liệu,
  trạng thái và trường hợp biên."
can_do:
  - Làm rõ trạng thái và lỗi trong một luồng giao nhận
  - Giải thích dữ liệu vị trí và điều kiện hiển thị cho người dùng
