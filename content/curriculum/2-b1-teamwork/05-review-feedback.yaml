  - slug: s9-tuan-review
    kind: dialogue
    title: { en: "Code review feedback", vi: "Feedback từ Tuấn" }
    dialogue: tuan-code-review
  - slug: s9-focus
    kind: focus
    title: { en: "Thank · Agree/Clarify · Done", vi: "Cảm ơn · Đồng ý/Hỏi lại · Đã sửa" }
    body_vi: |
      Trả lời một comment review thường gồm:

      - **Đồng ý:** *Good catch, thanks!* · *Makes sense — I'll change it.*
      - **Hỏi lại:** *Do you mean we should move this into a hook?* · *Could you clarify what you mean by "too coupled"?*
      - **Giải thích lựa chọn:** *I kept it inline because it's only used once, but happy to extract it.*
      - **Báo đã sửa** bằng **hiện tại hoàn thành:** *I've renamed the variable and added a test.* · *Done in 3f2a1c.*

      Không phản ứng phòng thủ — comment là về **code**, không phải về **bạn**.
    examples:
      - {
          en: "Thanks for the review! I've addressed all comments except the last one — I think we should handle that in a separate PR.",
          vi: "Cảm ơn đã review! Mình đã xử lý hết comment trừ cái cuối — mình nghĩ nên làm ở PR riêng.",
        }
    questions: [tuan-order-review, tuan-fill-naming, raj-order-suggest]
