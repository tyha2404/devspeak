lessons:
  - slug: s12-words
    kind: vocab
    title: { en: "Key words", vi: "Từ vựng" }
    senses: [follow-up-v, as-discussed-phr, clarify-v, eta-n, requirement-n]
    questions: [mike-fill-follow-up, mike-fill-as-discussed, mike-eta-meaning]
  - slug: s12-focus
    kind: focus
    title: { en: "The shape of a work email", vi: "Cấu trúc email công việc" }
    body_vi: |
      1. **Chào:** *Hi Mike,*
      2. **Mục đích (1 câu):** *I'm writing to **follow up on** the export feature.*
      3. **Chi tiết:** *As discussed on Monday, …* (gạch đầu dòng nếu có nhiều ý)
      4. **Hành động mong muốn + hạn:** *Could you **confirm** the file format **by Wednesday**?*
      5. **Kết:** *Thanks, / Best regards,* + tên

      **Follow-up lịch sự** khi chưa có phản hồi: *Just **following up on** my email below — any update on…?* / *Gentle reminder about…*
    examples:
      - {
          en: "Hi Mike, just following up on the CSV question below. Could you let us know by Thursday so we can plan the sprint? Thanks!",
          vi: "Email follow-up mẫu.",
        }
    questions: [mike-order-email, mike-fill-clarify]
  - slug: s12-mistakes
    kind: mistakes
    title: { en: "Common mistakes", vi: "Lỗi hay gặp" }
    mistakes: [please-kindly, sorry-for-late-reply, inform-structure]
  - slug: s12-task
    kind: task
    mode: write
    title: { en: "Follow up with a client", vi: "Nhiệm vụ: follow-up khách hàng" }
    context:
      - {
          speaker: "Situation",
          text: "Last week you asked Mike (client) whether the report should include archived orders. No reply yet. You need the answer by Friday.",
        }
    prompt:
      en: "Write a short, polite follow-up email to Mike."
      vi: "Viết email follow-up ngắn và lịch sự cho Mike."
    keywords: [following up, could you, Friday, thanks]
    model_answer: "Hi Mike,\n\nI'm just following up on my email from last week about the monthly report. Should it include archived orders as well? Could you let us know by Friday so we can finish it in this sprint?\n\nThanks,\nMinh"
