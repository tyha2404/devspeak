  - slug: s10-focus
    kind: focus
    title: { en: "Imperative commit messages", vi: "Commit ở thể mệnh lệnh" }
    body_vi: |
      Quy ước phổ biến: commit message như **một câu lệnh**, động từ nguyên mẫu đứng đầu, viết hoa chữ đầu, không dấu chấm:

      - ✅ *Fix crash when cart is empty* · ✅ *Add CSV export to reports*
      - ❌ *Fixed crash…* · ❌ *Fixes crash…* · ❌ *fix bug*

      Mẹo: câu phải đọc được sau cụm *"If applied, this commit will **…**"*.

      **PR description** gồm 3 phần: **What** (thay đổi gì) · **Why** (vì sao / ticket) · **How to test**.
    examples:
      - {
          en: "Refactor payment service into smaller functions",
          vi: "Tách payment service thành các hàm nhỏ hơn",
        }
      - {
          en: "What: add rate limiting to the login API. Why: we saw brute-force attempts (SEC-42). How to test: send 10 requests in a minute — the 6th returns 429.",
          vi: "PR description mẫu.",
        }
    questions: [tuan-fix-commit-2, tuan-fix-commit-3, x-fix-commit-4, x-order-pr]
  - slug: s10-practice
    kind: practice
    title: { en: "Practice", vi: "Luyện tập" }
    questions: [tuan-fix-commit-1, tuan-refactor-meaning, x-fix-deploy]
  - slug: s10-task
    kind: task
    mode: write
    title: { en: "Write a PR description", vi: "Nhiệm vụ: viết PR description" }
    context:
      - {
          speaker: "Ticket SHOP-118",
          text: "Users can't reset their password if their email has uppercase letters.",
        }
    prompt:
      en: "You fixed SHOP-118 by lower-casing emails before lookup. Write a commit message and a short PR description (what, why, how to test)."
      vi: "Bạn đã sửa SHOP-118 bằng cách chuyển email về chữ thường trước khi tìm. Viết commit message và PR description ngắn (what, why, how to test)."
    keywords: [fix, email, test, why]
    model_answer: "Commit: Fix password reset for emails with uppercase letters\n\nWhat: lower-case the email before looking up the user in the reset flow.\nWhy: users with uppercase letters in their email couldn't reset their password (SHOP-118).\nHow to test: request a reset for \"Test@Example.com\" — the email should arrive and the link should work."
