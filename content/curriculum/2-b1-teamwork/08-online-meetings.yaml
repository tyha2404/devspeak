title: { en: "Online meetings", vi: "Họp online" }
summary_vi: "Xin nhắc lại, làm rõ, chen lời lịch sự, chốt action item — và xử lý sự cố mic/màn hình."
can_do:
  - "Xin nhắc lại hoặc làm rõ khi chưa nghe kịp"
