lessons:
  - slug: s11-words
    kind: vocab
    title: { en: "Key words", vi: "Từ vựng" }
    senses: [agenda-n, action-item-n, sync-up-phr, retro-n]
    questions: [x-agenda-meaning, sarah-action-item-meaning, x-sync-meaning, x-retro-meaning]
  - slug: s11-focus
    kind: focus
    title: { en: "Clarify, interrupt, wrap up", vi: "Làm rõ, chen lời, chốt lại" }
    body_vi: |
      **Chưa nghe kịp:** *Sorry, could you repeat that?* · *You broke up a bit — could you say that again?*
      **Làm rõ:** *Just to clarify, do you mean…?* · *So, if I understand correctly, …*
      **Chen lời lịch sự:** *Sorry to interrupt, but…* · *Can I add something here?*
      **Sự cố online:** *You're on mute.* · *Can you see my screen?* · *I'll drop and rejoin.*
      **Chốt lại:** *To sum up, …* · *Action items: Lan will update the docs by Friday.*
    examples:
      - {
          en: "Just to clarify — are we releasing on Thursday or after the demo?",
          vi: "Cho mình hỏi lại — mình release thứ Năm hay sau buổi demo?",
        }
    questions:
      [sarah-fill-sync, sarah-fill-agenda, x-order-sync, x-fill-action-items, x-reply-agenda]
  - slug: s11-listening
    kind: listening
    title: { en: "Meeting minutes", vi: "Nghe & ghi biên bản" }
    questions: [sarah-minutes-actions, sarah-minutes-deadline, x-listen-retro]
  - slug: s11-practice
    kind: practice
    title: { en: "Practice", vi: "Luyện tập" }
    questions: [sarah-reply-sync, x-fill-retro]
  - slug: s11-mistakes
    kind: mistakes
    title: { en: "Common mistakes", vi: "Lỗi hay gặp" }
    mistakes: [discuss-about, inform-structure]
  - slug: s11-task
    kind: task
    mode: write
    title: { en: "Post the meeting recap", vi: "Nhiệm vụ: gửi tóm tắt cuộc họp" }
    context:
      - {
          speaker: "Your notes",
          text: "Release moved to Thu. Lan: update API docs (Wed). Minh: fix flaky login test. Next sync Mon 10am.",
        }
    prompt:
      en: "Post a short recap in #team from your notes: the decision and the action items with owners and dates."
      vi: "Đăng tóm tắt ngắn trong #team từ ghi chú: quyết định và action item kèm người phụ trách, hạn."
    keywords: [action items, Thursday, will]
    model_answer: "Quick recap of today's sync:\n- We moved the release to Thursday.\nAction items:\n- Lan will update the API docs by Wednesday.\n- Minh will fix the flaky login test.\nNext sync: Monday at 10am. Let me know if I missed anything!"
