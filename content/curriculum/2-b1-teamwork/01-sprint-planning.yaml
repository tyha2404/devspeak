  - slug: s7-task
    kind: task
    mode: write
    title: { en: "Give an estimate", vi: "Nhiệm vụ: đưa ra ước lượng" }
    context:
      - {
          speaker: "Sarah",
          text: "How long do you think the CSV export feature will take? We'd love to ship it this sprint.",
        }
    prompt:
      en: "Reply to Sarah with an estimate, how sure you are, and one risk."
      vi: "Trả lời Sarah: ước lượng, mức độ chắc chắn và một rủi ro."
    keywords: [should, might, risk, days]
    model_answer: "I think it'll take about three days. It should fit in this sprint, but it might take longer if we need to export more than 10,000 rows, because we'd have to do it in the background. The main risk is performance."
