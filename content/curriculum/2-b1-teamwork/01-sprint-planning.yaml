  - slug: s7-focus
    kind: focus
    title: { en: "How sure are you?", vi: "Nói mức độ chắc chắn" }
    body_vi: |
      Khi ước lượng, hãy cho team biết bạn **chắc đến đâu**:

      | Mức độ | Mẫu câu |
      |---|---|
      | Rất chắc | *It **will** take two days.* |
      | Khá chắc | *It **should** be done by Thursday.* · *It'll **probably** take three points.* |
      | Chưa chắc | *It **might** take longer if the API changes.* · *I'm **not sure yet** — I need to check the legacy code.* |

      Luôn kèm **giả định/rủi ro**: *…**as long as** the design is final.* · *The main **risk** is the payment integration.*
    examples:
      - {
          en: "I'd say five points. It should be done by Friday, but it might slip if we need a new endpoint.",
          vi: "Mình đoán 5 điểm. Thứ Sáu chắc xong, nhưng có thể trễ nếu cần endpoint mới.",
        }
    questions: [sarah-fill-estimate, sarah-fill-deadline, sarah-order-track]
