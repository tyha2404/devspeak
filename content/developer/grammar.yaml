    - [
        c1-past-perfect-continuous,
        g-c1-past-perfect-continuous,
        "Giải thích quá trình tích luỹ dẫn tới một sự cố hoặc quyết định trong quá khứ.",
      ]
    - [
        c1-future-perfect,
        g-c1-future-perfect,
        "Nêu đầu ra dự kiến sẽ hoàn thành trước mốc chuyển đổi hệ thống.",
      ]
    - [
        c1-future-perfect-continuous,
        g-c1-future-perfect-continuous,
        "Diễn đạt thời lượng vận hành hoặc thử nghiệm tính tới một mốc tương lai.",
      ]
    - [
        c1-modal-perfect,
        g-c1-modal-perfect,
        "Phân biệt khả năng, nghĩa vụ và nhận xét sau sự kiện trong phân tích kỹ thuật.",
      ]
    - [
        c1-mixed-conditionals,
        g-c1-mixed-conditionals,
        "Liên kết quyết định quá khứ với hệ quả hiện tại khi thảo luận nợ kỹ thuật.",
      ]
    - [
        c1-condition-alternatives,
        g-c1-condition-alternatives,
        "Nêu điều kiện, giả định và ngoại lệ của phương án trong RFC.",
