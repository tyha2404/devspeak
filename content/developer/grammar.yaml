    - [b1-past-perfect, g-b1-past-perfect, "Làm rõ thay đổi nào đã xảy ra trước khi sự cố bắt đầu."]
    - [
        b1-future-continuous,
        g-b1-future-continuous,
        "Thông báo lịch làm việc dự kiến tại một thời điểm trong tương lai.",
