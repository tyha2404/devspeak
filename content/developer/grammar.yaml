- unit: grammar-c1
  title: { en: "Grammar C1 — Architecture & Technical Leadership", vi: "Ngữ pháp C1" }
  summary_vi: "Dẫn dắt thảo luận kỹ thuật bằng lập luận chặt chẽ và văn bản dễ theo dõi. Tập diễn đạt giả định, rủi ro, kiến nghị và quan hệ giữa các ý khi viết RFC hoặc quyết định kiến trúc."
  can_do:
    [
      "Viết RFC có giả định, phương án và điều kiện xem lại quyết định",
      "Phản biện một thiết kế bằng ngôn ngữ chính xác, hợp tác",
    ]
