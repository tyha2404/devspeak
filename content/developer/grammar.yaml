- unit: grammar-a1
  title: { en: "Grammar A1 — Your First Developer Conversations", vi: "Ngữ pháp A1" }
  summary_vi: "Bắt đầu từ câu ngắn để giới thiệu bản thân, mô tả công cụ và cập nhật công việc. Luyện dùng chủ ngữ, động từ và câu hỏi rõ ràng trong tin nhắn nhóm."
  can_do:
    [
      "Giới thiệu vai trò và mô tả trạng thái một tác vụ",
      "Hỏi thông tin cơ bản về ticket, tài khoản và môi trường làm việc",
    ]
  lessons:
    - [
        a1-be-pronouns,
        g-a1-be,
        "Giới thiệu vai trò và nói trạng thái của build, server hoặc ticket.",
      ]
    - [
        a1-object-pronouns,
        g-a1-object-pronouns,
        "Chỉ rõ người nhận tin nhắn, người cần hỗ trợ và đối tượng thao tác.",
      ]
    - [
        a1-nouns,
        g-a1-plurals,
        "Mô tả một hay nhiều file, lỗi và yêu cầu mà không nhầm số ít, số nhiều.",
      ]
    - [
        a1-countability,
        g-a1-countability,
        "Phân biệt information, feedback và advice với những thứ có thể đếm trong công việc.",
      ]
    - [a1-possessives, g-a1-possessives, "Nói rõ tài khoản, thiết bị hoặc phần việc thuộc về ai."]
    - [
        a1-demonstratives,
        g-a1-this-that,
        "Chỉ đúng ticket, dòng log hoặc thay đổi đang được thảo luận.",
      ]
    - [
        a1-articles,
        g-a1-articles,
        "Giới thiệu một API mới rồi nhắc lại đúng API đó trong lời giải thích.",
      ]
    - [a1-quantifiers, g-a1-quantifiers, "Hỏi và nói lượng thời gian, dữ liệu hoặc số lỗi còn lại."]
    - [
        a1-adjectives,
        g-a1-adjectives-adverbs,
        "Phân biệt trạng thái hệ thống với cách hệ thống thực hiện tác vụ.",
      ]
    - [
        a1-frequency,
        g-a1-frequency,
        "Mô tả tần suất review, chạy test và thực hiện một công việc định kỳ.",
      ]
    - [
        a1-prepositions,
        g-a1-prepositions,
        "Nêu đúng giờ họp, ngày release và vị trí tài liệu hoặc thiết bị.",
      ]
    - [
        a1-present-simple,
        g-a1-present-simple,
        "Giải thích thói quen của nhóm và hành vi bình thường của một chức năng.",
      ]
    - [a1-likes, g-a1-likes, "Nói về công nghệ yêu thích và những tác vụ mình muốn làm cùng nhóm."]
    - [
        a1-present-continuous,
        g-a1-present-continuous,
        "Nói mình đang xử lý gì và phân biệt với công việc thường ngày.",
      ]
    - [
        a1-word-order,
        g-a1-word-order,
        "Viết một câu cập nhật có người thực hiện, hành động và đối tượng rõ ràng.",
      ]
    - [
        a1-questions,
        g-a1-questions,
        "Hỏi và phủ định hành vi của tính năng mà không bỏ trợ động từ.",
      ]
    - [
        a1-wh-questions,
        g-a1-wh-questions,
        "Hỏi ai phụ trách, lỗi xảy ra ở đâu và cần hoàn thành khi nào.",
      ]
    - [
        a1-there-is,
        g-a1-there-is,
        "Báo có một lỗi, nhiều cảnh báo hoặc một tuỳ chọn trong giao diện.",
      ]
    - [a1-can-imperatives, g-a1-can, "Nói khả năng của mình và xin hỗ trợ một tác vụ đơn giản."]
- unit: grammar-a2
  title: { en: "Grammar A2 — Updates, Requests & Plans", vi: "Ngữ pháp A2" }
  summary_vi: "Kể việc đã làm, mô tả lỗi và thống nhất bước tiếp theo. Dùng câu hỏi, so sánh và lời đề nghị để trao đổi trong stand-up, ticket và kế hoạch sprint."
  can_do:
    [
      "Kể lại công việc hôm qua và nêu kế hoạch tiếp theo",
      "Mô tả vấn đề, so sánh lựa chọn và đưa lời khuyên đơn giản",
    ]
  lessons:
    - [
        a2-reflexive,
        g-a2-reflexive,
        "Nói ai tự xử lý phần việc nào và tránh nhầm chủ thể nhận hành động.",
      ]
    - [
        a2-past-simple,
        g-a2-past-simple,
        "Báo điều đã sửa, đã thử và đã kiểm tra trong một mốc thời gian đã qua.",
      ]
    - [
        a2-was-were,
        g-a2-was-were,
        "Hỏi trạng thái hệ thống trước sự cố và xác nhận ai có mặt lúc đó.",
      ]
    - [
        a2-prepositions-movement,
        g-a2-prepositions-movement,
        "Mô tả dữ liệu đi qua các bước xử lý và thao tác di chuyển file.",
      ]
    - [a2-future, g-a2-will, "Phân biệt lời hứa, dự đoán và quyết định thực hiện bước tiếp theo."]
    - [
        a2-present-perfect,
        g-a2-present-perfect,
        "Nói trải nghiệm đã từng dùng một công nghệ mà không gán mốc thời gian cụ thể.",
      ]
    - [
        a2-obligation,
        g-a2-must-have-to,
        "Phân biệt điều bắt buộc với việc không cần làm trong quy trình nhóm.",
      ]
    - [
        a2-ed-ing-adjectives,
        g-a2-ed-ing-adjectives,
        "Phân biệt cảm nhận của người dùng với tính chất của một trải nghiệm giao diện.",
      ]
    - [
        a2-adjective-order,
        g-a2-adjective-order,
        "Mô tả thiết bị, tính năng và hệ thống bằng cụm danh từ tự nhiên.",
      ]
    - [
        a2-comparatives,
        g-a2-comparatives,
        "So sánh hai công cụ hoặc cách làm theo một tiêu chí cụ thể.",
      ]
    - [
        a2-superlatives,
        g-a2-superlatives,
        "Xác định phương án phù hợp nhất trong nhóm lựa chọn đã nêu.",
      ]
    - [
        a2-too-enough,
        g-a2-too-enough,
        "Giải thích giới hạn về thời gian, quyền truy cập hoặc năng lực hệ thống.",
      ]
    - [a2-so-such, g-a2-so-such, "Mô tả mức độ ảnh hưởng của một lỗi và kết quả mà nó gây ra."]
    - [
        a2-linkers,
        g-a2-linkers,
        "Nối nguyên nhân, kết quả và lựa chọn trong cập nhật công việc ngắn.",
      ]
    - [
        a2-indefinite-pronouns,
        g-a2-some-any-compounds,
        "Hỏi có ai gặp lỗi hoặc có điều gì thay đổi mà chưa chỉ rõ đối tượng.",
      ]
    - [
        a2-quantifiers,
        g-a2-quantifiers,
        "Trao đổi số yêu cầu, lượng dữ liệu và thời gian cần cho một tác vụ.",
      ]
- unit: grammar-b1
  title: { en: "Grammar B1 — Explain Bugs & Propose Solutions", vi: "Ngữ pháp B1" }
  summary_vi: "Giải thích lỗi, diễn biến công việc và kết quả đã kiểm chứng. Dùng mệnh đề, điều kiện và cách hỏi gián tiếp để làm rõ yêu cầu và đề xuất cách giải quyết."
  can_do:
