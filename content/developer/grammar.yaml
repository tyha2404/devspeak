  lessons:
    - [
        b1-determiners,
        g-b1-both-either-neither,
        "Nói cả hai, một trong hai hoặc không phương án nào đáp ứng yêu cầu.",
      ]
    - [
        b1-past-continuous,
        g-b1-past-continuous,
